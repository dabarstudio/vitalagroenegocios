function mzResumo(D){
  const rec=mzSerie(D,"rec"), res=mzSerie(D,"res"), desp=mzSerie(D,"desp"), ent=mzSerie(D,"ent"), sai=mzSerie(D,"sai"), cx=mzSerie(D,"cx");
  const sm=s=>s?s.v.reduce((a,b)=>a+b,0):null, R=sm(rec), Rs=sm(res);
  let k="";
  if (rec) k+=kpi("Receita", fR(R), mzPerNome());
  if (res) k+=kpi("Resultado", fR(Rs), R?"margem "+fP(Rs/R):"");
  if (ent) k+=kpi("Entradas de caixa", fR(sm(ent)), mzPerNome());
  if (sai) k+=kpi("Saídas de caixa", fR(-Math.abs(sm(sai))), mzPerNome());
  if (cx) k+=kpi("Saldo de caixa", fR(cx.v[cx.v.length-1]), "fim de "+cx.lab[cx.lab.length-1]);
  (D.kpis||[]).forEach(x=>k+=kpi(x.t,x.v,x.s));
  let h=k?`<div class="kpis">${k}</div>`:"";
  if (rec && (res||desp)) { const d = desp ? desp.v.map(v=>-Math.abs(v)) : rec.v.map((v,i)=>-(v-(res.v[i]||0)));
    h+=`<div class="card"><h3 class="pnt">Receita, despesas e resultado por mês</h3>${grafico(rec.lab,[{nome:"Receita",v:rec.v,cor:COR.rec},{nome:"Despesas",v:d,cor:COR.desp},...(res?[{nome:"Resultado",v:res.v,cor:COR.res,linha:1}]:[])],{})}<p class="note">Fonte: DRE da planilha de gestão.</p></div>`; }
  if (ent && sai) h+=`<div class="card"><h3 class="pnt">Entradas e saídas de caixa por mês</h3>${grafico(ent.lab,[{nome:"Entradas",v:ent.v,cor:COR.rec},{nome:"Saídas",v:sai.v.map(v=>-Math.abs(v)),cor:COR.desp},...(cx?[{nome:"Saldo final",v:cx.v,cor:COR.res,linha:1}]:[])],{})}<p class="note">Fonte: DFC da planilha de gestão.</p></div>`;
  if (!h) h=`<div class="card"><p class="note">Abra as abas acima para ver os demonstrativos.</p></div>`;
  return h;
}
function mzTabela(D,t,ti){
  const idx=mzIdx(t); if (!idx.length) return `<div class="card"><h3 class="pnt">${esc(t.titulo)}</h3><p class="note">Sem dados no período escolhido.</p></div>`;
  // grupos: cada linha "grp" abre/fecha as linhas "item" logo abaixo dela
  let grp=-1; const pai=t.linhas.map((l,i)=>{ if (l.t==="grp") { grp=i; return -1; } if (l.t==="item") return grp; grp=-1; return -1; });
  const temGrp=pai.some(x=>x>=0);
  const showTot = t.meses || t.tot!==false;
  let h=`<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><h3 class="pnt" style="margin:0">${esc(t.titulo)}${t.meses?" · "+esc(mzPerNome()):""}</h3>
    <div class="row" style="gap:6px">${temGrp?`<button class="btn sm ghost" data-mzab="${ti}">Abrir tudo</button>`:""}<button class="btn sm ghost" data-mzcsv="${ti}">Baixar planilha (CSV)</button></div></div>
    ${t.ctrl||""}${t.nota?`<p class="note">${esc(t.nota)}</p>`:""}${temGrp?`<p class="note">Toque numa linha com ▸ para abrir o grupo.${mzTemLc(D,t)?" Toque no nome de uma conta sublinhada para ver os lançamentos, ou num valor para ver os lançamentos daquele mês.":""}</p>`:""}
    <div class="tw"><table class="dre"><thead><tr><th>Conta</th>${idx.map(i=>`<th>${esc(mzCol(t,i))}</th>`).join("")}${showTot&&t.meses?"<th>Total</th>":""}</tr></thead><tbody>`;
  t.linhas.forEach((l,i)=>{
    if (l.oculto) return; if (pai[i]>=0 && !MZ.ab[ti+":"+pai[i]]) return;
    const cls = l.t==="tot"?"dt dtf": l.t==="saldo"?"dt": l.t==="grp"?"dg": l.t==="cab"?"dsub": l.t==="rot"?"di": l.t==="pct"?"di":"dcat";
    const nv = l.t==="item" ? (pai[i]>=0?2:1) : l.t==="rot" ? 1 : 0;
    const tg = l.t==="grp" && t.linhas.some((x,j)=>pai[j]===i) ? `<span class="tg">${MZ.ab[ti+":"+i]?"▾":"▸"}</span>` : "";
    const cel = (x,j) => { if (x==null||x==="") return `<td></td>`; if (typeof x==="string") return `<td>${esc(x)}</td>`; const dc=t.dec&&t.dec[j]; if (l.t==="pct"||dc==="%") return `<td class="${x<0?"neg":""}">${fP(x)}</td>`; if (dc) return `<td class="${x<0?"neg":""}">${Math.abs(x)<0.005?"–":x.toLocaleString("pt-BR",{minimumFractionDigits:dc,maximumFractionDigits:dc})}</td>`; return `<td class="${x<0?"neg":""}">${fN(x)}</td>`; };
    const tot = showTot&&t.meses ? mzTot(t,l,idx) : undefined;
    const lc = mzLcDe(D,t,l);
    h+=`<tr class="${cls}${lc?" lc":""}" ${tg?`data-mzg="${ti}:${i}"`:""}${lc?` data-mzl="${ti}:${i}"`:""}><td style="padding-left:${8+nv*16}px">${tg}${lc?`<button type="button" class="lcb" data-mzl="${ti}:${i}">${esc(l.n)}</button>`:esc(l.n)}</td>${l.t==="cab"?idx.map(()=>"<td></td>").join(""):idx.map(j=>lc?cel(l.v[j],j).replace("<td",`<td data-mzm="${j}"`):cel(l.v[j],j)).join("")}${tot===undefined?"":tot==null?"<td></td>":`<td class="${tot<0?"neg":""}"><b>${l.t==="pct"?"":fN(tot)}</b></td>`}</tr>`;
  });
  return h+`</tbody></table></div></div>`;
}
function mzLigar(D){ const b=$("#pnBody"); if(!b) return;
  b.querySelectorAll("[data-cmp]").forEach(s=>s.onchange=()=>{ const [ti,k]=s.dataset.cmp.split(":"); MZ.cmp[ti][k]=s.value; mzCorpo(); });
  b.querySelectorAll("[data-mzg]").forEach(tr=>tr.onclick=()=>{ const k=tr.dataset.mzg; MZ.ab[k]=!MZ.ab[k]; mzCorpo(); });
  b.querySelectorAll("tr[data-mzl]").forEach(tr=>tr.onclick=e=>{ const [ti,i]=tr.dataset.mzl.split(":").map(Number), td=e.target.closest("td[data-mzm]"); mzLanc(D,ti,i,td?+td.dataset.mzm:null); });
  b.querySelectorAll("[data-mzab]").forEach(x=>x.onclick=()=>{ const ti=+x.dataset.mzab, t=D.tabs[ti]; const ks=t.linhas.map((l,i)=>l.t==="grp"?ti+":"+i:null).filter(Boolean); const abrir=!ks.some(k=>MZ.ab[k]); ks.forEach(k=>MZ.ab[k]=abrir); mzCorpo(); });
  b.querySelectorAll("[data-mzcsv]").forEach(x=>x.onclick=()=>mzCsv(D,mzVer(D.tabs[+x.dataset.mzcsv],+x.dataset.mzcsv)));
}
function mzCsv(D,t){ const idx=mzIdx(t), f=v=>v==null||v===""?"":typeof v==="number"?v.toFixed(2).replace(".",","):String(v);
  const L=[["Conta",...idx.map(i=>t.cols[i]),...(t.meses?["Total"]:[])]];
  t.linhas.forEach(l=>L.push([(l.t==="item"?"   ":"")+l.n,...idx.map(i=>f(l.v[i])),...(t.meses?[f(mzTot(t,l,idx))]:[])]));
  const csv="﻿"+L.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=`${t.titulo} ${P.emp} ${mzPerNome()}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  reg("baixar_painel", P.emp).catch(()=>{});
}

/* ===== detalhe dos lançamentos de uma conta (quando o painel traz a base de lançamentos) ===== */
const mzLcDe = (D,t,l) => (D.lanc && t.lcc && l.lk && D.lanc.l[t.lcc+"|"+l.lk]) || null;
const mzTemLc = (D,t) => !!(D.lanc && t.lcc && t.linhas.some(l=>mzLcDe(D,t,l)));
const fRc = v => (v<0?"−":"")+"R$ "+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function mzLanc(D,ti,i,mi){
  const t=D.tabs[ti], l=t.linhas[i], L=mzLcDe(D,t,l); if(!L) return;
  const meses = mi!=null ? [t.cols[mi]] : mzIdx(t).map(j=>t.cols[j]);
  const sel = L.filter(x=>meses.includes(x[0]));
  const porMes = {}; sel.forEach(x=>(porMes[x[0]]=porMes[x[0]]||[]).push(x));
  const ordem = Object.keys(porMes).sort().reverse();
  const tot = sel.reduce((a,x)=>a+x[4],0);
  const dem = (mi!=null ? [mi] : mzIdx(t)).reduce((a,j)=>a+(+l.v[j]||0),0);
  const per = mi!=null ? mesC(t.cols[mi]) : mzPerNome();
  let h = `<div class="lch"><div><div class="eyebrow">${esc(t.titulo)}</div><h3 style="margin:2px 0 0">${esc(l.n)}</h3><p class="note" style="margin:2px 0 0">${esc(per)} · ${sel.length} lançamento${sel.length===1?"":"s"} · total <b>${fRc(tot)}</b></p></div>
    <button type="button" class="btn sm ghost" data-lcx aria-label="Fechar">Fechar</button></div>`;
  if (!sel.length) h += `<p class="note">Nenhum lançamento desta conta no período.</p>`;
  if (Math.abs(tot-dem)>=1) h += `<p class="note lcw">A soma dos lançamentos (${fRc(tot)}) é diferente do valor do demonstrativo (${fRc(dem)}). A diferença vem de ajustes feitos direto na planilha de gestão.</p>`;
  h += ordem.map(m=>{ const xs=porMes[m].slice().sort((a,b)=>(b[1].slice(6)+b[1].slice(3,5)+b[1].slice(0,2)).localeCompare(a[1].slice(6)+a[1].slice(3,5)+a[1].slice(0,2)));
    const st=xs.reduce((a,x)=>a+x[4],0);
    return `<div class="lcm"><div class="lcmh"><b>${esc(mesC(m))}</b><span>${fRc(st)}</span></div>${xs.map(x=>`<div class="lci"><div class="lcl"><b>${esc(x[1]||"sem data")}</b><span class="${x[4]<0?"neg":""}">${fRc(x[4])}</span></div><div class="lcd">${esc(x[2]||"Sem fornecedor")}${x[3]?" · "+esc(x[3]):""}</div><div class="lcd note">${x[5]?"Conta: "+esc(x[5]):""}${x[6]?" · Nota "+esc(x[6]):""}</div></div>`).join("")}</div>`; }).join("");
  h += `<div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px"><span class="note" style="margin:0">Fonte: ${esc(D.lanc.fonte||"planilha de gestão")}</span>${sel.length?`<button type="button" class="btn sm ghost" data-lccsv>Baixar (CSV)</button>`:""}</div>`;
  let d=document.getElementById("mzLc"); if(!d){ d=document.createElement("dialog"); d.id="mzLc"; d.className="lcdlg"; document.body.appendChild(d); d.addEventListener("click",e=>{ if(e.target===d) d.close(); }); }
  d.innerHTML=h; d.querySelector("[data-lcx]").onclick=()=>d.close();
  const c=d.querySelector("[data-lccsv]"); if(c) c.onclick=()=>{ const f=v=>v.toFixed(2).replace(".",","); const linhas=[["Mês","Data","Fornecedor","Descrição","Valor","Conta","Nota"],...sel.map(x=>[x[0],x[1],x[2],x[3],f(x[4]),x[5],x[6]])];
    const csv="\ufeff"+linhas.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=`${l.n} ${P.emp} ${per}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
  d.showModal(); reg("ver_lancamentos", P.emp+" · "+l.n).catch(()=>{});
}

boot();
})();
</script>
