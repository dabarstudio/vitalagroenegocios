<style>
:root{color-scheme:light;

*{box-sizing:border-box}[hidden]{display:none!important}

.field label{font-weight:600;font-size:.88rem}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--fg);text-decoration:none}

.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:2px}

tr.dneg td:nth-child(2){box-shadow:inset 4px 0 0 var(--bad)}tr.dpos td:nth-child(2){box-shadow:inset 4px 0 0 var(--ok)}

.pb,.pl{display:grid;gap:6px;align-content:start;min-width:0}
.pm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}

.ci.on{border-color:var(--brand);background:var(--ok-bg)}.ci .cd{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media print{.top,.noprint,.rodape{display:none!important}body{background:#fff}.card{border:0;padding:0}table.res th{position:static}}

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = (v) => v == null || isNaN(v) ? "" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const dBR = (d) => d ? d.split("-").reverse().join("/") : "";
const dias = (a, b) => Math.round((new Date(a + "T12:00") - new Date(b + "T12:00")) / 864e5);
const addD = (d, n) => { const x = new Date(d + "T12:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
let tT; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => t.hidden = true, 4500); };
const CFG = window.VITAL_CONFIG || {};
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const S = { user: null, nome: "", equipe: false, empresas: [], empresa: "", bancos: [], base: null, tol: 3, res: null, filtro: "", salvoId: null, hist: [], compor: false, sel: new Set(), selRes: new Set(), busca: { b: "", l: "" }, vis: (() => { try { return localStorage.getItem("conc.vis") || "lado"; } catch { return "lado"; } })() };

/* ================= leitura de números e datas ================= */
function num(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return isFinite(v) ? v : null;
  let s = String(v).trim(); if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (/\s*[dD]$/.test(s)) { neg = true; s = s.replace(/\s*[dD]$/, ""); }
  s = s.replace(/\s*[cC]$/, "");
  s = s.replace(/R\$|\s/g, "");
  if (/^-/.test(s) || /-$/.test(s)) { neg = !neg ? true : neg; s = s.replace(/-/g, ""); }
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  if (!/^\d*\.?\d+$/.test(s)) return null;
  const n = Number(s); if (!isFinite(n)) return null;
  return Math.round((neg ? -n : n) * 100) / 100;
}
function data(v, anoPadrao) {
  if (v == null || v === "") return null;
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  if (typeof v === "number" && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/);
  if (m) { let a = m[3] ? +m[3] : anoPadrao; if (!a) return null; if (a < 100) a += 2000; const dd = +m[1], mm = +m[2]; if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return null; return `${a}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`; }
  m = s.match(/^(\d{4})(\d{2})(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
const normTxt = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function semelhanca(a, b) {
  const tok = (s) => new Set(normTxt(s).split(/[^a-z0-9]+/).filter((w) => w.length > 2 && !/^\d+$/.test(w)));
  const A = tok(a), B = tok(b); if (!A.size || !B.size) return 0;
  let i = 0; A.forEach((w) => { if (B.has(w)) i++; }); return i / Math.min(A.size, B.size);
}

/* ================= leitores de arquivo ================= */
async function lerTexto(file) {
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) t = new TextDecoder("windows-1252").decode(buf);
  return t;
}
function lerOFX(t) {
  const tag = (bloco, k) => { const m = bloco.match(new RegExp("<" + k + ">([^<\\r\\n]*)", "i")); return m ? m[1].trim() : ""; };
  const itens = [];
  const blocos = t.split(/<STMTTRN>/i).slice(1);
  for (const b0 of blocos) {
    const b = b0.split(/<\/STMTTRN>/i)[0];
    const d = data(tag(b, "DTPOSTED")); const v0 = Number(tag(b, "TRNAMT").replace(",", ".")); const v = isFinite(v0) && tag(b, "TRNAMT") !== "" ? Math.round(v0 * 100) / 100 : null;
    if (!d || v == null) continue;
    const memo = [tag(b, "NAME"), tag(b, "MEMO")].filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join(" · ");
    itens.push({ data: d, desc: memo || tag(b, "TRNTYPE"), valor: v, doc: tag(b, "CHECKNUM") || tag(b, "FITID") });
  }
  const saldo = num((t.match(/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]*)/i) || [])[1]?.replace(",", "."));
  const dtSaldo = data((t.match(/<LEDGERBAL>[\s\S]*?<DTASOF>([^<\r\n]*)/i) || [])[1]);
  const ini = data((t.match(/<DTSTART>([^<\r\n]*)/i) || [])[1]), fim = data((t.match(/<DTEND>([^<\r\n]*)/i) || [])[1]);
  const banco = (t.match(/<ORG>([^<\r\n]*)/i) || [])[1] || (t.match(/<BANKID>([^<\r\n]*)/i) || [])[1] || "";
  const conta = (t.match(/<ACCTID>([^<\r\n]*)/i) || [])[1] || "";
  return { itens, saldo, dtSaldo, ini, fim, banco: [banco, conta].filter(Boolean).join(" · conta ") };
}
async function lerPlanilha(file) {
  if (/\.(csv|txt)$/i.test(file.name)) {
    const t = await lerTexto(file);
    const linhas = t.split(/\r?\n/).filter((l) => l.trim());
    const sep = [";", "\t", ","].map((s) => [s, (linhas[0] || "").split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
    return linhas.map((l) => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map((x) => x.trim()); });
  }
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
  let melhor = null;
  for (const nm of wb.SheetNames) { const rows = XLSX.utils.sheet_to_json(wb.Sheets[nm], { header: 1, raw: true, defval: "" }); if (!melhor || rows.length > melhor.length) melhor = rows; }
  return melhor || [];
}
async function lerPDF(file) {
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const linhas = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    const porY = new Map();
    for (const it of tc.items) { if (!it.str.trim()) continue; const y = Math.round(it.transform[5] / 2); if (!porY.has(y)) porY.set(y, []); porY.get(y).push(it); }
    [...porY.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) => linhas.push(its.sort((a, b) => a.transform[4] - b.transform[4]).map((i) => i.str.trim()).join(" ")));
  }
  const txt = linhas.join("\n");
  const anoM = txt.match(/\b(20\d{2})\b/); const ano = anoM ? +anoM[1] : new Date().getFullYear();
  const DIN = /-?\s?(?:R\$\s?)?\d{1,3}(?:\.\d{3})*,\d{2}\s?[-DdCc]?(?![\d,])/g;
  const itens = []; let ult = null;
  for (const l of linhas) {
    const md = l.match(/^\s*(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)\s+(.*)$/);
    const corpo = md ? md[2] : null;
    if (md) ult = data(md[1], ano);
    if (!corpo || !ult) continue;
    if (/saldo\s+(anterior|do dia|final|em)|^saldo\b/i.test(corpo)) continue;
    const vals = corpo.match(DIN); if (!vals) continue;
    const v = num(vals[0].replace(/\s/g, "")); if (v == null || v === 0) continue;
    const desc = corpo.slice(0, corpo.indexOf(vals[0])).trim();
    itens.push({ data: ult, desc: desc || "(sem descrição)", valor: v, doc: "" });
  }
  return { itens, aviso: "Extrato lido de PDF: confira algumas linhas antes de conciliar (PDF não tem formato padrão)." };
}

/* ================= reconhecimento de colunas ================= */
function acharCabecalho(rows) {
  let best = 0, bi = 0;
  rows.slice(0, 25).forEach((r, i) => { const s = r.map(normTxt).join("|"); const p = ["data", "valor", "descr", "hist", "lanc", "debito", "credito", "entrada", "saida", "status", "situa", "favorec", "categoria"].filter((k) => s.includes(k)).length; if (p > best) { best = p; bi = i; } });
  return bi;

function abrirArquivo(qual) { const inp = qual === "banco" ? $("#fBanco") : $("#fBase"); inp.value = ""; inp.click(); }

async function lerTabela(file) {
  const rows = await lerPlanilha(file); const header = acharCabecalho(rows); const mapa = { header, ...sugerirMapa(rows[header] || []) };
  return { rows, mapa, status: new Set() };
}
async function carregarExtratos(files) {
  let n = 0;
  for (const file of files) {
    toast("Lendo " + file.name + "…");
    try {
      const nome = file.name, base = nome.replace(/\.[^.]+$/, ""); let E;
      if (/\.ofx$/i.test(nome)) { const o = lerOFX(await lerTexto(file)); E = { nome, rotulo: o.banco || base, itens: o.itens, ini: o.ini, fim: o.fim, saldo: o.saldo, dtSaldo: o.dtSaldo }; }
      else if (/\.pdf$/i.test(nome)) { const p = await lerPDF(file); E = { nome, rotulo: base, itens: p.itens, aviso: p.aviso }; }
      else if (/\.(xlsx|xls|csv|txt)$/i.test(nome)) { const t = await lerTabela(file); E = { nome, rotulo: base, ...t }; E.itens = linhasDaTabela(E.rows, E.mapa); }
      else { toast("Formato não aceito: " + nome); continue; }
      E.chave = ""; S.bancos.push(E); n++;
    } catch (err) { console.error(err); toast("Não consegui ler " + file.name + ": " + (err.message || err)); }
  }
  if (n) { S.res = null; S.salvoId = null; render(); toast(n + " extrato(s) carregado(s)."); }
}
async function carregarBase(file) {
  if (!/\.(xlsx|xls|csv|txt)$/i.test(file.name)) { toast("Use Excel ou CSV para a planilha."); return; }
  try {
    const t = await lerTabela(file); const obj = { nome: file.name, ...t };
    if (obj.mapa.status >= 0) { const vals = [...new Set(obj.rows.slice(obj.mapa.header + 1).map((r) => String(r[obj.mapa.status] ?? "").trim()).filter(Boolean))]; vals.filter((v) => /confirm|pago|recebid|realiz|concil|quitad|baixad|liquid/i.test(normTxt(v))).forEach((v) => obj.status.add(v)); }

const enxuto = (x) => x && { data: x.data, desc: x.desc, valor: x.valor, banco: x.banco || "", doc: x.doc || "", lote: x.lote || "", linha: x.linha || null, uid: x.uid };
async function salvar() {
  const R = S.res, it = R.itens;
  const resumo = { conc: it.filter((r) => ["c", "s", "m", "l"].includes(r.tipo)).length, data: it.filter((r) => r.tipo === "d").length, valor: it.filter((r) => r.tipo === "v").length, banco: it.filter((r) => r.tipo === "b").length, planilha: it.filter((r) => r.tipo === "p").length, pend: it.filter((r) => pendente(r) && !r.ok).length, tol: R.tol, saldos: R.saldos };

    itens: it.map((r) => ({ tipo: r.tipo, bx: r.bx.map(enxuto), l: r.l.map(enxuto), dif: r.dif, dd: r.dd, como: r.como || "", taxa: r.taxa || 0, ajuste: r.ajuste, ok: !!r.ok, obs: r.obs || "" })), atualizado_em: new Date().toISOString() };
  const q = S.salvoId ? sb.from("conc_conciliacoes").update(row).eq("id", S.salvoId).select("id").single() : sb.from("conc_conciliacoes").insert(row).select("id").single();

}
async function abrirHist(id) {
  const { data: h, error } = await sb.from("conc_conciliacoes").select("*").eq("id", id).single();
  if (error || !h) { toast("Não consegui abrir."); return; }
  const itens = (h.itens || []).map((r) => ({ ...r, bx: r.bx || (r.b ? [r.b] : []), l: r.l || [] }));
  const rs = h.resumo || {};

}
function exportarExcel() {
  const R = S.res, j = (a, f) => a.map(f).join(" | ");
  const linhas = R.itens.map((r) => { const v0 = (r.bx[0] || r.l[0] || {}).valor; return { "Situação": NOME[r.tipo], "Banco": [...new Set(r.bx.map((x) => x.banco).concat(r.l.map((x) => x.banco)).filter(Boolean))].join(" | "), "Tipo (D/C)": v0 == null ? "" : v0 < 0 ? "D" : "C",
    "Data banco": j(r.bx, (x) => dBR(x.data)), "Descrição banco": j(r.bx, (x) => x.desc), "Valor banco": r.bx.length === 1 ? r.bx[0].valor : j(r.bx, (x) => x.valor),
    "Data planilha": j(r.l, (x) => dBR(x.data)), "Descrição planilha": j(r.l, (x) => x.desc), "Valor planilha": r.l.length === 1 ? r.l[0].valor : j(r.l, (x) => x.valor),
    "Linha na planilha": j(r.l, (x) => x.linha || ""), "Diferença": ["v", "b", "p", "m", "l"].includes(r.tipo) ? r.dif : "", "Ajuste sugerido": r.ajuste, "Resolvido": r.ok ? "Sim" : "", "Observação": r.obs || "" }; });
