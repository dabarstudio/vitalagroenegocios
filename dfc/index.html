<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00582F">
<meta name="robots" content="noindex">
<title>Fechamento DFC · Vital Agro & Negócios</title>
<link rel="icon" href="/vitalagroenegocios/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: mesma barra da Área do cliente; coluna principal com semáforo + última versão, depois a atualização e os apontamentos; histórico no fim */
:root{
  color-scheme:light;
  --bg:#F3F6F1; --surface:#FFFFFF; --surface-2:#E8EFE4; --line:#D3DECD;
  --fg:#18241B; --muted:#57665A; --brand:#00582F; --brand-2:#007941; --leaf:#79C25B; --on-brand:#FFFFFF;
  --warn:#9A6200; --warn-bg:#FFF3D6; --bad:#B3261E; --bad-bg:#FBE4E1; --ok:#1F7A3F; --ok-bg:#E1F2E5; --info:#2F6FA6; --info-bg:#E3EDF6;
  --lamp-off:#C9D3C6; --red:#D93A2B; --green:#2FA352;
  --display:"Poppins","Segoe UI",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:ui-monospace,Consolas,monospace; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#17221A; --surface-2:#1F2D23; --line:#2E4034; --fg:#E6EEE7; --muted:#9DB0A2;
  --brand:#5FBF7F; --brand-2:#79C25B; --on-brand:#0B1A10; --warn:#F2C062; --warn-bg:#3A2E12; --bad:#F2A097; --bad-bg:#3D1C19; --ok:#7FD39A; --ok-bg:#163522; --info:#8DB9E3; --info-bg:#1B2A38;
  --lamp-off:#2E4034; --red:#F0604F; --green:#4CC66F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17221A; --surface-2:#1F2D23; --line:#2E4034; --fg:#E6EEE7; --muted:#9DB0A2;
  --brand:#5FBF7F; --brand-2:#79C25B; --on-brand:#0B1A10; --warn:#F2C062; --warn-bg:#3A2E12; --bad:#F2A097; --bad-bg:#3D1C19; --ok:#7FD39A; --ok-bg:#163522; --info:#8DB9E3; --info-bg:#1B2A38;
  --lamp-off:#2E4034; --red:#F0604F; --green:#4CC66F; color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.wrap{max-width:1020px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;border:1px solid var(--line);text-decoration:none}
.logo img{width:36px}
.brandtxt{min-width:0}
.brandtxt b{font-family:var(--display);display:block;color:var(--brand)}
.brandtxt span{font-size:.8rem;color:var(--muted)}
.spacer{flex:1}
.top a.tab{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap;text-decoration:none}
.top a.tab:hover{background:var(--surface-2);color:var(--brand)}
main{padding-block:20px 48px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.stack{display:grid;gap:14px;align-content:start}
.muted,.note{color:var(--muted)} .note{font-size:.88rem;margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;color:var(--fg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.92rem}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.callout{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;font-size:.93rem}
.err{color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.mono{font-family:var(--mono);font-size:.85em;white-space:nowrap}

/* ===== semáforo ===== */
.topo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.topo{grid-template-columns:minmax(0,1fr)}}
.sem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.poste{background:#1E2A22;border-radius:18px;padding:10px;display:grid;gap:10px;width:62px}
.lamp{width:42px;height:42px;border-radius:50%;background:var(--lamp-off);opacity:.35;transition:opacity .2s,box-shadow .2s}
.lamp.r.on{background:var(--red);opacity:1;box-shadow:0 0 18px var(--red)}
.lamp.g.on{background:var(--green);opacity:1;box-shadow:0 0 18px var(--green)}
.sem h2{font-size:1.25rem}
.sem .q{color:var(--muted);font-size:.95rem}
.ver b{font-family:var(--display)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.93rem}
.kv span:nth-child(odd){color:var(--muted)}

/* ===== etapas da atualização ===== */
.passos{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.passos li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.95rem}
.passos .ic{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.passos li[data-s="rodando"] .ic{border-color:var(--brand-2);border-top-color:transparent;animation:gira 1s linear infinite}
.passos li[data-s="ok"] .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.passos li[data-s="ok"] .ic::after{content:"✓"}
.passos li[data-s="erro"] .ic{background:var(--bad);border-color:var(--bad);color:#fff}
.passos li[data-s="erro"] .ic::after{content:"!"}
.passos .st{color:var(--muted);font-size:.85rem;text-align:right}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.passos li[data-s="rodando"] .ic{animation:none}}

/* ===== apontamentos ===== */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.tile .k{font:700 .72rem var(--display);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font:700 1.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.t-alta{background:var(--bad-bg);color:var(--bad)} .t-media{background:var(--warn-bg);color:var(--warn)}
.t-baixa{background:var(--surface-2);color:var(--muted)} .t-info{background:var(--info-bg);color:var(--info)}
.sev{display:inline-block;font:700 .7rem/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:5px 7px;border-radius:4px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{font-weight:600;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.acao{color:var(--muted);font-size:.86rem}
details.det summary{cursor:pointer;color:var(--brand);font-weight:700;font-size:.85rem;margin-top:4px}
details.det table{font-size:.82rem;margin-top:6px}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.at{background:var(--ok-bg);color:var(--ok)}
</style>
<script src="/vitalagroenegocios/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="/vitalagroenegocios/dfc/engine.js?v=1"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/vitalagroenegocios/" title="Página inicial da Vital"><img src="/vitalagroenegocios/logo.png" alt="Vital Agro &amp; Negócios"></a>
    <div class="brandtxt"><b>Fechamento DFC</b><span id="subEmp">VitalDFC · Área do cliente</span></div>
    <div class="spacer"></div>
    <select id="selEmp" aria-label="Fazenda" hidden></select>
    <a class="tab" href="/vitalagroenegocios/cliente/">Área do cliente</a>
  </div>
</header>

<main class="wrap" id="app">
  <div class="card"><p class="note">Carregando…</p></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const dataHora = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
const tam = (n) => n == null ? "" : n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(1).replace(".", ",") + " MB";
const hojeISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4000); }

const CFG = window.VITAL_CONFIG || {};
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
const S = { user: null, perfil: null, empresas: [], emp: null, sem: null, pode: false, versoes: [], ultima: null, eventos: [], filtro: "Todas", rodando: false, cx: null };
const SEVC = { Alta: "alta", "Média": "media", Baixa: "baixa", Info: "info" };

/* ---------- servidor ---------- */
async function fn(corpo) {
  const { data, error } = await sb.functions.invoke("dfc-connectere", { body: corpo });
  if (error) { let m = error.message, cod = 0; try { cod = error.context.status; const j = await error.context.json(); m = j.erro || m; } catch {} const e = new Error(m); e.codigo = cod; throw e; }
  if (data && data.erro) throw new Error(data.erro);
  return data;
}
const rpc = async (nome, args) => { const { data, error } = await sb.rpc(nome, args); if (error) throw new Error(error.message); return data; };

/* ---------- início ---------- */
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = "/vitalagroenegocios/cliente/?volta=/vitalagroenegocios/dfc/"; return; }
  S.user = session.user;
  const { data: perfil } = await sb.from("perfis").select("papel, nome, email, login").eq("user_id", S.user.id).maybeSingle();
  S.perfil = perfil || { papel: "", nome: S.user.email };
  const { data: emps, error } = await sb.from("dfc_empresas").select("*").order("empresa");
  if (error) return falhaGeral("Não foi possível abrir o VitalDFC: " + error.message);
  S.empresas = emps || [];
  if (!S.empresas.length) return falhaGeral("Seu acesso ainda não inclui o Fechamento DFC. Fale com a Vital.");
  let salvo = null; try { salvo = localStorage.getItem("dfc.emp"); } catch {}
  S.emp = S.empresas.find((e) => e.empresa === salvo) || S.empresas[0];
  const sel = $("#selEmp");
  if (S.empresas.length > 1) {
    sel.hidden = false;
    sel.innerHTML = S.empresas.map((e) => `<option${e.empresa === S.emp.empresa ? " selected" : ""}>${esc(e.empresa)}</option>`).join("");
    sel.onchange = () => { if (S.rodando) { sel.value = S.emp.empresa; return; } S.emp = S.empresas.find((e) => e.empresa === sel.value); try { localStorage.setItem("dfc.emp", S.emp.empresa); } catch {} S.cx = null; carregar(); };
  }
  await carregar();
  setInterval(() => { if (!S.rodando && document.visibilityState === "visible") atualizarSemaforo(); }, 30000);
}
function falhaGeral(msg) { $("#app").innerHTML = `<div class="card stack"><h2 style="font-size:1.2rem">Fechamento DFC</h2><p>${esc(msg)}</p><div><a class="btn" href="/vitalagroenegocios/cliente/">Voltar para a Área do cliente</a></div></div>`; }

async function carregar() {
  $("#subEmp").textContent = S.emp.empresa + " · VitalDFC";
  const E = S.emp.empresa;
  const [sem, pode, vers, evs] = await Promise.all([
    sb.from("dfc_semaforo").select("*").eq("empresa", E).maybeSingle(),
    sb.rpc("dfc_edita", { p_empresa: E }),
    sb.from("dfc_versoes").select("id, caminho, nome_arquivo, tamanho, origem, resumo, criado_por_nome, criado_em").eq("empresa", E).order("criado_em", { ascending: false }).limit(20),
    sb.from("dfc_eventos").select("nome, acao, detalhe, em").eq("empresa", E).order("em", { ascending: false }).limit(12)]);
  S.sem = sem.data; S.pode = !!pode.data; S.versoes = vers.data || []; S.eventos = evs.data || [];
  S.ultima = null;
  const comAp = await sb.from("dfc_versoes").select("id, apontamentos, criado_em, criado_por_nome").eq("empresa", E).not("apontamentos", "is", null).order("criado_em", { ascending: false }).limit(1).maybeSingle();
  S.apont = comAp.data;
  render();
}
async function atualizarSemaforo() {
  const { data } = await sb.from("dfc_semaforo").select("*").eq("empresa", S.emp.empresa).maybeSingle();
  const antes = JSON.stringify(S.sem); S.sem = data;
  if (antes !== JSON.stringify(data)) carregar();
}
const ativo = (s) => s && s.user_id && new Date(s.expira) > new Date();
const meu = () => ativo(S.sem) && S.sem.user_id === S.user.id;

/* ---------- tela ---------- */
function render() {
  const s = S.sem, eu = meu(), outro = ativo(s) && !eu, admin = S.perfil.papel === "admin";
  const v = S.versoes[0];
  $("#app").innerHTML = `
  <div class="topo">
    <section class="card sem" aria-live="polite">
      <div class="poste" aria-hidden="true"><div class="lamp r${outro ? " on" : ""}"></div><div class="lamp g${!outro ? " on" : ""}"></div></div>
      <div class="stack" style="gap:8px">
        <div class="eyebrow">Semáforo da fazenda</div>
        <h2>${eu ? "A fazenda está com você" : outro ? `Em uso por ${esc(s.nome)}` : "Fazenda livre"}</h2>
        <p class="q" style="margin:0">${eu ? `Desde ${hora(s.desde)} · vale até ${hora(s.expira)}. Só você pode atualizar e enviar versões agora. Ao terminar, libere a fazenda.`
          : outro ? `Desde ${dataHora(s.desde)}, com reserva até ${hora(s.expira)}. Ninguém mais altera a planilha até ${esc(s.nome.split(" ")[0])} liberar.`
          : S.pode ? "Pegue a fazenda para atualizar as bases ou enviar uma versão. Enquanto estiver com você, o semáforo fica vermelho para os outros." : "Você pode consultar e baixar a última versão. A atualização é feita pela Vital e por quem ela autorizar."}</p>
        <div class="row">
          ${eu ? `<button class="btn" id="bRenovar">Renovar reserva</button><button class="btn primary" id="bLiberar">Liberar a fazenda</button>`
            : outro ? (admin ? `<button class="btn danger" id="bForcar">Forçar liberação</button>` : "")
            : S.pode ? `<button class="btn primary" id="bPegar">Pegar a fazenda</button>` : ""}
        </div>
        <div id="confForcar" class="callout stack" hidden><span>Liberar a fazenda que está com ${esc(s && s.nome)}? Se a pessoa estiver no meio de uma atualização, ela perde o que não salvou.</span><div class="row"><button class="btn danger sm" id="bForcarSim">Liberar mesmo assim</button><button class="btn sm" id="bForcarNao">Cancelar</button></div></div>
        <p class="note err" id="semErr" role="alert"></p>
      </div>
    </section>
    <section class="card stack ver">
      <div class="eyebrow">Última versão da planilha</div>
      ${v ? `<div><b>${esc(v.nome_arquivo)}</b></div>
        <div class="kv"><span>Salva em</span><span>${dataHora(v.criado_em)}</span><span>Por</span><span>${esc(v.criado_por_nome)}</span>
          <span>Origem</span><span>${v.origem === "atualizacao" ? '<span class="tag at">Bases atualizadas pelo Connectere</span>' : '<span class="tag">Versão enviada</span>'}</span><span>Tamanho</span><span>${tam(v.tamanho)}</span></div>
        <div class="row"><button class="btn primary" data-baixar="${v.id}">Baixar planilha</button></div>`
      : `<p class="note">Nenhuma versão no portal ainda. ${S.pode ? "Pegue a fazenda e envie a planilha atual para começar." : "A Vital vai enviar a primeira."}</p>`}
    </section>
  </div>

  ${eu ? `<section class="card stack" id="cxCard">
    <div><div class="eyebrow">Com a fazenda</div><h2 style="font-size:1.15rem">Atualizar as bases pelo Connectere</h2></div>
    <p class="note">O portal entra no Connectere com o seu login, baixa o Livro Caixa de 01/01/${new Date().getFullYear()} até hoje, os Empréstimos (obtidos e disponibilizados) e as Transferências, divide as exportações que passam de 1.000 registros e salva uma nova versão da planilha. A senha vai direto para o Connectere e não fica guardada.</p>
    <form id="fCx" class="grid2" novalidate ${S.cx ? "hidden" : ""}>
      <div class="field"><label for="cxEmail">E-mail do Connectere</label><input id="cxEmail" type="email" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="cxSenha">Senha do Connectere</label><input id="cxSenha" type="password" autocomplete="current-password"></div>
      <div class="row" style="grid-column:1/-1"><button class="btn primary" type="submit" id="bAtualizar" ${v ? "" : "disabled"}>Entrar e atualizar as bases</button>${v ? "" : '<span class="note">Envie a planilha atual primeiro.</span>'}</div>
    </form>
    ${S.cx ? `<div class="row"><button class="btn primary" id="bAtualizar2" ${S.rodando ? "disabled" : ""}>Atualizar as bases de novo</button><span class="note">Conectado ao Connectere nesta página.</span></div>` : ""}
    <ol class="passos" id="passos" hidden></ol>
    <p class="note err" id="cxErr" role="alert"></p>
    <div id="cxOk"></div>
    <details><summary class="note" style="cursor:pointer;font-weight:600">Enviar uma versão editada no Excel</summary>
      <div class="stack" style="margin-top:10px">
        <p class="note">Depois de mexer na planilha no Excel, envie aqui para ela virar a última versão. Use sempre a versão baixada deste portal como ponto de partida.</p>
        <div class="row"><input type="file" id="fEnvio" accept=".xlsm,.xlsx"><button class="btn" id="bEnviar">Enviar versão</button></div>
        <p class="note" id="envMsg" role="status"></p>
      </div>
    </details>

  <section class="card stack">

      ${S.versoes.map((x) => `<tr><td>${esc(x.nome_arquivo)}</td><td class="mono">${dataHora(x.criado_em)}</td><td>${esc(x.criado_por_nome)}</td><td>${x.origem === "atualizacao" ? "Atualização" : "Envio"}</td><td class="num"><button class="btn sm" data-baixar="${x.id}">Baixar</button></td></tr>`).join("")}

    ${S.eventos.length ? `<details><summary class="note" style="cursor:pointer;font-weight:600">Uso do semáforo</summary><div class="tablewrap" style="margin-top:8px"><table><tbody>

function ligar() {
  const on = (id, f) => { const el = $("#" + id); if (el) el.onclick = f; };
  on("bPegar", () => semaforo(() => rpc("dfc_pegar", { p_empresa: S.emp.empresa }), "A fazenda está com você."));
  on("bRenovar", () => semaforo(() => rpc("dfc_pegar", { p_empresa: S.emp.empresa }), "Reserva renovada."));
  on("bLiberar", () => { if (S.rodando) { toast("Espere a atualização terminar."); return; } S.cx = null; semaforo(() => rpc("dfc_liberar", { p_empresa: S.emp.empresa, p_forcar: false }), "Fazenda liberada. Obrigado!"); });
  on("bForcar", () => { $("#confForcar").hidden = false; });
  on("bForcarNao", () => { $("#confForcar").hidden = true; });
  on("bForcarSim", () => semaforo(() => rpc("dfc_liberar", { p_empresa: S.emp.empresa, p_forcar: true }), "Fazenda liberada."));
  document.querySelectorAll("[data-baixar]").forEach((b) => b.onclick = () => baixarVersao(+b.dataset.baixar, b));
  const f = $("#fCx"); if (f) f.addEventListener("submit", (e) => { e.preventDefault(); atualizar(); });
  on("bAtualizar2", () => atualizar());
  on("bEnviar", enviarVersao);
}
async function semaforo(acao, msg) {
  try { await acao(); toast(msg); } catch (e) { $("#semErr").textContent = e.message; return; }
  await carregar();
}

async function baixarVersao(id, btn) {

/* ---------- atualização pelo Connectere ---------- */
const PASSOS = [["cx", "Entrar no Connectere"], ["lc", "Livro Caixa"], ["ob", "Empréstimos obtidos"], ["di", "Empréstimos disponibilizados"], ["tr", "Transferências"], ["pl", "Atualizar a planilha"], ["sv", "Salvar a nova versão"]];
function passo(k, s, txt = "") {
  const li = $(`#passos li[data-k="${k}"]`); if (!li) return;
  li.dataset.s = s; $(".st", li).textContent = txt;
}
function registros(tipo, exp) {
  if (tipo === "lc") return exp.rows.length;
  return new Set(exp.rows.map((r) => r[0]).filter((x) => x !== null && x !== "")).size;
}
const meio = (a, b) => { const x = new Date(a + "T12:00:00Z").getTime(), y = new Date(b + "T12:00:00Z").getTime(); return new Date((x + y) / 2).toISOString().slice(0, 10); };
const diaSeg = (d) => new Date(new Date(d + "T12:00:00Z").getTime() + 864e5).toISOString().slice(0, 10);

async function exportar(tipo, ini, fim, rotulo) {
  const E = S.emp.empresa;
  let r = await fn({ acao: "iniciar", empresa: E, sessao: S.cx, tipo, ini, fim }); S.cx = r.sessao;
  if (!r.arquivo) {
    const t0 = Date.now(), tarefa = r.tarefa;
    for (;;) {
      await espera(4000);
      if (Date.now() - t0 > 40 * 60e3) throw new Error("O Connectere demorou demais para gerar " + rotulo + ". Tente de novo mais tarde.");
      r = await fn({ acao: "consultar", empresa: E, sessao: S.cx, tarefa }); S.cx = r.sessao;
      if (r.status === "pronta") break;
      if (r.status === "erro") throw new Error("O Connectere não conseguiu gerar " + rotulo + ".");
      passo(tipo, "rodando", `na fila do Connectere · ${Math.floor((Date.now() - t0) / 60e3)} min`);
    }
    r = await fn({ acao: "baixar", empresa: E, sessao: S.cx, link: r.link }); S.cx = r.sessao;
  }
  const buf = Uint8Array.from(atob(r.arquivo), (c) => c.charCodeAt(0)).buffer;
  return { buf, exp: VDFC.lerExportacao(XLSX, buf) };
}
/* Baixa a base inteira; se bater no limite de 1.000, divide o período ao meio até caber. */
async function exportarCompleta(tipo, rotulo) {
  const lim = VDFC.CFG.limite, partes = [];
  const tudo = await exportar(tipo, null, null, rotulo);
  if (registros(tipo, tudo.exp) < lim) return [{ nome: `${tipo}.xlsx`, exp: tudo.exp, tipo }];
  const h = hojeISO(), m0 = meio("2000-01-01", h);
  const fila = [["2000-01-01", m0], [diaSeg(m0), h]];
  while (fila.length) {
    const [a, b] = fila.shift();
    passo(tipo, "rodando", `dividindo por período · ${a.split("-").reverse().join("/")} a ${b.split("-").reverse().join("/")}`);
    const p = await exportar(tipo, a, b, rotulo);
    const n = registros(tipo, p.exp);
    if (n >= lim) { if (a === b) throw new Error(`${rotulo}: mais de ${lim} registros num só dia.`); const m = meio(a, b); fila.unshift([a, m], [diaSeg(m), b]); continue; }
    if (n) partes.push({ nome: `${tipo}_${a}_${b}.xlsx`, exp: p.exp, tipo });
  }
  return partes;
}

async function atualizar() {
  if (S.rodando) return;
  const err = $("#cxErr"); err.textContent = ""; $("#cxOk").innerHTML = "";
  const v = S.versoes[0]; if (!v) { err.textContent = "Envie a planilha atual primeiro."; return; }
  S.rodando = true;
  const btns = [$("#bAtualizar"), $("#bAtualizar2"), $("#bLiberar")].filter(Boolean); btns.forEach((b) => b.disabled = true);
  const lista = $("#passos"); lista.hidden = false;
  lista.innerHTML = PASSOS.map(([k, t]) => `<li data-k="${k}" data-s=""><span class="ic"></span><span>${t}</span><span class="st"></span></li>`).join("");
  let atual = "cx";
  try {
    await rpc("dfc_pegar", { p_empresa: S.emp.empresa }); // renova a reserva antes de começar
    if (!S.cx) {
      passo("cx", "rodando");
      const email = $("#cxEmail").value.trim(), senha = $("#cxSenha").value;
      if (!email || !senha) throw new Error("Informe e-mail e senha do Connectere.");
      S.cx = (await fn({ acao: "entrar", empresa: S.emp.empresa, email, senha })).sessao;
      $("#cxSenha").value = "";
    }
    passo("cx", "ok", "conectado");
    const exps = [], hoje = hojeISO(), ano = hoje.slice(0, 4);
    atual = "lc"; passo("lc", "rodando", `01/01/${ano} a ${hoje.split("-").reverse().join("/")}`);
    const lc = await exportar("lc", `${ano}-01-01`, hoje, "o Livro Caixa");
    exps.push({ nome: "livro_caixa.xlsx", exp: lc.exp, tipo: "lc" });
    passo("lc", "ok", `${registros("lc", lc.exp).toLocaleString("pt-BR")} lançamentos`);
    for (const [k, rot] of [["ob", "os empréstimos obtidos"], ["di", "os empréstimos disponibilizados"], ["tr", "as transferências"]]) {
      atual = k; passo(k, "rodando", "exportando");
      const partes = await exportarCompleta(k, rot);
      exps.push(...partes);
      const n = partes.reduce((s, p) => s + registros(k, p.exp), 0);
      passo(k, "ok", `${n.toLocaleString("pt-BR")} registros${partes.length > 1 ? ` em ${partes.length} exportações` : ""}`);
    }
    atual = "pl"; passo("pl", "rodando", "baixando a última versão");
    const { data: blob, error } = await sb.storage.from("dfc").download(v.caminho);
    if (error) throw new Error("Não consegui abrir a última versão: " + error.message);
    passo("pl", "rodando", "substituindo as bases");
    const res = await VDFC.processar({ JSZip, XLSX, planilhaBuf: await blob.arrayBuffer(), exportacoes: exps, responsavel: S.perfil.nome || "Portal", origem: "PORTAL VITALDFC" });
    passo("pl", "rodando", "compactando");
    const bytes = await res.zip.generateAsync({ type: "uint8array", compression: "DEFLATE", compressionOptions: { level: 6 } });
    passo("pl", "ok", "bases substituídas");
    atual = "sv"; passo("sv", "rodando", tam(bytes.length));
    const nome = nomeVersao(v.nome_arquivo);
    const caminho = await subir(bytes, nome);
    const resumo = { livro_caixa: res.bases.lc.length, obtidos: res.bases.ob.length, disponibilizados: res.bases.di.length, transferencias: res.bases.tr.length, ano_inicial: res.anoIni, exportacoes: exps.map((e) => e.nome) };
    await rpc("dfc_registrar_versao", { p_empresa: S.emp.empresa, p_caminho: caminho, p_nome: nome, p_tamanho: bytes.length, p_origem: "atualizacao", p_resumo: resumo, p_apontamentos: res.apontamentos });
    passo("sv", "ok", nome);
    S.rodando = false;
    await carregar();
    $("#cxOk").innerHTML = `<div class="callout stack"><b>Bases atualizadas e nova versão salva.</b><span>Livro Caixa: ${resumo.livro_caixa.toLocaleString("pt-BR")} lançamentos de ${resumo.ano_inicial} · Empréstimos: ${(resumo.obtidos + resumo.disponibilizados).toLocaleString("pt-BR")} · Transferências: ${resumo.transferencias.toLocaleString("pt-BR")}. Os apontamentos estão logo abaixo. Ao abrir no Excel, a planilha recalcula e atualiza as tabelas dinâmicas. Se fizer ajustes, salve e envie a versão editada. Ao terminar, libere a fazenda.</span></div>`;
    toast("Nova versão salva.");
  } catch (e) {
    passo(atual, "erro", "");
    if (e.codigo === 401 && /Connectere/.test(e.message)) S.cx = null;
    S.rodando = false;
    const f = $("#fCx"); if (f && !S.cx) f.hidden = false;
    err.textContent = e.message || String(e);
  } finally {
    S.rodando = false;
    btns.forEach((b) => { if (document.body.contains(b)) b.disabled = false; });
  }
}
function nomeVersao(anterior) {
  const base = String(anterior || "DFC.xlsm").replace(/\.(xlsm|xlsx)$/i, "").replace(/[_ ]?(atualizada_)?\d{4}-\d{2}-\d{2}(_\d{4})?$/i, "");
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${base}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsm`;
}
async function subir(bytes, nome) {
  const caminho = `${S.emp.pasta}/${Date.now()}_${nome.normalize("NFD").replace(/[^\w.\-]+/g, "_")}`;
  const { error } = await sb.storage.from("dfc").upload(caminho, new Blob([bytes], { type: "application/vnd.ms-excel.sheet.macroEnabled.12" }), { contentType: "application/vnd.ms-excel.sheet.macroEnabled.12", upsert: false });
  if (error) throw new Error("Não consegui salvar a planilha no portal: " + error.message);
  return caminho;
}
async function enviarVersao() {
  const f = $("#fEnvio").files[0], msg = $("#envMsg");
  if (!f) { msg.textContent = "Escolha o arquivo da planilha."; return; }
  if (!/\.(xlsm|xlsx)$/i.test(f.name)) { msg.textContent = "Envie um arquivo .xlsm ou .xlsx."; return; }
  const b = $("#bEnviar"); b.disabled = true; msg.textContent = "Enviando " + tam(f.size) + "…";
  try {
    await rpc("dfc_pegar", { p_empresa: S.emp.empresa });
    const bytes = new Uint8Array(await f.arrayBuffer());
    const caminho = await subir(bytes, f.name);
    await rpc("dfc_registrar_versao", { p_empresa: S.emp.empresa, p_caminho: caminho, p_nome: f.name, p_tamanho: f.size, p_origem: "envio", p_resumo: null, p_apontamentos: null });
    toast("Versão enviada.");
    await carregar();
  } catch (e) { msg.textContent = e.message; b.disabled = false; }
}

/* Relatório analítico em PDF: cada apontamento com a ação sugerida e as transferências que o originaram. */
async function apPdf(a, lista) {
  if (!window.jspdf) throw new Error("biblioteca de PDF não carregou; recarregue a página.");
  const { jsPDF } = window.jspdf, doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 36;
  const VERDE = [0, 88, 47], COR = { Alta: [176, 42, 42], "Média": [183, 121, 31], Baixa: [90, 98, 94], Info: [43, 108, 176] };
  const brl = (v) => typeof v === "number" ? VDFC.brl(v) : "–";
  let logo = null;
  try { const b = await (await fetch("/vitalagroenegocios/logo.png")).blob(); logo = await new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); } catch {}
  const filtro = S.filtro === "Todas" ? "todas as prioridades" : S.filtro === "Info" ? "só informativos" : "só prioridade " + S.filtro.toLowerCase();
  const cont = { Alta: 0, "Média": 0, Baixa: 0, Info: 0 }; lista.forEach((x) => cont[x.sev] = (cont[x.sev] || 0) + 1);
  // cabeçalho
  if (logo) doc.addImage(logo, "PNG", M, M - 6, 44, 44);
  doc.setTextColor(...VERDE); doc.setFont("helvetica", "bold"); doc.setFontSize(16);
  doc.text("Apontamentos de conciliação · Fechamento DFC", M + 56, M + 10);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(70);
  doc.text(`${S.emp.empresa} · atualização de ${dataHora(a.criado_em)} por ${a.criado_por_nome || "–"} · ${filtro} · ${lista.length} apontamento${lista.length === 1 ? "" : "s"}`, M + 56, M + 26);
  doc.text(`Alta: ${cont.Alta}   Média: ${cont["Média"]}   Baixa: ${cont.Baixa}   Informativos: ${cont.Info}`, M + 56, M + 39);
  doc.setDrawColor(...VERDE); doc.setLineWidth(1.2); doc.line(M, M + 50, W - M, M + 50);
  let y = M + 62;
  lista.forEach((x, i) => {
    doc.autoTable({
      startY: y, margin: { left: M, right: M }, theme: "grid",
      head: [["#", "Prioridade", "Mês", "Tema", "Apontamento e ação sugerida", "Valor"]],
      body: [[String(i + 1), x.sev === "Info" ? "Informativo" : x.sev, x.mes || "–", x.cat, `${x.desc}\nAção: ${x.acao}`, brl(x.valor)]],
      showHead: i === 0 ? "firstPage" : "never",
      styles: { fontSize: 8.6, cellPadding: 4, lineColor: [210, 214, 211], valign: "top" },
      headStyles: { fillColor: VERDE, textColor: 255, fontStyle: "bold" },
      columnStyles: { 0: { cellWidth: 22, halign: "right" }, 1: { cellWidth: 62, fontStyle: "bold", textColor: COR[x.sev] || [0, 0, 0] }, 2: { cellWidth: 50 }, 3: { cellWidth: 120 }, 5: { cellWidth: 82, halign: "right" } },
      bodyStyles: { fillColor: [244, 247, 245] },
    });
    y = doc.lastAutoTable.finalY;
    if (x.det && x.det.length) {
      const tot = x.det.reduce((s, d) => s + (+d[4] || 0), 0);
      doc.autoTable({
        startY: y, margin: { left: M + 22, right: M }, theme: "plain",
        head: [["Data", "Histórico", "Origem", "Destino", "Efeito"]],
        body: x.det.map((d) => [d[0], d[1], d[2], d[3], brl(+d[4])]),
        foot: x.det.length > 1 ? [["", "", "", `Total (${x.det.length} transferências)`, brl(tot)]] : undefined,
        styles: { fontSize: 7.8, cellPadding: 2.6, textColor: [40, 40, 40] },
        headStyles: { fontStyle: "bold", textColor: [90, 90, 90], lineWidth: { bottom: 0.5 }, lineColor: [200, 200, 200] },
        footStyles: { fontStyle: "bold", textColor: [40, 40, 40] },
        columnStyles: { 0: { cellWidth: 58 }, 2: { cellWidth: 150 }, 3: { cellWidth: 150 }, 4: { cellWidth: 82, halign: "right" } },
      });
      y = doc.lastAutoTable.finalY;
    }
    y += 10;
  });
  if (!lista.length) { doc.setFontSize(10); doc.setTextColor(90); doc.text("Nenhum apontamento nesta prioridade.", M, y + 10); }
  const n = doc.internal.getNumberOfPages(), gerado = new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
  for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFontSize(8); doc.setTextColor(120);
    doc.text(`Vital Agro & Negócios · Fechamento DFC ${S.emp.empresa} · gerado em ${gerado}`, M, H - 18); doc.text(`Página ${p} de ${n}`, W - M, H - 18, { align: "right" }); }
  doc.save(`Apontamentos ${S.emp.empresa} ${new Date(a.criado_em).toLocaleDateString("pt-BR").replace(/\//g, "-")}.pdf`);
}

/* ---------- administração ---------- */
async function renderAdmin() {
  const el = $("#admLista"); if (!el) return;
  let ps; try { ps = await rpc("dfc_pessoas", { p_empresa: S.emp.empresa }); } catch (e) { el.innerHTML = `<p class="note err">${esc(e.message)}</p>`; return; }
  if (!ps.length) { el.innerHTML = `<p class="note">Ninguém de ${esc(S.emp.empresa)} tem acesso à Área do cliente ainda. Crie os acessos na aba Acessos.</p>`; return; }
  el.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Pessoa</th><th>E-mail</th><th>Pode atualizar</th></tr></thead><tbody>
    ${ps.map((p) => `<tr><td>${esc(p.nome)}</td><td>${esc(p.email)}</td><td><label class="row" style="gap:8px"><input type="checkbox" data-ed="${p.user_id}" ${p.pode_atualizar ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--brand)"><span class="note">${p.pode_atualizar ? "Sim" : "Só consulta"}</span></label></td></tr>`).join("")}
  </tbody></table></div>`;
  el.querySelectorAll("[data-ed]").forEach((c) => c.onchange = async () => {
    try { await rpc("dfc_definir_editor", { p_empresa: S.emp.empresa, p_user: c.dataset.ed, p_pode: c.checked }); c.nextElementSibling.textContent = c.checked ? "Sim" : "Só consulta"; toast("Permissão atualizada."); }
    catch (e) { c.checked = !c.checked; toast(e.message); }
  });
}

addEventListener("beforeunload", (e) => { if (S.rodando || meu()) { e.preventDefault(); e.returnValue = ""; } });
iniciar().catch((e) => falhaGeral("Erro ao abrir: " + (e.message || e)));
})();
</script>
