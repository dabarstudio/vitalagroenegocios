<style>
/* Layout: gestão de projetos — quadro de tarefas, indicadores e fluxo de valor */
:root{
  color-scheme:light;
  --bg:#F3F6F1; --surface:#FFFFFF; --surface-2:#E8EFE4; --line:#D3DECD;
  --fg:#18241B; --muted:#57665A; --brand:#00582F; --brand-2:#007941; --leaf:#79C25B; --on-brand:#FFFFFF;
  --warn:#9A6200; --warn-bg:#FFF3D6; --bad:#B3261E; --bad-bg:#FBE4E1; --ok:#1F7A3F; --ok-bg:#E1F2E5;
  --r-mb:#1F7A3F; --r-b:#5E9E2F; --r-r:#B07A00; --r-c:#B3261E; --r-na:#8A968C;
  --display:"Poppins","Segoe UI",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --r:12px;
}
@media (prefers-color-scheme: dark) and (max-width: 0px){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#17221A; --surface-2:#1F2D23; --line:#2E4034; --fg:#E6EEE7; --muted:#9DB0A2;
  --brand:#5FBF7F; --brand-2:#79C25B; --on-brand:#0B1A10; --warn:#F2C062; --warn-bg:#3A2E12; --bad:#F2A097; --bad-bg:#3D1C19; --ok:#7FD39A; --ok-bg:#163522;
  --r-mb:#5FBF7F; --r-b:#A3CF6B; --r-r:#E2B44C; --r-c:#F08A80; --r-na:#7E8C82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17221A; --surface-2:#1F2D23; --line:#2E4034; --fg:#E6EEE7; --muted:#9DB0A2;
  --brand:#5FBF7F; --brand-2:#79C25B; --on-brand:#0B1A10; --warn:#F2C062; --warn-bg:#3A2E12; --bad:#F2A097; --bad-bg:#3D1C19; --ok:#7FD39A; --ok-bg:#163522;
  --r-mb:#5FBF7F; --r-b:#A3CF6B; --r-r:#E2B44C; --r-c:#F08A80; --r-na:#7E8C82; color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.wrap{max-width:1020px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;border:1px solid var(--line);text-decoration:none}
.logo img{width:36px}
.brandtxt{min-width:0}
.brandtxt b{font-family:var(--display);display:block;color:var(--brand)}
.brandtxt span{font-size:.8rem;color:var(--muted)}
.spacer{flex:1}
.sync{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;font-size:.82rem;background:var(--surface);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.sync[data-s="pend"] .dot{background:var(--warn)} .sync[data-s="off"] .dot{background:var(--muted)}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--brand)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:.75rem;margin-left:4px}
.bottomnav{display:none}
@media (max-width:820px){
  .top .tabs{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);overflow-x:auto;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bottomnav .tab{flex:1 0 auto;padding:8px 6px;font-size:.8rem}
  main{padding-bottom:88px}
  .brandtxt span{display:none}
}
main{padding-block:20px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.stack{display:grid;gap:16px;align-content:start}
.muted,.note{color:var(--muted)} .note{font-size:.88rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.92rem}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.na{background:var(--surface-2);color:var(--muted)}
.callout{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;font-size:.93rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.login{max-width:440px;margin:24px auto}
.linklike{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:4px 0;text-align:left}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
/* ===== gestão de projetos ===== */
a.btn{color:var(--fg)} a.btn.primary{color:var(--on-brand)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.pcw{position:relative;display:grid}.pcw .pc{padding-bottom:30px}.pck{position:absolute;right:10px;bottom:8px;display:flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted,#667);cursor:pointer}.pck input{width:18px;height:18px;margin:0}
.pcw.sel .pc{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.lote{position:sticky;bottom:8px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:end;background:var(--surface);border:1px solid var(--brand);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.lote .field{margin:0;min-width:150px}.ltab{width:100%;border-collapse:collapse}.ltab th,.ltab td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem;vertical-align:middle}.ltab tr[data-p]{cursor:pointer}.ltab tr[data-p]:hover td{background:var(--soft,#f3f6f1)}.ltab tr.sel td{background:#e8f1ea}.vis{display:flex;gap:6px;align-self:end}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pc:hover{border-color:var(--brand)} .pc h3{font-size:1rem;margin:0;line-height:1.3}
.pc .m,.note2{font-size:.84rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden} .bar i{display:block;height:100%;background:var(--brand)}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.s-planejado{background:#E8EEF7;color:#2B4C7E} .s-andamento{background:#DFF3E4;color:#1F6B3A} .s-pausado{background:#FFF3CD;color:#7A5600} .s-concluido{background:#E5E7E5;color:#3D4A40} .s-cancelado{background:#FBE3E1;color:#9B2C22}
.late{color:#B3261E;font-weight:700}
.kb{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kc{background:var(--surface-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.kc h4{margin:0 0 2px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;font-size:.88rem}
.tk b{font-weight:700;line-height:1.3} .tk .m{font-size:.8rem;color:var(--muted)}
.tk .ac{display:flex;gap:6px;flex-wrap:wrap}
.tk[draggable=true]{cursor:grab} .tk.arr{opacity:.45} .kc.sobre{outline:2px dashed var(--brand);outline-offset:-2px} .kc .vazio{font-size:.78rem;opacity:.7}
.rt{background:#FBE3E1;color:#9B2C22;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.kpi .v{font:700 1.5rem var(--display);color:var(--fg);font-variant-numeric:tabular-nums} .kpi .l{font-size:.8rem;color:var(--muted)}
.kpi.ruim .v{color:#B3261E} .kpi.bom .v{color:#1F6B3A}
.vsm{display:flex;gap:0;overflow-x:auto;padding:6px 2px 4px;align-items:stretch}
.vs{min-width:150px;max-width:190px;border:2px solid var(--brand);border-radius:10px;background:var(--surface);padding:10px;display:grid;gap:4px;font-size:.8rem;align-content:start}
.vs.nva{border-style:dashed;border-color:#C2541B} .vs.gargalo{box-shadow:0 0 0 3px #F4C430}
.vs h5{margin:0;font-size:.86rem;line-height:1.25} .vs .k{display:flex;justify-content:space-between;gap:6px} .vs .k span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.arw{display:grid;place-items:center;min-width:34px;color:var(--muted);font-size:1.3rem}
.lad{display:flex;overflow-x:auto;font-size:.74rem;font-variant-numeric:tabular-nums;margin-top:4px}
.lad div{min-width:184px;display:grid;grid-template-rows:auto auto}
.lad .w{border-top:3px solid #C2541B;padding:3px 4px 0;color:#9B4318} .lad .p{border-bottom:3px solid var(--brand);padding:0 4px 3px;margin-top:10px;color:var(--brand)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.leg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
dialog.pd{border:none;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 24px)} dialog.pd::backdrop{background:rgba(0,0,0,.45)}
dialog.pd form{padding:18px;display:grid;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.84rem;background:var(--surface);cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand);margin-top:2px}
@media (max-width:640px){.kb{grid-template-columns:repeat(4,82vw)}}
/* ===== quadros / clientes / comercial ===== */
header.top .brandtxt{flex-shrink:0;white-space:nowrap}
header.top .spacer{flex:0 0 8px}
#novoW .btn{white-space:nowrap;flex-shrink:0;background:var(--brand-light,#7CC36B);color:#0B2614;border-color:transparent}
.ajuda{margin:2px 0 0;max-width:820px}
.iam{border-radius:10px;padding:8px 10px;display:grid;gap:3px} .iam.ia{background:var(--surface-2)} .iam.eq{border:1px solid var(--line)}
.esc{display:grid;gap:8px} .esc button{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.esc button:hover,.esc button:focus-visible{border-color:var(--brand)} .esc b{font-size:.98rem} .esc span{font-size:.84rem;color:var(--muted)}
#tabsTop{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:thin}
@media (max-width:1400px){ header.top .brandtxt span{display:none} }
.bottomnav{overflow-x:auto}
.qbar{display:grid;grid-template-columns:minmax(180px,2fr) repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}

.qn{background:var(--surface);border-radius:999px;padding:0 8px;font-size:.75rem;font-weight:700;color:var(--fg)}

.qlist{display:grid;gap:8px;overflow-y:auto;padding:2px}
.qk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;gap:5px;font-size:.88rem;cursor:pointer;text-align:left}
.qk:hover,.qk:focus-visible{border-color:var(--brand)} .qk.arr{opacity:.45}
.qk b{font-weight:600;line-height:1.3;overflow-wrap:anywhere} .qk .m{font-size:.78rem;color:var(--muted)}
.qes{display:flex;flex-wrap:wrap;gap:4px}
.qe{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.72rem;font-weight:700;line-height:1.5}
.qm{display:flex;flex-wrap:wrap;gap:4px;align-items:center}

.qsoma{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lk{border:0;background:none;color:var(--brand);cursor:pointer;font:inherit;font-size:.75rem;text-decoration:underline;padding:0}

.cofreBox{border:1px dashed var(--brand);border-radius:12px;padding:10px 12px;background:var(--surface-2)}

.colrow{display:grid;grid-template-columns:minmax(0,1fr) 130px 64px auto auto;gap:6px;align-items:center}

.neg{color:#B3261E}

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
/* barra inferior do celular: até 4 seções + "Mais" (evita a faixa que precisa arrastar para o lado) */
function navInferior(h){ const bn=document.getElementById("tabsBottom"); if (!bn) return;
  const box=document.createElement("div"); box.innerHTML=h; const it=[...box.children];
  if (it.length<=5) { bn.innerHTML=h; return; }
  const sel=it.findIndex(x=>x.getAttribute("aria-selected")==="true");
  const keep = sel>=4 ? it.slice(0,3).concat([it[sel]]) : it.slice(0,4);
  bn.innerHTML = keep.map(x=>x.outerHTML).join("") + `<button class="tab" type="button" data-maisnav aria-haspopup="dialog">Mais</button>`;
  bn.querySelector("[data-maisnav]").onclick = () => { const d=document.createElement("dialog"); d.className="vdlg vmais"; d.setAttribute("aria-label","Todas as seções");
    d.innerHTML=`<div class="vmais-h"><b>Todas as seções</b><button type="button" class="btn ghost" data-x>Fechar</button></div><div class="vmais-l">${h}</div>`;
    d.addEventListener("click", e => { if (e.target===d || e.target.closest("[data-x],[data-tab],[data-sair],a")) { d.close(); d.remove(); } });
    d.addEventListener("close", () => d.remove());
    document.body.appendChild(d); d.showModal(); };
}

/* diálogo de confirmação no padrão do site (substitui confirm/prompt do navegador) */
function pergunta(msg, o){ o=o||{}; return new Promise(res=>{
  const prim=(msg.match(/^(Excluir|Remover|Tirar|Cancelar)/)||[])[1];
  const ok=o.ok||(prim==="Cancelar"?"Sim, cancelar":prim||"Confirmar"), no=o.no||(prim==="Cancelar"?"Voltar":"Cancelar"), perigo=o.perigo!=null?o.perigo:!!prim;
  const d=document.createElement("dialog"); d.className="vdlg"; d.setAttribute("aria-label", o.titulo||"Confirmação");
  d.innerHTML=`<form method="dialog"><p class="vdlg-m"></p>${o.campo?`<label class="vdlg-l">${o.campo}<textarea rows="3" maxlength="200"></textarea></label>`:""}<div class="vdlg-b"><button type="button" class="btn ghost" value="no"></button><button type="button" class="btn ${perigo?"perigo":"primary"}" value="ok"></button></div></form>`;
  d.querySelector(".vdlg-m").textContent=msg; const [bn,bo]=d.querySelectorAll(".vdlg-b button"); bn.textContent=no; bo.textContent=ok;
  const fim=v=>{ d.close(); d.remove(); res(v); };
  bn.onclick=()=>fim(o.campo?null:false); bo.onclick=()=>fim(o.campo?d.querySelector("textarea").value.trim():true);
  d.addEventListener("cancel",e=>{ e.preventDefault(); fim(o.campo?null:false); });
  document.body.appendChild(d); d.showModal(); (o.campo?d.querySelector("textarea"):bn).focus();
}); }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cfg = window.VITAL_CONFIG || {};
const sb = window.supabase && cfg.supabaseUrl ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey) : null;
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }
const hoje = () => new Date().toISOString().slice(0,10);
const fmtD = d => d ? new Date(d.length===10 ? d+"T12:00:00" : d).toLocaleDateString("pt-BR") : "–";
const n1 = v => (Math.round((+v||0)*10)/10).toLocaleString("pt-BR");
const brl = v => (+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const pct = v => v==null||!isFinite(v) ? "–" : Math.round(v*100)+"%";
const dias = (a,b) => (new Date(b) - new Date(a)) / 864e5;
const media = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
const SERV_G = [[null,[["bpo","BPO financeiro"]]],
  ["Contábil recorrente",[["contabil_mei","MEI"],["contabil_simples","Simples Nacional"],["contabil_presumido","Lucro Presumido"],["contabil_real","Lucro Real"],["contabil_terceiro_setor","Terceiro Setor"]]],
  ["Regularizações",[["regularizacao_cnpj","CNPJ (empresa)"],["regularizacao_cpf","CPF (pessoa física)"],["regularizacao","Outras"]]],
  ["Declarações",[["irpf","Imposto de Renda (IRPF)"],["itr","ITR (imóvel rural)"],["obrigacoes","Outras obrigações (SPED, DCTF…)"]]],
  [null,[["legalizacao","Abertura, alteração e baixa de empresa"],["dp","Departamento pessoal"],["rural","Produtor rural (LCDPR, cadastro)"]]],
  ["Consultoria",[["diagnostico","Diagnóstico"],["tributario","Planejamento tributário / Reforma"],["consultoria","Consultoria e assessoria"],["5s","Avaliação 5S"],["disc","DISC"]]],
  [null,[["avulso","Serviços avulsos (certidões, licenças, notas)"],["outro","Outro"]]]];
const SERV_CPF = new Set(["irpf","itr","rural","regularizacao_cpf","regularizacao","tributario","consultoria","diagnostico","disc","avulso","outro"]);
const SERV_CNPJ = new Set(["bpo","contabil_mei","contabil_simples","contabil_presumido","contabil_real","contabil_terceiro_setor","regularizacao_cnpj","regularizacao","obrigacoes","legalizacao","dp","rural","diagnostico","tributario","consultoria","5s","disc","avulso","outro"]);
const SERV = Object.fromEntries(SERV_G.flatMap(([g,it])=>it.map(([k,l])=>[k, g ? g+" · "+l : l])));
const opSERV = sel => SERV_G.map(([g,it])=>{ const o=it.map(([k,l])=>`<option value="${k}" ${k===sel?"selected":""}>${l}</option>`).join(""); return g?`<optgroup label="${g}">${o}</optgroup>`:o; }).join("");
const STP = {planejado:"Planejado", andamento:"Em andamento", pausado:"Pausado", concluido:"Concluído", cancelado:"Cancelado"};
const COL = [["afazer","A fazer"],["fazendo","Fazendo"],["revisao","Revisão"],["concluido","Concluído"]];
const HORAS_DIA = 8;

const S = { me:null, papel:null, socio:false, equipe:[], projetos:[], membros:[], tarefas:[], horas:[], eventos:[], etapas:[], cur:"lista", proj:null, filtro:{status:"ativos", serv:""}, per:90, vserv:"bpo" };
const nome = id => (S.equipe.find(p=>p.user_id===id)||{}).nome || "–";
const horasDe = tid => S.horas.filter(h=>h.tarefa===tid).reduce((s,h)=>s+(+h.horas),0);
const tarefasDe = pid => S.tarefas.filter(t=>t.projeto===pid);
const atrasada = t => t.status!=="concluido" && t.prazo && t.prazo < hoje();
const maduro = p => p.status==="concluido" || progresso(p.id)>=0.5;
function progresso(pid){ const ts=tarefasDe(pid); return ts.length ? ts.filter(t=>t.status==="concluido").length/ts.length : 0; }

/* ===== abas ===== */
function abas(){
  if (!S.me) { $("#tabsTop").innerHTML = $("#tabsBottom").innerHTML = ""; return; }
  const T = S.ext ? [["lista","Projetos"],["minhas","Minhas tarefas"]] : [["lista","Projetos"],["ia","Assistente"],["quadros","Quadros"],["clientes","Clientes"],["comercial","Comercial"],["kpi","Indicadores"],["vsm","Fluxo de valor"]].concat(S.socio?[["contratos","Contratos"],["financeiro","Financeiro"],["leg","Legislação"]]:[]).concat(S.papel==="admin"?[["equipe","Equipe"]]:[]);
  const DICA = {lista:"Trabalhos contratados pelos clientes", ia:"Peça análises e documentos ao assistente", minhas:"Tudo o que está com você", quadros:"Funil de vendas (leads) e acesso ao quadro de tarefas", clientes:"Cadastro de clientes", comercial:"Indicadores do Funil de vendas", kpi:"Prazos, horas e rentabilidade", vsm:"Etapas padrão de cada serviço", contratos:"Contratos, aditivos e procurações dos clientes (só sócios)", financeiro:"Financeiro da Vital (só sócios)", leg:"Novidades da legislação para aprovar", equipe:"Logins e acessos da equipe"};
  const h = T.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" title="${DICA[k]||""}" aria-selected="${S.cur===k||(k==="lista"&&S.cur==="proj")}">${l}</button>`).join("") + (S.ext ? "" : `<a class="tab" href="/vitalagroenegocios/simulador/" title="Simulador tributário">Simulador</a>`) + `<a class="tab" href="/vitalagroenegocios/cliente/" title="Início da área Vital: entregáveis, mídias, acessos">Área Vital</a>` + (S.ext ? "" : `<a class="tab" href="https://www.iobonline.com.br/" target="_blank" rel="noopener" title="IOB Online: entre com o seu login da IOB">IOB Online ↗</a>`);
  $("#tabsTop").innerHTML = h; navInferior(h);
  $("#novoW").innerHTML = S.ext ? "" : `<button class="btn sm" id="btnNovo" title="Criar projeto, demanda, lead ou cliente">+ Novo</button>`;
}
function go(k, pid){
  S.cur = k; if (pid) S.proj = pid; abas();
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "v-"+k);
  ({lista:renderLista, proj:renderProj, minhas:renderMinhas, kpi:renderKpi, vsm:renderVsm, equipe:renderEquipe, quadros:renderQuadros, clientes:renderClientes, comercial:renderComercial, financeiro:renderFinanceiro, contratos:renderContratos, leg:renderLeg, ia:renderIA})[k]?.();
  ajuda(k);
  try{ history.replaceState(null,"","#"+k+(k==="proj"&&S.proj?"/"+S.proj:"")); }catch{}
  window.scrollTo({top:0});
}
document.addEventListener("click", e => { const t=e.target.closest("[data-tab]"); if (t) go(t.dataset.tab); if (e.target.closest("#btnNovo")) escolherNovo(); });
/* frase curta explicando cada tela (aparece abaixo do título) */
const AJUDA = {
  lista:"Cada card é um trabalho contratado por um cliente. Clique para ver e mover as tarefas. Ao criar um projeto, o cliente é cadastrado e o cartão entra no Business sozinho.",
  quadros:"As demandas da equipe agora ficam no Quadro de tarefas (botão no topo), onde os projetos aparecem sozinhos. Funil de vendas = interessados até virarem clientes; ao mover para a coluna de ganho, o projeto e o cliente são criados sozinhos.",
  clientes:"Todos os clientes da Vital. Clientes novos entram aqui sozinhos quando um projeto é criado ou um negócio é ganho no Funil.",
  comercial:"Resultado do Funil de vendas: quantos leads entraram, quantos viraram clientes e onde agir agora.",
  kpi:"Prazos cumpridos, horas trabalhadas e rentabilidade dos projetos.",
  vsm:"As etapas padrão de cada serviço e onde o tempo está sendo gasto.",
  ia:"Escreva o pedido como escreveria no chat e anexe os documentos. A rotina automática confere a fila de hora em hora, faz a análise e devolve o resultado aqui. O que for para o cliente fica aguardando aprovação de um sócio.",
  contratos:"Cada linha é um cliente com o contrato principal e os aditivos logo abaixo. Anexe a minuta e, quando voltar assinado, anexe o PDF assinado: a situação muda sozinha. Os avisos mostram o que está pendente, vencendo ou com reajuste próximo.",
  leg:"Todo dia cedo uma rotina confere as fontes oficiais (DOU, Receita, Comitê Gestor do IBS, CONFAZ). O que mudar o cálculo do simulador só entra depois que um sócio aprovar aqui."};
function ajuda(k){ const t=AJUDA[k]; if (!t) return; const v=$("#v-"+k); const fix = () => { if (v.querySelector(".ajuda")) return; const h=v.querySelector("h2"); if (h) h.insertAdjacentHTML("afterend", `<p class="note2 ajuda">${t}</p>`); else { const e=v.querySelector(".eyebrow"); if (e) e.parentElement.insertAdjacentHTML("beforeend", `<p class="note2 ajuda">${t}</p>`); } };
  fix(); if (!v._ob) { v._ob = new MutationObserver(fix); v._ob.observe(v, {childList:true}); } }
/* um só botão "+ Novo" que explica cada opção */
function escolherNovo(){
  const d=$("#dlgS"), f=$("#dlgSF");
  f.innerHTML = `<h3 style="margin:0">O que você quer criar?</h3><div class="esc">
    <button type="button" data-nv="lead"><b>Nova demanda de cliente (Funil de vendas)</b><span>Todo pedido novo começa aqui: proposta, mensagens de WhatsApp e, ao fechar, o projeto e o cliente são criados sozinhos.</span></button>
    ${S.socio?`<button type="button" data-nv="proj"><b>Projeto já fechado</b><span>Só quando o serviço já foi contratado (ou é interno da Vital). Ele entra no funil direto como negócio ganho.</span></button>`:""}
    <button type="button" data-nv="dem"><b>Tarefa da equipe no Business</b><span>Algo a fazer que não é um projeto (ex.: emitir uma certidão, ligar para alguém).</span></button>
    <button type="button" data-nv="cli"><b>Cliente (só cadastro)</b><span>Cadastrar um cliente sem abrir projeto agora.</span></button>
    ${S.cur==="proj"?`<button type="button" data-nv="tar"><b>Tarefa neste projeto</b><span>Um passo do projeto aberto agora.</span></button>`:""}
  </div><div class="row" style="justify-content:flex-end"><button class="btn ghost" value="cancel">Fechar</button></div>`;
  f.onclick = async e => { const b=e.target.closest("[data-nv]"); if (!b) return; d.close(); const k=b.dataset.nv;
    if (k==="proj") { dlgProjeto(); return; }
    if (k==="tar") { const p=S.projetos.find(x=>x.id===S.proj); if (p) dlgTarefa(p); return; }
    try { await carregarQ(); } catch(x) { toast("Não foi possível carregar: "+(x.message||x)); return; }
    if (k==="cli") { go("clientes"); dlgCliente(); return; }
    if (k!=="lead") { location.href="/vitalagroenegocios/quadro/"; return; }
    const q = Q.quadros.find(x=>x.tipo==="vendas"); if (!q) { toast("Quadro não encontrado."); return; }
    Q.cur = q.id; go("quadros"); dlgCartao(null, colsDe(q.id).find(c=>c.tipo==="etapa")); };
  d.showModal();
}

/* ===== dados ===== */
async function carregar(){
  const q = (t, sel="*") => sb.from(t).select(sel).limit(10000);
  const [eq, pr, mb, tf, hr, ev, et] = await Promise.all([sb.rpc("proj_equipe"), q("proj_projetos"), q("proj_membros"), q("proj_tarefas"), q("proj_horas"), q("proj_eventos","tarefa,de,para,em"), q("proj_etapas_padrao")]);
  for (const r of [eq,pr,mb,tf,hr,ev,et]) if (r.error) throw r.error;
  S.equipe = eq.data||[]; S.projetos = pr.data||[]; S.membros = mb.data||[]; S.tarefas = tf.data||[]; S.horas = hr.data||[]; S.eventos = ev.data||[];
  if (S.socio) { const f = await sb.from("proj_financeiro").select("projeto, valor, itens, valor_ref").limit(10000); if (f.error) throw f.error;
    const vm = Object.fromEntries((f.data||[]).map(x=>[x.projeto, x])); S.projetos.forEach(p=>{ const x=vm[p.id]; p.valor = x?+x.valor:0; p.valor_ref = x?+x.valor_ref||0:0; p.fin_itens = x&&x.itens||[]; }); }
  S.etapas = (et.data||[]).sort((a,b)=>a.servico.localeCompare(b.servico)||a.ordem-b.ordem);
  if (!S.ext) { const c = await sb.from("cad_clientes").select("id,nome,situacao").limit(5000); if (!c.error) S.clientes = (c.data||[]).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR")); }
}
/* tabela de referência de honorários (ASSCON 2026) — arquivo público do site */
let REF = null;
async function refHon(){ if (REF) return REF; try { const r = await fetch("/vitalagroenegocios/projetos/asscon.json", {cache:"force-cache"}); const j = await r.json();
  REF = j.itens.map(([g,s,d,v,u,o,k],i)=>({i, g, s, d, v, u, o, k, txt: `${s}${d?" · "+d:""} — ${v==null?(o.startsWith("Faixa")?o.replace("Faixa ",""):"a combinar"):(+v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}${u?" "+u:""}`})); } catch { REF = []; } return REF; }
const curtoS = k => /^regularizacao/.test(k||"") ? "Regularização " + (k==="regularizacao_cpf"?"de CPF":k==="regularizacao_cnpj"?"de CNPJ":"(outras)") : (SERV[k]||k||"Serviço").replace(/^.* · /,"");
const etapasDe = serv => S.etapas.filter(e=>e.servico===serv);

/* ===== lista de projetos ===== */
function renderLista(){
  const v = $("#v-lista"); const f = S.filtro; let vis = "cards"; try { vis = localStorage.getItem("proj.vis") || "cards"; } catch {}
  for (const id of [...SEL]) if (!S.projetos.some(p => p.id === id)) SEL.delete(id);
  let ps = S.projetos.slice();
  if (f.status==="ativos") ps = ps.filter(p=>["planejado","andamento","pausado"].includes(p.status)); else if (f.status) ps = ps.filter(p=>p.status===f.status);
  if (f.serv) ps = ps.filter(p=>p.servico===f.serv);
  ps.sort((a,b)=>(a.prazo||"9999").localeCompare(b.prazo||"9999"));
  v.innerHTML = `<div class="row" style="justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><div><div class="eyebrow">Equipe Vital</div><h2 style="font-size:1.35rem">Projetos</h2></div>

/* arrastar tarefas entre colunas */
function arrastarT(v){
  const kb = v.querySelector(".kb"); if (!kb) return; let arr=null;
  kb.addEventListener("dragstart", e => { const t=e.target.closest("[data-t]"); if (!t) return; arr=t.dataset.t; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain", arr); }catch{} t.classList.add("arr"); });
  kb.addEventListener("dragend", e => { const t=e.target.closest("[data-t]"); if (t) t.classList.remove("arr"); kb.querySelectorAll(".sobre").forEach(x=>x.classList.remove("sobre")); });
  kb.addEventListener("dragover", e => { const c=e.target.closest("[data-st]"); if (!c || !arr) return; e.preventDefault(); kb.querySelectorAll(".sobre").forEach(x=>x!==c&&x.classList.remove("sobre")); c.classList.add("sobre"); });
  kb.addEventListener("dragleave", e => { const c=e.target.closest("[data-st]"); if (c && !c.contains(e.relatedTarget)) c.classList.remove("sobre"); });
  kb.addEventListener("drop", async e => { const c=e.target.closest("[data-st]"); if (!c || !arr) return; e.preventDefault();
    const id=arr; arr=null; const t=S.tarefas.find(x=>x.id===id); const para=c.dataset.st; if (!t || t.status===para) { rerender(); return; }
    let dev=false; if (t.status==="concluido") dev = await pergunta("Esta tarefa está sendo reaberta porque o cliente devolveu (pediu correção)?", {ok:"Sim, o cliente devolveu", no:"Não, foi ajuste interno", perigo:false});
    await mover(id, para, dev); avisaFim(t.projeto); rerender(); });
}

  Object.assign(t, r.data); S.eventos.push({tarefa:id, de:null, para, em:new Date().toISOString()});

/* ===== tempo em cada situação (a partir do histórico) ===== */
function tempos(t){
  const ev = S.eventos.filter(e=>e.tarefa===t.id).sort((a,b)=>a.em.localeCompare(b.em));
  const out = {afazer:0, fazendo:0, revisao:0}; if (!ev.length) return out;
  for (let i=0;i<ev.length;i++) { const fim = ev[i+1] ? ev[i+1].em : (t.status==="concluido" ? (t.concluido_em||ev[i].em) : new Date().toISOString()); if (out[ev[i].para]!=null) out[ev[i].para] += Math.max(0, dias(ev[i].em, fim)); }
  return out;
}

/* ===== fluxo de valor (VSM) ===== */
function renderVsm(){
  const v=$("#v-vsm"); const serv=S.vserv; const pids=new Set(S.projetos.filter(p=>p.servico===serv).map(p=>p.id));
  const ts=S.tarefas.filter(t=>pids.has(t.projeto)); const concl=ts.filter(t=>t.status==="concluido");
  const pad=etapasDe(serv); const nomes=[...pad.map(e=>e.nome), ...[...new Set(ts.map(t=>t.etapa).filter(n=>n&&!pad.some(e=>e.nome===n)))]];
  const est = nomes.map(nm=>{ const e=pad.find(x=>x.nome===nm)||{agrega_valor:true,horas_padrao:0}; const c=concl.filter(t=>t.etapa===nm);
    const tm=c.map(tempos); const hrs=c.map(t=>horasDe(t.id)).filter(h=>h>0);
    const fila=media(tm.map(x=>x.afazer)), exec=media(tm.map(x=>x.fazendo)), rev=media(tm.map(x=>x.revisao));
    const leadE = c.length ? media(c.map(t=>dias(t.criado_em,t.concluido_em))) : null; const proc = hrs.length ? media(hrs) : null;
    return {nm, va:e.agrega_valor, padrao:+e.horas_padrao, n:c.length, abertas:ts.filter(t=>t.etapa===nm&&t.status!=="concluido").length, fila, exec, rev, lead:leadE, proc, ret: c.length ? c.filter(t=>t.retrabalho>0).length/c.length : null}; });
  const comDado = est.filter(e=>e.n);
  const leadT = comDado.reduce((s,e)=>s+(e.lead||0),0), procT = comDado.reduce((s,e)=>s+(e.proc||0),0)/HORAS_DIA;
  const pce = leadT ? procT/leadT : null; const garg = comDado.slice().sort((a,b)=>(b.lead||0)-(a.lead||0))[0];
  const dicas = [];
  const maxFila = comDado.slice().sort((a,b)=>(b.fila||0)-(a.fila||0))[0]; if (maxFila && maxFila.fila>=2) dicas.push(`<b>${esc(maxFila.nm)}</b>: as tarefas esperam em média ${n1(maxFila.fila)} dias para começar. Verifique se falta material do cliente ou se a pessoa está sobrecarregada (aba Indicadores → Carga da equipe).`);
  const maxRev = comDado.slice().sort((a,b)=>(b.rev||0)-(a.rev||0))[0]; if (maxRev && maxRev.rev>=1) dicas.push(`<b>${esc(maxRev.nm)}</b>: ${n1(maxRev.rev)} dias parada em revisão. Combine um dia fixo de revisão ou um revisor reserva.`);
  comDado.filter(e=>!e.va && e.proc>=2).forEach(e=>dicas.push(`<b>${esc(e.nm)}</b> não agrega valor para o cliente e consome ${n1(e.proc)} h por vez. Candidata a automatizar ou simplificar (checklist, modelo, integração).`));
  comDado.filter(e=>e.ret>0.2).forEach(e=>dicas.push(`<b>${esc(e.nm)}</b>: ${pct(e.ret)} das tarefas voltam para correção. Crie um checklist de qualidade antes de mandar para revisão.`));
  comDado.filter(e=>e.padrao && e.proc && e.proc>e.padrao*1.3).forEach(e=>dicas.push(`<b>${esc(e.nm)}</b>: leva ${n1(e.proc)} h, ${pct(e.proc/e.padrao-1)} acima do padrão de ${n1(e.padrao)} h. Reveja o padrão ou o método.`));
  v.innerHTML = `<div class="row" style="justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><div><div class="eyebrow">Melhoria contínua</div><h2 style="font-size:1.35rem">Fluxo de valor (VSM)</h2></div>
      <div class="field" style="min-width:220px"><label for="vS">Serviço</label><select id="vS">${opSERV("")}</select></div></div>
    <p class="note" style="margin:0">Medido automaticamente pelas tarefas concluídas: quanto tempo cada etapa espera na fila, fica em execução e parada em revisão, e quantas horas de trabalho consome. Quanto maior a eficiência do fluxo, menos o cliente espera por algo que não agrega valor.</p>
    <div class="kpis">
      <div class="kpi"><span class="l">Tarefas concluídas analisadas</span><span class="v">${concl.length}</span></div>
      <div class="kpi"><span class="l">Tempo total do fluxo (soma das etapas)</span><span class="v">${leadT?n1(leadT)+" d":"–"}</span></div>
      <div class="kpi"><span class="l">Tempo de trabalho efetivo</span><span class="v">${procT?n1(procT)+" d":"–"}</span><span class="l">horas lançadas ÷ ${HORAS_DIA} h</span></div>
      <div class="kpi ${pce==null?"":pce>=0.25?"bom":"ruim"}"><span class="l">Eficiência do fluxo</span><span class="v">${pct(pce)}</span><span class="l">trabalho ÷ tempo total</span></div>
      <div class="kpi"><span class="l">Gargalo</span><span class="v" style="font-size:1.05rem">${garg?esc(garg.nm):"–"}</span></div>
    </div>
    ${est.length?`<div class="card" style="padding:12px"><div class="vsm">${est.map((e,i)=>`${i?`<div class="arw" aria-hidden="true">→</div>`:""}<div class="vs ${e.va?"":"nva"} ${garg&&e.nm===garg.nm?"gargalo":""}"><h5>${i+1}. ${esc(e.nm)}</h5>
        <div class="k"><span>Concluídas</span><span>${e.n}</span></div><div class="k"><span>Em aberto</span><span>${e.abertas}</span></div>
        <div class="k"><span>Fila</span><span>${e.fila!=null?n1(e.fila)+" d":"–"}</span></div><div class="k"><span>Execução</span><span>${e.exec!=null?n1(e.exec)+" d":"–"}</span></div>
        <div class="k"><span>Em revisão</span><span>${e.rev!=null?n1(e.rev)+" d":"–"}</span></div><div class="k"><span>Horas</span><span>${e.proc!=null?n1(e.proc):"–"} / ${n1(e.padrao)}</span></div>
        <div class="k"><span>Retrabalho</span><span>${pct(e.ret)}</span></div></div>`).join("")}</div>
      <div class="lad" aria-label="Linha do tempo">${est.map(e=>`<div><span class="w">espera ${e.lead!=null?n1(Math.max(0,e.lead-(e.proc||0)/HORAS_DIA))+" d":"–"}</span><span class="p">trabalho ${e.proc!=null?n1(e.proc/HORAS_DIA)+" d":"–"}</span></div>`).join("")}</div>
      <div class="leg" style="margin-top:10px"><span><i style="border:2px solid var(--brand)"></i>Agrega valor</span><span><i style="border:2px dashed #C2541B"></i>Não agrega valor (necessária)</span><span><i style="box-shadow:0 0 0 3px #F4C430"></i>Gargalo (maior tempo total)</span><span>Horas: real / padrão</span></div></div>`:`<div class="card empty">Este serviço ainda não tem fluxo padrão.</div>`}
    <div class="card stack" style="padding:12px 14px"><b>Onde melhorar</b>${dicas.length?dicas.slice(0,6).map(d=>`<div class="note2" style="color:var(--fg)">• ${d}</div>`).join(""):`<span class="note2">${concl.length<5?"Conclua pelo menos 5 tarefas deste serviço, com horas lançadas, para o sistema apontar melhorias.":"Nenhum ponto crítico agora. Siga acompanhando mês a mês."}</span>`}</div>
    ${S.socio?`<div class="card stack" style="padding:12px 14px"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Fluxo padrão de ${esc(SERV[serv])}</b><button class="btn sm" id="vEd">Editar etapas</button></div>
      <span class="note2">Etapas usadas ao criar um projeto deste serviço. Ao melhorar um processo, atualize aqui (ex.: juntar etapas, mudar as horas padrão).</span></div>`:""}`;
  $("#vS").value = serv; $("#vS").onchange = e => { S.vserv = e.target.value; renderVsm(); };
  const ed=$("#vEd"); if (ed) ed.onclick = () => dlgFluxo(serv);
}
function dlgFluxo(serv){
  const pad=etapasDe(serv);
  abrir(`<h3 style="margin:0">Fluxo padrão · ${esc(SERV[serv])}</h3><p class="note2" style="margin:0">Uma etapa por linha. Deixe o nome vazio para remover.</p>
    <div class="stack" id="fl">${[...pad, {}, {}].map((e,i)=>`<div class="row" style="gap:6px;align-items:end;flex-wrap:wrap"><div class="field" style="flex:2;min-width:160px"><label>Etapa ${i+1}</label><input data-n value="${esc(e.nome||"")}" maxlength="60"></div>
      <div class="field" style="width:90px"><label>Horas</label><input data-h type="number" min="0" step="0.5" value="${e.horas_padrao??""}"></div>
      <label class="chk" style="width:auto;grid-template-columns:22px auto"><input type="checkbox" data-va ${e.agrega_valor===false?"":"checked"}><span class="note2">agrega valor</span></label></div>`).join("")}</div>`,
  async () => {
    const rows=[...document.querySelectorAll("#fl > div")].map(r=>({nome:r.querySelector("[data-n]").value.trim(), horas_padrao:+r.querySelector("[data-h]").value||0, agrega_valor:r.querySelector("[data-va]").checked})).filter(r=>r.nome.length>=2)
      .map((r,i)=>({...r, servico:serv, ordem:i+1}));
    if (!rows.length) { $("#dErr").textContent="Deixe pelo menos uma etapa."; return false; }
    const d=await sb.from("proj_etapas_padrao").delete().eq("servico",serv); if (d.error) throw d.error;
    const r=await sb.from("proj_etapas_padrao").insert(rows).select(); if (r.error) throw r.error;
    S.etapas = S.etapas.filter(e=>e.servico!==serv).concat(r.data).sort((a,b)=>a.servico.localeCompare(b.servico)||a.ordem-b.ordem); toast("Fluxo atualizado."); renderVsm();
  });
}

async function todos(t, sel="*"){ let out=[], de=0; for(;;){ const r=await sb.from(t).select(sel).range(de, de+999); if (r.error) throw r.error; out=out.concat(r.data||[]); if (!r.data || r.data.length<1000) return out; de+=1000; } }
async function carregarQ(forcar){
  if (Q.ok && !forcar) return;

  Q.cofre = {cli:new Set(), car:new Set()};
  if (Q.cofreOk) {
    (await todos("cofre_itens","cliente,cartao")).forEach(i=>{ if (i.cliente) Q.cofre.cli.add(i.cliente); if (i.cartao) Q.cofre.car.add(i.cartao); });
    const c = await sb.from("cofre_config").select("*").maybeSingle(); Q.cofreCfg = c.data || null;
  }
  if (S.papel==="admin") { const p = await todos("cofre_pendente","id,cliente,cartao"); Q.pendentes = p.length; p.forEach(i=>{ if (i.cliente) Q.cofre.cli.add(i.cliente); if (i.cartao) Q.cofre.car.add(i.cartao); }); }
  Q.pessoas = [];
  if (S.socio) { const r = await sb.from("fin_pessoas").select("nome,tipo,ativo"); if (!r.error) Q.pessoas = (r.data||[]).filter(p=>p.ativo!==false && p.tipo!=="parceiro").map(p=>p.nome); }

  Q.ok = true;
}

function coluna(c, ks, vendas, filtrando){
  const fechada = c.recolhida && !Q.abertas.has(c.id) && !filtrando;

function cartao(k, c, vendas){

function arrastar(){
  const b=$("#qBoard"); if (!b) return; let arr=null;
  b.addEventListener("dragstart", e => { const k=e.target.closest("[data-k]"); if (!k) return; arr=k.dataset.k; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain", arr); }catch{} k.classList.add("arr"); });

async function moverCartao(k, col, ordem){

      ${vendas?`<input data-cp="${i}" type="number" min="0" max="100" value="${c.prob??""}" placeholder="%" aria-label="Chance de fechar (%)" title="Chance de fechar nesta etapa (%)">`:""}

      <span class="row" style="gap:2px"><button type="button" class="btn sm ghost" data-up="${i}" ${i?"":"disabled"}>↑</button><button type="button" class="btn sm ghost" data-dn="${i}" ${i<cs.length-1?"":"disabled"}>↓</button><button type="button" class="btn sm ghost" data-rm="${i}" title="Remover (só se estiver vazia)">✕</button></span></div>`).join("");
  abrir(`<h3 style="margin:0">Colunas · ${esc(q.nome)}</h3><p class="note2" style="margin:0">${vendas?"O tipo diz aos indicadores o que é etapa, ganho ou perda. A chance (%) calcula o valor ponderado do funil.":"“Recolhida” deixa a coluna fechada no quadro (bom para arquivos)."}</p>
    <div id="colsL" class="stack" style="gap:6px">${linhas()}</div><div><button type="button" class="btn sm" id="colAdd">+ Coluna</button></div>`,
  async () => {
    const lerC = () => cs.forEach((c,i)=>{ c.nome=$(`[data-cn="${i}"]`).value.trim()||c.nome; c.tipo=$(`[data-ct="${i}"]`).value; c.recolhida=$(`[data-cr="${i}"]`).checked; if (vendas) { const p=$(`[data-cp="${i}"]`).value; c.prob = p===""?null:Math.max(0,Math.min(100,+p)); } });
    lerC();
    for (const [i,c] of cs.entries()) { const d={nome:c.nome, tipo:c.tipo, recolhida:c.recolhida, prob:c.prob??null, ordem:i+1};
      const r = c.id ? await sb.from("quad_colunas").update(d).eq("id",c.id).select().single() : await sb.from("quad_colunas").insert({...d, quadro:q.id}).select().single();
      if (r.error) throw r.error; Object.assign(c, r.data); }
    for (const old of colsDe(q.id).filter(o=>!cs.some(c=>c.id===o.id))) { const r=await sb.from("quad_colunas").delete().eq("id",old.id); if (r.error) throw new Error("a coluna "+old.nome+" ainda tem cartões"); }
    Q.colunas = Q.colunas.filter(c=>c.quadro!==q.id).concat(cs); toast("Colunas salvas."); desenhaQuadro();
  });
  const L=$("#colsL");
  const sinc = () => cs.forEach((c,i)=>{ c.nome=$(`[data-cn="${i}"]`).value; c.tipo=$(`[data-ct="${i}"]`).value; c.recolhida=$(`[data-cr="${i}"]`).checked; if (vendas) { const p=$(`[data-cp="${i}"]`).value; c.prob=p===""?null:+p; } });
  L.onclick = e => { const b=e.target.closest("button"); if (!b) return; sinc(); const d=b.dataset;
    if (d.up) { const i=+d.up; [cs[i-1],cs[i]]=[cs[i],cs[i-1]]; } else if (d.dn) { const i=+d.dn; [cs[i+1],cs[i]]=[cs[i],cs[i+1]]; }

    L.innerHTML=linhas(); };

/* ---------- COFRE (criptografia no navegador) ---------- */
const b64 = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
const ub64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const ITER = 600000, VERIF = "cofre-vital-ok";
async function derivar(senha, sal, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:ub64(sal), iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function cifrar(chave, texto){ const iv=crypto.getRandomValues(new Uint8Array(12)); const c=await crypto.subtle.encrypt({name:"AES-GCM", iv}, chave, new TextEncoder().encode(texto)); return {iv:b64(iv), cifra:b64(c)}; }
async function decifrar(chave, iv, cifra){ const p=await crypto.subtle.decrypt({name:"AES-GCM", iv:ub64(iv)}, chave, ub64(cifra)); return new TextDecoder().decode(p); }
function cofreAtivo(){ clearTimeout(Q.chaveT); Q.chaveT=setTimeout(trancar, 5*60e3); }
function trancar(){ Q.chave=null; clearTimeout(Q.chaveT); document.querySelectorAll("[data-segredo]").forEach(t=>{ t.value=""; }); const s=$("#cfStatus"); if (s) desenhaClientes(); }
document.addEventListener("visibilitychange", () => { if (document.hidden && Q.chave) { Q.oculto=setTimeout(trancar, 60e3); } else clearTimeout(Q.oculto); });
function pedirSenha(){
  return new Promise(res => {
    if (Q.chave) { cofreAtivo(); res(true); return; }
    if (!Q.cofreCfg) { toast(S.papel==="admin"?"Crie a senha do cofre primeiro (aba Clientes).":"O cofre ainda não foi criado pela administração."); res(false); return; }
    const d=$("#dlgS"), f=$("#dlgSF"); let ok=false;
    f.innerHTML = `<h3 style="margin:0">🔒 Destrancar o cofre</h3><p class="note2" style="margin:0">Digite a senha do cofre. Ele se tranca sozinho após 5 minutos sem uso.</p>
      <div class="field"><label for="cfS">Senha do cofre</label><input id="cfS" type="password" autocomplete="current-password" required></div>
      <p class="note" id="cfErr" role="alert" style="margin:0"></p>
      <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" id="cfOk" value="ok">Destrancar</button></div>`;
    f.onsubmit = async e => { if (e.submitter && e.submitter.value==="cancel") return; e.preventDefault(); const b=$("#cfOk"); b.disabled=true; b.textContent="Conferindo…";
      try { const c=Q.cofreCfg, k=await derivar($("#cfS").value, c.sal, c.iteracoes); if (await decifrar(k, c.verificador_iv, c.verificador)!==VERIF) throw 0;
        Q.chave=k; ok=true; cofreAtivo(); if (S.papel==="admin" && Q.pendentes) await trancarPendentes(); d.close(); }
      catch(x) { $("#cfErr").textContent = Q.chave ? "Cofre aberto, mas falhou ao trancar pendentes: "+(x.message||x) : "Senha incorreta."; if (Q.chave) { d.close(); } }
      finally { b.disabled=false; b.textContent="Destrancar"; } };
    d.addEventListener("close", ()=>res(ok), {once:true}); d.showModal(); setTimeout(()=>$("#cfS").focus(),50);
  });
}
async function trancarPendentes(){
  const p = await todos("cofre_pendente"); let n=0;
  for (const it of p) { const c=await cifrar(Q.chave, it.texto); const row={iv:c.iv, cifra:c.cifra}; if (it.cliente) row.cliente=it.cliente; else row.cartao=it.cartao;
    const r = await sb.from("cofre_itens").upsert(row, {onConflict: it.cliente?"cliente":"cartao"}); if (r.error) throw r.error;
    const d = await sb.from("cofre_pendente").delete().eq("id", it.id); if (d.error) throw d.error; n++; }
  Q.pendentes=0; if (n) toast(`${n} registro(s) vindos do Trello foram trancados no cofre.`);
}
function dlgCriarCofre(){
  abrir(`<h3 style="margin:0">🔐 Criar a senha do cofre</h3>
    <p class="note2" style="margin:0">As senhas dos clientes serão criptografadas no seu navegador com esta senha. <b>Nem o servidor nem o suporte conseguem ler — e não há como recuperar se ela for esquecida.</b> Guarde-a num lugar seguro e passe só a quem tiver acesso liberado.</p>
    <div class="field"><label for="ns1">Senha do cofre (mínimo 12 caracteres)</label><input id="ns1" type="password" autocomplete="new-password" minlength="12" required></div>
    <div class="field"><label for="ns2">Repita a senha</label><input id="ns2" type="password" autocomplete="new-password" required></div>
    <p class="note2" style="margin:0">Dica: uma frase com 4 palavras é forte e fácil de lembrar (ex.: <i>porteira-azul-café-trator</i>).</p>`,

    const r=await sb.from("cofre_config").insert({id:1, sal, iteracoes:ITER, verificador:v.cifra, verificador_iv:v.iv}).select().single(); if (r.error) throw r.error;

    (ref.cliente?Q.cofre.cli:Q.cofre.car).add(ref[campo]); sb.from("cofre_log").insert({[campo]:ref[campo], acao:"editou"}).then(()=>{}); toast("Guardado no cofre (criptografado)."); };

function desenhaClientes(){
  const v=$("#v-clientes"), f=Q.cf, b=f.busca.trim().toLowerCase();
  const abertos = id => Q.cartoes.filter(k=>k.cliente===id && colDe(k.coluna).tipo==="etapa").length;
  let L = Q.clientes.filter(c => (f.sit==="ativos" ? c.situacao==="ativo" : !f.sit || c.situacao===f.sit) && (!f.serv || c.servicos.includes(f.serv)) && (!b || (c.nome+" "+c.observacoes+" "+c.servicos.join(" ")).toLowerCase().includes(b)));

const RANK_HIST = {"Pesquisa":0.5};   // listas antigas do Trello que não existem mais
function analiseFunil(q){
  const cols=colsDe(q.id), etapas=cols.filter(c=>c.tipo==="etapa"), porNome=Object.fromEntries(cols.map(c=>[c.nome,c]));
  const N=etapas.length;
  const rank = nm => { const c=porNome[nm]; if (c) return c.tipo==="etapa" ? etapas.indexOf(c) : c.tipo==="ganho" ? N : -1; return nm in RANK_HIST ? RANK_HIST[nm] : -1; };
  const evs={}; Q.eventos.forEach(e=>{ (evs[e.cartao]=evs[e.cartao]||[]).push(e); }); Object.values(evs).forEach(a=>a.sort((x,y)=>x.em.localeCompare(y.em)));
  const negocios = Q.cartoes.filter(k=>k.quadro===q.id).map(k=>{
    const c=colDe(k.coluna), ev=evs[k.id]||[];
    const apoio = c.tipo==="apoio" && !ev.some(e=>rank(e.para_nome)>=0);
    const max = Math.max(rank(c.nome), ...ev.map(e=>rank(e.para_nome)));
    const ganhoEv = ev.find(e=>porNome[e.para_nome]&&porNome[e.para_nome].tipo==="ganho"); const perdaEv = [...ev].reverse().find(e=>porNome[e.para_nome]&&porNome[e.para_nome].tipo==="perdido");
    const tempos = {}; ev.forEach((e,i)=>{ const fim = i+1<ev.length ? ev[i+1].em : (c.tipo==="etapa" ? new Date().toISOString() : null); if (fim && e.para_nome) (tempos[e.para_nome]=tempos[e.para_nome]||[]).push(dias(e.em, fim)); });
    return {k, c, apoio, max, criado:k.criado_em, ganho:c.tipo==="ganho", perdido:c.tipo==="perdido", aberto:c.tipo==="etapa",
      fechadoEm: c.tipo==="ganho" ? (ganhoEv?ganhoEv.em:k.atualizado_em) : c.tipo==="perdido" ? (perdaEv?perdaEv.em:k.atualizado_em) : null, tempos, valor:Q.valores[k.id]||0, prob:c.prob };
  }).filter(n=>!n.apoio);
  return {cols, etapas, negocios};
}

  if (!(await pedirSenha())) return;
  abrir(`<h3 style="margin:0">Trocar a senha do cofre</h3><p class="note2" style="margin:0">Todos os registros serão criptografados de novo com a nova senha. Faça isso sempre que alguém deixar de ter acesso.</p>

function somaMeses(ano, porCaixa, conta){
  const M = {}; const add=(k,m,v)=>{ const a=M[k]||(M[k]=Array(13).fill(0)); a[m]+=v; a[12]+=v; };
  if (porCaixa) {

    .filter(x=>x.t && x.t.data>=ini).sort((a,b)=>a.t.data.localeCompare(b.t.data));
  for (const {p,t} of rec) for (const r of regrasDe(p.projeto)) {
    if (t.data < (r.inicio||ini) || (r.fim && t.data > r.fim)) continue;
    let v, d;
    if (r.tipo==="fixo") { const n=cont[r.id]||0; if (n >= (r.parcelas||1)) continue; cont[r.id]=n+1; v=r2(r.valor_fixo/(r.parcelas||1)); d=`parcela ${n+1}/${r.parcelas} de ${brl2(r.valor_fixo)}`; }
    else { const base = p.valor * (r.base==="liquida" ? 1 - r.imposto/100 : 1); v=r2(base*r.percentual/100);
      d=`${String(r.percentual).replace(".",",")}% de ${brl2(p.valor)}${r.base==="liquida"?` menos ${String(r.imposto).replace(".",",")}% de imposto`:" (bruto)"}`; }
    if (v>0) out.push({socio:r.socio, data:t.data, valor:v, projeto:p.projeto, desc:d, conf:!!r.confirmada, tx:t.id});
  }
  return out;
}
function contaSocio(socio, ate){
  const ini=iniC(), L=[];
  comissoesGeradas().forEach(c=>{ if (c.socio===socio && (!ate || c.data<=ate)) L.push({data:c.data, k:"comissao", valor:c.valor, titulo:"Comissão "+c.projeto, desc:c.desc, conf:c.conf, tx:c.tx, projeto:c.projeto}); });
  F.ajustes.forEach(a=>{ if (a.socio===socio && (!ate || a.data<=ate)) L.push({data:a.data, k:"ajuste", valor:a.valor, titulo:(TAJ[a.tipo]||"Ajuste")+(a.projeto?" — "+a.projeto:""), desc:a.descricao, id:a.id, projeto:a.projeto||""}); });
  F.partes.forEach(p=>{ if (p.socio!==socio) return; const t=F.txm.get(p.transacao); if (!t || t.data<ini || (ate && t.data>ate)) return;
    if (p.reembolso) L.push({data:t.data, k:"reemb", valor:0, titulo:"Reembolso pago junto", desc:`${p.categoria||""}: ${brl2(Math.abs(p.valor))} (não mexe no saldo)`, tx:t.id});
    else L.push({data:t.data, k:p.valor<0?"pago":"devolvido", valor:p.valor, titulo:p.valor<0?"Pago pela Vital":"Devolvido à Vital", desc:t.descricao+(p.obs?" · "+p.obs:""), tx:t.id}); });
  // Gastos particulares e adiantamentos de lucros do sócio: descontam do valor a receber.
  F.partes.forEach(p=>{ if (p.pessoal!==socio || p.socio===socio) return; const c=catDe(p); if (!c || c.tipo!=="particular") return;
    const t=F.txm.get(p.transacao); if (!t || t.data<ini || (ate && t.data>ate) || !r2(p.valor)) return;
    L.push({data:t.data, k:"particular", valor:r2(p.valor), titulo:c.nome, desc:t.descricao+(p.obs?" · "+p.obs:""), tx:t.id}); });
  L.sort((a,b)=>a.data.localeCompare(b.data) || b.valor-a.valor);
  let s=0; L.forEach(x=>{ s=r2(s+x.valor); x.saldo=s; });
  // FIFO: cada pagamento quita os créditos mais antigos em aberto.
  // Adiantamento ligado a um projeto (ex.: Agro TNZ) só compensa comissões desse projeto.
  const cred = L.filter(x=>x.valor>0).map(x=>(x.resto=x.valor, x.quitado=[], x));
  const deb = L.filter(x=>x.valor<0); deb.forEach(d=>{ d.quitou=[]; d.falta=-d.valor; });
  const quita = (d, ok) => { for (const c of cred) { if (d.falta<=0.004) break; if (c.resto<=0.004 || !ok(c)) continue; const q=Math.min(d.falta, c.resto); c.resto=r2(c.resto-q); d.falta=r2(d.falta-q); d.quitou.push({c, q}); c.quitado.push({d, q}); } };
  deb.filter(d=>d.k==="ajuste" && d.projeto).forEach(d=>quita(d, c=>chave(c.projeto)===chave(d.projeto)));
  deb.filter(d=>!(d.k==="ajuste" && d.projeto)).forEach(d=>quita(d, ()=>true));
  deb.forEach(d=>{ d.antecipado=r2(d.falta); delete d.falta; });
  const aberto = r2(cred.reduce((a,c)=>a+c.resto,0));
  const adiant = deb.filter(d=>d.antecipado>0.004).map(d=>({valor:d.antecipado, projeto:d.projeto||"", data:d.data}));
  const partic = r2(-L.filter(x=>x.k==="particular").reduce((a,x)=>a+x.valor,0));
  return {L, saldo:s, aberto, adiant, partic};
}

/* ---------- sugestão de classificação pelo histórico ---------- */
function sugestao(t){
  const k=chave(t.descricao), contra = chave((t.descricao.split(" - ")[1])||"");
  let alvo=null;
  for (const o of F.tx) { if (o.id===t.id || semClass(o)) continue; if (chave(o.descricao)===k) { alvo=o; break; } }
  if (!alvo && contra.length>3) for (const o of F.tx) { if (o.id===t.id || semClass(o) || Math.sign(o.valor)!==Math.sign(t.valor)) continue; if (chave((o.descricao.split(" - ")[1])||"")===contra) { alvo=o; break; } }
  if (!alvo) return null;
  const ps=(F.ptx.get(alvo.id)||[]).slice().sort((a,b)=>Math.abs(b.valor)-Math.abs(a.valor)); const p=ps[0];
  return {categoria:p.categoria, projeto:p.projeto, socio:p.socio, reembolso:!!p.reembolso, pessoal:p.pessoal||"", de:alvo};
}

function linhaRateio(p, i){
  return `<div class="rat" data-ri="${i}">
    <input type="number" step="0.01" aria-label="Valor" data-r="valor" value="${p.valor ?? ""}">
    <select aria-label="Categoria" data-r="categoria">${opCats(p.categoria)}</select>
    <input aria-label="Projeto ou cliente" list="fProjs" data-r="projeto" placeholder="Projeto / cliente" value="${esc(p.projeto||"")}">
    <input type="month" aria-label="Competência" data-r="competencia" value="${esc((p.competencia||"").slice(0,7))}">
    <select aria-label="Pago a (sócio ou colaborador)" data-r="socio">${opPessoas(p.socio, "— pago a —")}</select>
    <label class="note2" title="Marque quando esta parte é reembolso de uma despesa que o sócio pagou do bolso"><input type="checkbox" data-r="reembolso" ${p.reembolso?"checked":""}> reembolso</label>
    <button type="button" class="btn sm ghost" data-rdel="${i}" aria-label="Remover parte" ${i===0?"disabled":""}>×</button>
    <div style="grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap"><select aria-label="De qual sócio (particular)" data-r="pessoal" ${(F.catm.get(p.categoria)||{}).tipo==="particular"?"":"hidden"} style="max-width:220px">${opSocios(p.pessoal)}</select>
      <input aria-label="Observação" data-r="obs" placeholder="Observação (opcional)" value="${esc(p.obs||"")}" style="flex:1;min-width:200px"></div>
  </div>`;
}
function dlgRateio(t){
  let ps = (F.ptx.get(t.id)||[]).map(p=>({...p}));
  const sg = !ps.length ? sugestao(t) : null;
  if (!ps.length) ps=[{valor:t.valor, categoria:sg?sg.categoria:"", projeto:sg?sg.projeto:"", socio:sg?sg.socio:"", reembolso:sg?sg.reembolso:false, pessoal:sg?sg.pessoal:"", competencia:t.data.slice(0,7)+"-01", obs:""}];
  const ler = () => [...document.querySelectorAll("#fRat .rat")].map(r=>{ const g=k=>r.querySelector(`[data-r=${k}]`); return {valor:r2(g("valor").value), categoria:g("categoria").value, projeto:g("projeto").value.trim(), competencia:g("competencia").value?g("competencia").value+"-01":"", socio:g("socio").value, reembolso:g("reembolso").checked, pessoal:(F.catm.get(g("categoria").value)||{}).tipo==="particular"?g("pessoal").value:"", obs:g("obs").value.trim()}; });
  const html = () => ps.map(linhaRateio).join("");
  abrirLargo(`<h3 style="margin:0">${brl2(t.valor)} · ${fmtD(t.data)}</h3><p class="note2" style="margin:0">${esc(t.descricao)}</p>
    ${t.valor<0?`<div class="row cofreBox" style="gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-radius:8px"><b>Gasto particular de sócio?</b>
      <select id="fPN" aria-label="Tipo de gasto particular"><option value="">Não</option>${PESSOAL_CATS.map(n=>`<option ${ps.length===1&&ps[0].categoria===n?"selected":""}>${n}</option>`).join("")}</select>
      <select id="fPS" aria-label="Sócio">${opSocios(ps.length===1?ps[0].pessoal:"")}</select><span class="note2">não entra no DRE; fica na conta particular do sócio</span></div>`:""}
    ${sg?`<p class="cfst" style="margin:0">Sugestão pelo histórico (igual a ${fmtD(sg.de.data)}). Confira e salve.</p>`:""}
    <p class="note2" style="margin:0">Um PIX que paga duas comissões e um reembolso vira três partes. A soma das partes precisa dar o valor do lançamento. <b>Competência</b> é o mês a que a receita ou despesa pertence (vai para o DRE).</p>
    <div class="rat rath note2"><span>Valor</span><span>Categoria</span><span>Projeto / cliente</span><span>Competência</span><span>Pago a</span><span></span><span></span></div>
    <div id="fRat" class="stack" style="gap:10px">${html()}</div><datalist id="fProjs">${projetosF().map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
    <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" id="fDiv">+ Dividir em mais uma parte</button><b id="fFalta"></b></div>
    ${t.conta!=="cora"?`<div><button type="button" class="btn sm ghost" id="fTxDel">Excluir este lançamento em dinheiro</button></div>`:""}`,
  async () => { const nv=ler(); const soma=r2(nv.reduce((s,p)=>s+p.valor,0));
    if (nv.some(p=>!p.valor)) throw new Error("toda parte precisa de valor");
    if (nv.some(p=>PESSOAL_CATS.includes(p.categoria) && !p.pessoal)) throw new Error("escolha de qual sócio é o gasto particular");
    if (Math.abs(soma-t.valor)>0.009) throw new Error(`as partes somam ${brl2(soma)}, mas o lançamento é ${brl2(t.valor)}`);
    nv.forEach(p=>{ if (!p.socio) p.reembolso=false; });
    const r=await sb.rpc("fin_salvar_partes",{p_tx:t.id, p_partes:nv}); if (r.error) throw r.error;
    const novos=[...new Set(nv.map(p=>p.projeto).filter(x=>x && !F.projm.has(chave(x))))];
    if (novos.length) await sb.from("fin_projetos").insert(novos.map(nome=>({nome, ativo:true})));
    await carregarF(true); toast("Classificação salva."); desenhaF(); });
  const falta = () => { const s=r2(ler().reduce((a,p)=>a+p.valor,0)), d=r2(t.valor-s); $("#fFalta").textContent = Math.abs(d)<0.01 ? "Fechou ✓" : `Falta distribuir ${brl2(d)}`; $("#fFalta").className = Math.abs(d)<0.01 ? "" : "late"; return d; };
  const liga = () => { $("#fRat").oninput=falta; $("#fRat").onchange=e=>{ if (e.target.dataset.r==="categoria") { const r=e.target.closest(".rat"); r.querySelector("[data-r=pessoal]").hidden = (F.catm.get(e.target.value)||{}).tipo!=="particular"; }
      if (e.target.dataset.r==="socio" || e.target.dataset.r==="categoria") { const r=e.target.closest(".rat"); const cat=F.catm.get(r.querySelector("[data-r=categoria]").value); const so=r.querySelector("[data-r=socio]").value;
        if (e.target.dataset.r!=="reembolso" && so && cat && !["Comissão","Comissões Particular"].includes(cat.nome) && cat.tipo!=="particular") r.querySelector("[data-r=reembolso]").checked=true; } falta(); };
    document.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{ ps=ler(); ps.splice(+b.dataset.rdel,1); $("#fRat").innerHTML=html(); liga(); falta(); }); };
  liga(); falta();
  const pn=$("#fPN"); if (pn) { const ap=()=>{ ps=ler(); const n=pn.value, so=$("#fPS").value; if (!n) return; ps=[{...ps[0], valor:t.valor, categoria:n, pessoal:so, socio:"", reembolso:false, projeto:""}]; $("#fRat").innerHTML=html(); liga(); falta(); };
    pn.onchange=ap; $("#fPS").onchange=ap; }
  $("#fDiv").onclick=()=>{ ps=ler(); const d=falta(); ps.push({valor:d||"", categoria:"", projeto:"", competencia:t.data.slice(0,7)+"-01", socio:"", reembolso:false, obs:""}); $("#fRat").innerHTML=html(); liga(); falta(); };
  const del=$("#fTxDel"); if (del) del.onclick=async()=>{ if (!await pergunta("Excluir este lançamento em dinheiro?")) return; const r=await sb.from("fin_transacoes").delete().eq("id",t.id); if (r.error) { $("#dErr").textContent=r.error.message; return; } $("#dlg").close(); await carregarF(true); desenhaF(); };
}
function dlgDinheiro(){
  abrir(`<h3 style="margin:0">Lançamento em dinheiro</h3><p class="note2" style="margin:0">Para o que não passa pelo Cora (recebimento em espécie, despesa paga em dinheiro). Depois você classifica.</p>
    <div class="grid2"><div class="field"><label for="dnT">Tipo</label><select id="dnT"><option value="1">Entrada</option><option value="-1">Saída</option></select></div>
    <div class="field"><label for="dnV">Valor (R$)</label><input id="dnV" type="number" min="0.01" step="0.01" required></div></div>
    <div class="grid2"><div class="field"><label for="dnD">Data</label><input id="dnD" type="date" value="${hoje()}" required></div>
    <div class="field"><label for="dnS">Descrição</label><input id="dnS" required placeholder="Ex.: honorário recebido em espécie — Fulano"></div></div>`,
  async () => { const v=r2(+$("#dnV").value * +$("#dnT").value); if (!v) throw new Error("informe o valor");
    const id=crypto.randomUUID(); const r=await sb.from("fin_transacoes").insert({id, conta:"dinheiro", data:$("#dnD").value, valor:v, descricao:$("#dnS").value.trim()}); if (r.error) throw r.error;
    await carregarF(true); desenhaF(); setTimeout(()=>dlgRateio(F.txm.get(id)), 50); });
}

/* ---------- comissões ---------- */
function fComissoes(){
  const c=$("#fCorpo"), ini=iniC(); const nomes=contasVisiveis(); const contas = Object.fromEntries(nomes.map(s=>[s, contaSocio(s)]));
  if (!nomes.includes(F.cc)) F.cc=nomes[0];
  const cs = contas[F.cc] || {L:[], saldo:0};
  const semRegra = {}; F.partes.forEach(p=>{ if (tipoDRE(p)!=="receita" || p.valor<=0) return; const t=F.txm.get(p.transacao); if (!t || t.data<ini) return;
    const k=p.projeto||""; const pj=F.projm.get(chave(k)); if (k && (regrasDe(k).length || (pj && pj.sem_comissao))) return; (semRegra[k]=semRegra[k]||{n:0,v:0,ult:""}); semRegra[k].n++; semRegra[k].v+=p.valor; if (t.data>semRegra[k].ult) semRegra[k].ult=t.data; });
  const semL = Object.entries(semRegra).sort((a,b)=>b[1].v-a[1].v);
  const pend = F.regras.filter(r=>!r.confirmada).length;
  const credL = cs.L.filter(x=>x.valor>0&&x.k!=="particular"), pagL = cs.L.filter(x=>(x.valor<0&&x.k!=="particular")||x.k==="reemb"), parL = cs.L.filter(x=>x.k==="particular");
  const sit = x => { const u=x.quitado[x.quitado.length-1]; return x.resto<=0.004 ? `<span class="qd ok">${u&&u.d.k==="ajuste"?"compensado com "+esc((u.d.titulo||"").toLowerCase())+" de "+fmtD(u.d.data):"pago "+(u?fmtD(u.d.data):"")}</span>` : x.resto<x.valor ? `<span class="qd warn">parcial · falta ${brl2(x.resto)}</span>` : `<span class="qd">em aberto</span>`; };
  c.innerHTML = `<p class="note2" style="margin:0">Comissões controladas no portal desde <b>${fmtD(ini)}</b>. Tudo o que foi pago até ${fmtD(new Date(new Date(ini+"T12:00:00")-864e5).toISOString().slice(0,10))} foi considerado quitado. Cada recebimento de cliente gera a comissão pelos critérios do projeto; cada PIX — e cada gasto particular ou adiantamento de lucros do sócio — quita as comissões mais antigas primeiro.
      ${pend?` <button class="lk" data-firp="1">${pend} critério(s) a confirmar →</button>`:""}</p>
    <div class="kpis">${nomes.map(s=>{ const o=contas[s], v=o.aberto; return `<button class="kpi ${s===F.cc?"sel":""}" data-fcc="${esc(s)}" style="text-align:left;cursor:pointer;font:inherit"><span class="l">${esc(s)}</span><span class="v ${v>0.004?"pos":""}">${brl2(v)}</span><span class="l">${v>0.004?"comissões em aberto":"nada em aberto"}</span>${o.partic>0.004?`<span class="l">já descontados ${brl2(o.partic)} de particular / adiantamento de lucros</span>`:""}${o.adiant.map(a=>`<span class="l" style="color:var(--warn,#9a5b00)">adiantado ${brl2(a.valor)}${a.projeto?" ("+esc(a.projeto)+")":""} — compensa quando ${a.projeto?"o cliente pagar":"houver comissão"}</span>`).join("")}</button>`; }).join("")}</div>
    ${semL.length?`<div class="card stack cofreBox"><b>Recebimentos sem critério de comissão (${semL.length})</b><p class="note2" style="margin:0">Defina quem comissiona. Se ninguém comissiona, marque — o aviso some.</p>
      <div class="tablewrap"><table><thead><tr><th>Projeto</th><th class="num">Recebimentos</th><th class="num">Total</th><th>Último</th><th></th></tr></thead><tbody>
      ${semL.map(([k,o])=>`<tr><td>${k?esc(k):`<i>sem projeto</i>`}</td><td class="num">${o.n}</td><td class="num">${brl2(o.v)}</td><td>${fmtD(o.ult)}</td><td>${k?`<button class="btn sm" data-fnr="${esc(k)}">Definir comissionados</button> <button class="btn sm ghost" data-fsc="${esc(k)}">Ninguém comissiona</button>`:`<button class="btn sm ghost" data-firsem="1">Informar o projeto</button>`}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    ${F.cc?`<div class="card stack"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><h3 class="fh">Conta de ${esc(F.cc)}</h3>
      <div class="row" style="gap:6px"><button class="btn sm" id="fAjR">+ Reembolso a pagar</button><button class="btn sm ghost" id="fAjA">+ Adiantamento / ajuste</button></div></div>
      <h4 class="fh4">Comissões geradas</h4>
      ${credL.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>O quê</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>
        ${credL.map(x=>`<tr><td>${fmtD(x.data)}</td><td style="white-space:normal"><b>${esc(x.titulo)}</b> <span class="note2">${esc(x.desc)}</span>${x.k==="comissao"&&!x.conf?` <span class="qd warn" title="O critério deste projeto ainda não foi confirmado pelos sócios">critério a confirmar</span>`:""}</td><td class="num">${brl2(x.valor)}</td><td>${sit(x)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">Nenhuma comissão gerada desde ${fmtD(ini)}.</p>`}
      <h4 class="fh4">Pagamentos e o que cada um quitou</h4>
      ${pagL.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Pagamento</th><th class="num">Valor</th><th>Quitou</th></tr></thead><tbody>
        ${pagL.map(x=>`<tr ${x.tx?`class="clk" data-ftx="${x.tx}"`:""}><td>${fmtD(x.data)}</td><td style="white-space:normal"><b>${esc(x.titulo)}</b> <span class="note2">${esc(x.desc)}</span></td><td class="num ${sinal(x.valor)}">${x.k==="reemb"?"–":brl2(x.valor)}</td>
          <td style="white-space:normal;font-size:.84rem">${x.k==="reemb"?"reembolso de despesa":(x.quitou||[]).map(q=>`${esc(q.c.titulo)} (${fmtD(q.c.data)}) ${brl2(q.q)}`).join("<br>")}${x.antecipado>0.004?`<br><span class="qd warn">${brl2(x.antecipado)} adiantado</span>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">Nenhum pagamento desde ${fmtD(ini)}.</p>`}
      <h4 class="fh4">Particular e adiantamento de lucros (descontados do valor a receber)</h4>
      ${parL.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Lançamento</th><th class="num">Valor</th><th>Descontou de</th></tr></thead><tbody>
        ${parL.map(x=>`<tr class="clk" data-ftx="${x.tx}"><td>${fmtD(x.data)}</td><td style="white-space:normal"><b>${esc(x.titulo)}</b> <span class="note2">${esc(x.desc)}</span></td><td class="num ${sinal(x.valor)}">${brl2(x.valor)}</td>
          <td style="white-space:normal;font-size:.84rem">${x.valor>0?"devolvido pelo sócio":(x.quitou||[]).map(q=>`${esc(q.c.titulo)} (${fmtD(q.c.data)}) ${brl2(q.q)}`).join("<br>")}${x.antecipado>0.004?`<br><span class="qd warn">${brl2(x.antecipado)} a descontar das próximas comissões</span>`:""}</td></tr>`).join("")}
        <tr class="tot"><td></td><td><b>Total descontado</b></td><td class="num neg"><b>${brl2(-cs.partic)}</b></td><td></td></tr></tbody></table></div>`:`<p class="note">Nenhum gasto particular ou adiantamento de lucros de ${esc(F.cc)} desde ${fmtD(ini)}. Para lançar, classifique o gasto como "Despesa pessoal de sócio" ou "Adiantamento de lucros" e escolha o sócio.</p>`}
      <details><summary class="note2">Extrato completo da conta (${cs.L.length} movimentos)</summary>
        <div class="tablewrap"><table><thead><tr><th>Data</th><th>Movimento</th><th class="num">Valor</th><th class="num">Saldo</th><th></th></tr></thead><tbody>
        ${cs.L.map(x=>`<tr><td>${fmtD(x.data)}</td><td style="white-space:normal">${esc(x.titulo)} <span class="note2">${esc(x.desc)}</span></td><td class="num ${sinal(x.valor)}">${x.valor?brl2(x.valor):"–"}</td><td class="num ${sinal(x.saldo)}">${brl2(x.saldo)}</td><td>${x.k==="ajuste"?`<button class="lk" data-fajd="${x.id}">excluir</button>`:""}</td></tr>`).join("")}</tbody></table></div></details></div>`:""}`;
  c.querySelectorAll("[data-fcc]").forEach(b=>b.onclick=()=>{ F.cc=b.dataset.fcc; fComissoes(); });
  c.querySelectorAll("[data-ftx]").forEach(r=>r.onclick=()=>dlgRateio(F.txm.get(r.dataset.ftx)));
  c.querySelectorAll("[data-fnr]").forEach(b=>b.onclick=()=>dlgProjetoFin(F.projm.get(chave(b.dataset.fnr)), b.dataset.fnr));
  c.querySelectorAll("[data-fsc]").forEach(b=>b.onclick=async()=>{ b.disabled=true; await semComissao(b.dataset.fsc); fComissoes(); });
  c.querySelectorAll("[data-firsem]").forEach(b=>b.onclick=()=>{ F.sub="lanc"; F.lf={mes:"", busca:"", sem:false, conta:""}; desenhaF(); });
  c.querySelectorAll("[data-firp]").forEach(b=>b.onclick=()=>{ F.sub="projetos"; F.pf.pend=true; desenhaF(); });
  c.querySelectorAll("[data-fajd]").forEach(b=>b.onclick=async()=>{ if (!await pergunta("Excluir este ajuste?")) return; const r=await sb.from("fin_ajustes").delete().eq("id",b.dataset.fajd); if (r.error) { toast(r.error.message); return; } await carregarF(true); fComissoes(); });
  const aR=$("#fAjR"); if (aR) { aR.onclick=()=>dlgAjuste("reembolso"); $("#fAjA").onclick=()=>dlgAjuste("adiantamento"); }
}
async function semComissao(nome){
  const p=F.projm.get(chave(nome));
  const r = p ? await sb.from("fin_projetos").update({sem_comissao:true}).eq("nome",p.nome) : await sb.from("fin_projetos").insert({nome, ativo:true, sem_comissao:true});
  if (r.error) { toast(r.error.message); return; } await carregarF(true);
}
function textoRegra(r){
  if (r.tipo==="fixo") return `${brl2(r.valor_fixo)} em ${r.parcelas} parcela(s) de ${brl2(r.valor_fixo/(r.parcelas||1))} (uma por recebimento)`;
  return `${String(r.percentual).replace(".",",")}% ${r.base==="liquida"?`do líquido (bruto menos ${String(r.imposto).replace(".",",")}% de imposto)`:"do valor bruto recebido"}`;
}
const chipRegra = r => `<span class="qd ${r.confirmada?"ok":"warn"}" title="${esc(textoRegra(r))}${r.confirmada?"":" — a confirmar"}">${esc(r.socio)} ${r.tipo==="fixo"?brl0(r.valor_fixo)+" em "+r.parcelas+"x":String(r.percentual).replace(".",",")+"%"+(r.base==="bruta"?" bruto":"")}</span>`;

/* ---------- projetos e clientes (critérios de comissão) ---------- */
function fProjetos(){
  const c=$("#fCorpo"), f=F.pf, b=chave(f.busca);
  const desde = new Date(Date.now()-365*864e5).toISOString().slice(0,10);
  const rec={}; F.partes.forEach(p=>{ if (tipoDRE(p)!=="receita"||!p.projeto) return; const t=F.txm.get(p.transacao); if (!t||t.data<desde) return; const k=chave(p.projeto); rec[k]=(rec[k]||0)+p.valor; });
  const semDef = p => !regrasDe(p.nome).length && !p.sem_comissao;
  const lista = F.projetos.filter(p=> (f.sit==="todos" || (f.sit==="ativos")===!!p.ativo)
     && (!f.sem || semDef(p)) && (!f.pend || regrasDe(p.nome).some(r=>!r.confirmada)) && servOk(p, f.serv)
     && (!f.com || (f.com==="-" ? semDef(p) : f.com==="0" ? (p.sem_comissao && !regrasDe(p.nome).length) : regrasDe(p.nome).some(r=>r.socio===f.com)))
     && (!b || chave([p.nome, cliNomeF(p.cliente), SERVF[p.servico]||"", regrasDe(p.nome).map(r=>r.socio).join(" ")].join(" ")).includes(b)));
  const chaveOrd = { nome:p=>chave(p.nome), servico:p=>p.servico?chave(SERVF[p.servico]):"\uffff", com:p=>{ const rs=regrasDe(p.nome); return rs.length?chave(rs.map(r=>r.socio).sort().join(" ")):p.sem_comissao?"\ufffe":"\uffff"; }, rec:p=>rec[chave(p.nome)]||0, ativo:p=>p.ativo?0:1 }[f.ord];
  lista.sort((a,b)=>{ const x=chaveOrd(a), y=chaveOrd(b); const r = typeof x==="number" ? x-y : x.localeCompare(y,"pt-BR"); return (r||chave(a.nome).localeCompare(chave(b.nome),"pt-BR"))*(f.ord==="rec"?-f.dir:f.dir); });
  [...f.sel].forEach(n=>{ if (!F.projm.has(chave(n))) f.sel.delete(n); });
  const nSel=f.sel.size, todosSel = lista.length && lista.every(p=>f.sel.has(p.nome));
  const th = (k, rot, cls) => `<th class="${cls||""}"><button type="button" class="thsort" data-ford="${k}" aria-label="Ordenar por ${rot}">${rot} <span aria-hidden="true">${f.ord===k?(f.dir>0?(k==="rec"?"▼":"▲ A→Z"):(k==="rec"?"▲":"▼ Z→A")):"↕"}</span></button></th>`;
  const ativos=F.projetos.filter(p=>p.ativo), nSem=ativos.filter(semDef).length, nPend=F.projetos.filter(p=>regrasDe(p.nome).some(r=>!r.confirmada)).length;
  c.innerHTML = `<div class="card stack" style="padding:12px 14px">
      <p class="note2" style="margin:0"><b>Padrão da Vital:</b> serviços contábeis recorrentes comissionam só a Bruna; o George é comissionado em societário, declarações e regularizações; assessorias, caso a caso. Um projeto pode ter vários comissionados (sócios ou colaboradores).</p>

  $("#pjCm").onchange=e=>{ f.com=e.target.value; fProjetos(); };

function dlgLote(nomes){
  let rs=[{tipo:"percentual", base:"liquida", imposto:6, inicio:iniC(), confirmada:true}];
  const ler = () => [...document.querySelectorAll("#ltR .rgl")].map(row=>{ const g=k=>row.querySelector(`[data-g=${k}]`); const o={};

  const servs=[...new Set(nomes.map(n=>(F.projm.get(chave(n))||{}).servico||""))];
  abrirLargo(`<h3 style="margin:0">Comissionados em lote — ${nomes.length} projeto(s)</h3>
    <p class="note2" style="margin:0;max-height:64px;overflow:auto">${nomes.map(esc).join(" · ")}</p>
    <div class="stack" style="gap:6px"><label class="chk"><input type="radio" name="ltM" value="add" checked><span><b>Acrescentar</b> — mantém quem já está e inclui (ou atualiza) estes comissionados</span></label>
      <label class="chk"><input type="radio" name="ltM" value="sub"><span><b>Substituir</b> — apaga os comissionados atuais e deixa só estes</span></label></div>
    <p class="note2" style="margin:0">Em cada linha: quem recebe, como, o percentual (ou o valor total e as parcelas), a base, o imposto descontado quando a base é o líquido, e desde quando vale.</p>
    <div id="ltR" class="stack" style="gap:8px">${rs.map(linhaCom).join("")}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" id="ltMais">+ Adicionar comissionado</button>${servs.length===1&&PADRAO[servs[0]]?`<span class="note2">Padrão para ${esc(SERVF[servs[0]])}: ${PADRAO[servs[0]].join(", ")}</span>`:""}</div>`,
  async () => { const nv=ler().filter(r=>r.socio); if (!nv.length) throw new Error("escolha quem recebe");
    for (const r of nv) if (r.tipo==="fixo" ? !(+r.valor_fixo>0 && +r.parcelas>0) : !(r.percentual!=="" && +r.percentual>=0)) throw new Error(`complete o critério de ${r.socio}`);
    const novos = nv.map(r=>({...r, percentual:r.tipo==="fixo"?"":r.percentual, base:r.tipo==="fixo"?"bruta":r.base, imposto:r.tipo==="fixo"?"0":r.imposto, valor_fixo:r.tipo==="fixo"?r.valor_fixo:"", parcelas:r.tipo==="fixo"?r.parcelas:""}));
    const sub = document.querySelector("[name=ltM]:checked").value==="sub"; let ok=0, erros=[];
    for (const n of nomes) { const p=F.projm.get(chave(n)); if (!p) continue;
      const atuais = sub ? [] : regrasDe(n).filter(r=>!novos.some(x=>x.socio===r.socio)).map(r=>({socio:r.socio, tipo:r.tipo, percentual:r.percentual??"", base:r.base, imposto:r.imposto??"", valor_fixo:r.valor_fixo??"", parcelas:r.parcelas??"", inicio:r.inicio||"", fim:r.fim||"", confirmada:r.confirmada, obs:r.obs||""}));
      const x=await sb.rpc("fin_salvar_projeto",{p_nome_antigo:p.nome, p_projeto:{nome:p.nome, ativo:p.ativo, servico:p.servico||"", sem_comissao:false, obs:p.obs||"", cliente:p.cliente||""}, p_regras:atuais.concat(novos)});
      if (x.error) erros.push(n+": "+x.error.message); else ok++; }
    await carregarF(true); F.pf.sel.clear(); toast(`Comissionados aplicados em ${ok} projeto(s).${erros.length?" Falhou: "+erros.length:""}`); desenhaF();
    if (erros.length) throw new Error(erros.slice(0,3).join("; ")); });
  const liga=()=>{ document.querySelectorAll("#ltR [data-g=tipo]").forEach(s=>s.onchange=()=>{ s.closest(".rgl").dataset.tipo=s.value; });
    document.querySelectorAll("#ltR [data-g=socio]").forEach(s=>s.onchange=()=>{ const pe=F.pessoas.find(x=>x.nome===s.value), pc=s.closest(".rgl").querySelector("[data-g=percentual]"); if (pe && pe.percentual_padrao!=null && pc.value==="") pc.value=pe.percentual_padrao; });
    document.querySelectorAll("#ltR [data-rgdel]").forEach(b=>b.onclick=()=>{ rs=ler(); rs.splice(+b.dataset.rgdel,1); $("#ltR").innerHTML=rs.map(linhaCom).join(""); liga(); }); };
  liga(); $("#ltMais").onclick=()=>{ rs=ler(); rs.push({tipo:"percentual", base:"liquida", imposto:6, inicio:iniC(), confirmada:true}); $("#ltR").innerHTML=rs.map(linhaCom).join(""); liga(); };
}
const opPessoas = (sel, vazio) => (vazio?`<option value="">${vazio}</option>`:"") + F.pessoas.filter(p=>p.ativo||p.nome===sel).map(p=>`<option value="${esc(p.nome)}" ${p.nome===sel?"selected":""}>${esc(p.nome)}${p.tipo==="socio"?"":" ("+TIPOP[p.tipo].toLowerCase()+")"}${p.ativo?"":" — inativo"}</option>`).join("");
function linhaCom(r, i){
