  return `<div class="rgl" data-ri="${i}" data-tipo="${t}">
    <select data-g="socio" aria-label="Comissionado">${opPessoas(r.socio, "— quem recebe —")}</select>
    <select data-g="tipo" aria-label="Tipo"><option value="percentual" ${t==="percentual"?"selected":""}>% de cada recebimento</option><option value="fixo" ${t==="fixo"?"selected":""}>Valor fixo em parcelas</option></select>
    <input class="cpc" data-g="percentual" type="number" min="0" max="100" step="0.1" placeholder="%" aria-label="Percentual" value="${r.percentual??""}">
    <select class="cpc" data-g="base" aria-label="Base"><option value="liquida" ${r.base!=="bruta"?"selected":""}>do líquido</option><option value="bruta" ${r.base==="bruta"?"selected":""}>do bruto</option></select>
    <input class="cpc" data-g="imposto" placeholder="imp. %" type="number" min="0" max="50" step="0.1" aria-label="Imposto descontado (%)" title="Imposto descontado (%)" value="${r.imposto??6}">
    <input class="cfx" data-g="valor_fixo" type="number" min="0" step="0.01" placeholder="R$ total" aria-label="Valor total" value="${r.valor_fixo??""}">
    <input class="cfx" data-g="parcelas" type="number" min="1" step="1" placeholder="parcelas" aria-label="Parcelas" value="${r.parcelas??""}"><span class="cfx"></span>
    <input data-g="inicio" type="date" aria-label="Vale a partir de" title="Vale a partir de" value="${esc(r.inicio||iniC())}">
    <label class="note2"><input type="checkbox" data-g="confirmada" ${r.confirmada!==false?"checked":""}> confirmado</label>
    <button type="button" class="btn sm ghost" data-rgdel="${i}" aria-label="Remover comissionado">×</button>
    ${r.obs?`<span class="note2" style="grid-column:1/-1">${esc(r.obs)}</span>`:""}<input type="hidden" data-g="obs" value="${esc(r.obs||"")}"><input type="hidden" data-g="fim" value="${esc(r.fim||"")}">
  </div>`;
}
function dlgProjetoFin(p, nomeNovo){
  const novo=!p; p = p || {nome:nomeNovo||"", ativo:true, servico:"", sem_comissao:false, obs:"", cliente:null};
  let rs = regrasDe(p.nome).map(r=>({...r}));
  const ler = () => [...document.querySelectorAll("#pjR .rgl")].map(row=>{ const g=k=>row.querySelector(`[data-g=${k}]`); const o={};
    ["socio","tipo","percentual","base","imposto","valor_fixo","parcelas","inicio","obs","fim"].forEach(k=>o[k]=g(k).value); o.confirmada=g("confirmada").checked; return o; });
  const html = () => rs.length ? rs.map(linhaCom).join("") : `<p class="note2" style="margin:0">Nenhum comissionado.</p>`;
  const clis = (F.clientes||[]).slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  abrirLargo(`<h3 style="margin:0">${novo?"Novo projeto / cliente":"Critérios de comissão"}</h3>
    <div class="grid2"><div class="field"><label for="pjN">Nome do projeto (igual ao usado nos lançamentos)</label><input id="pjN" required value="${esc(p.nome)}"></div>
      <div class="field"><label for="pjC">Cliente no cadastro</label><select id="pjC"><option value="">— sem vínculo —</option><option value="+novo">＋ Criar no cadastro com o nome do projeto</option>${clis.map(x=>`<option value="${x.id}" ${x.id===p.cliente||(!p.cliente&&p.nome&&chave(x.nome)===chave(p.nome))?"selected":""}>${esc(x.nome)}${x.situacao!=="ativo"?" ("+x.situacao+")":""}</option>`).join("")}</select></div></div>
    <div class="grid2"><div class="field"><label for="pjSv">Tipo de serviço</label><select id="pjSv"><option value="">A definir</option>${opServ(p.servico)}</select></div>
      <div class="stack" style="gap:6px;align-self:end"><label class="chk"><input type="checkbox" id="pjA" ${p.ativo?"checked":""}><span>Projeto ativo</span></label>
        <label class="chk"><input type="checkbox" id="pjZ" ${p.sem_comissao?"checked":""}><span>Ninguém comissiona</span></label></div></div>
    <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Comissionados</b><span class="note2" id="pjPad"></span></div>
    <p class="note2" style="margin:0">Em cada linha: quem recebe, como, o percentual (ou o valor total e as parcelas), a base, o imposto descontado quando a base é o líquido, e desde quando vale.</p>
    <div id="pjR" class="stack" style="gap:8px">${html()}</div>
    <div><button type="button" class="btn sm" id="pjMais">+ Adicionar comissionado</button></div>
    <div class="field"><label for="pjO">Observação</label><input id="pjO" value="${esc(p.obs||"")}"></div>
    ${novo?"":`<div><button type="button" class="btn sm ghost" id="pjDel">Excluir projeto</button></div>`}`,
  async () => { const nv=ler(), nome=$("#pjN").value.trim(); if (!nome) throw new Error("informe o nome do projeto");
    if (novo && F.projm.has(chave(nome))) throw new Error("já existe um projeto com esse nome");
    for (const r of nv) { if (!r.socio) throw new Error("escolha quem recebe em todas as linhas");
      if (r.tipo==="fixo" ? !(+r.valor_fixo>0 && +r.parcelas>0) : !(r.percentual!=="" && +r.percentual>=0)) throw new Error(`complete o critério de ${r.socio}`); }
    const reg = nv.map(r=>({...r, percentual:r.tipo==="fixo"?"":r.percentual, base:r.tipo==="fixo"?"bruta":r.base, imposto:r.tipo==="fixo"?"0":r.imposto, valor_fixo:r.tipo==="fixo"?r.valor_fixo:"", parcelas:r.tipo==="fixo"?r.parcelas:""}));
    let cli=$("#pjC").value;
    if (cli==="+novo") { const ex=(F.clientes||[]).find(c=>chave(c.nome)===chave(nome));
      if (ex) cli=ex.id; else { const c=await sb.from("cad_clientes").insert({nome, situacao:$("#pjA").checked?"ativo":"inativo"}).select("id,nome,situacao").single(); if (c.error) throw c.error; cli=c.data.id; (F.clientes=F.clientes||[]).push(c.data); if (typeof Q!=="undefined") Q.ok=false; } }
    const x=await sb.rpc("fin_salvar_projeto",{p_nome_antigo: novo?null:p.nome, p_projeto:{nome, ativo:$("#pjA").checked, servico:$("#pjSv").value, sem_comissao: nv.length?false:$("#pjZ").checked, obs:$("#pjO").value.trim(), cliente:cli}, p_regras:reg});
    if (x.error) throw x.error; await carregarF(true); toast("Critérios salvos."); desenhaF(); });
  const pad = () => { const ps=(PADRAO[$("#pjSv").value]||[]).filter(n=>F.pessoas.some(x=>x.nome===n&&x.ativo)); const ja=ler().map(r=>r.socio);
    $("#pjPad").innerHTML = $("#pjSv").value==="assessoria" ? "Assessoria: definir caso a caso" : ps.length ? `Padrão: ${ps.map(n=>ja.includes(n)?esc(n)+" ✓":`<button type="button" class="lk" data-padd="${esc(n)}">+ ${esc(n)}</button>`).join(" ")}` : "";
    document.querySelectorAll("[data-padd]").forEach(b=>b.onclick=()=>{ rs=ler(); const pe=F.pessoas.find(x=>x.nome===b.dataset.padd); rs.push({socio:b.dataset.padd, tipo:"percentual", percentual:pe&&pe.percentual_padrao!=null?pe.percentual_padrao:"", base:"liquida", imposto:6, inicio:iniC(), confirmada:true}); redesenha(); }); };
  const redesenha = () => { $("#pjR").innerHTML=html(); liga(); pad(); if (rs.length) $("#pjZ").checked=false; };
  const liga = () => { document.querySelectorAll("#pjR [data-g=tipo]").forEach(s=>s.onchange=()=>{ s.closest(".rgl").dataset.tipo=s.value; });
    document.querySelectorAll("#pjR [data-g=socio]").forEach(s=>s.onchange=()=>{ pad(); const pe=F.pessoas.find(x=>x.nome===s.value), pc=s.closest(".rgl").querySelector("[data-g=percentual]"); if (pe && pe.percentual_padrao!=null && pc.value==="") pc.value=pe.percentual_padrao; });
    document.querySelectorAll("[data-rgdel]").forEach(b=>b.onclick=()=>{ rs=ler(); rs.splice(+b.dataset.rgdel,1); redesenha(); }); };
  liga(); pad(); $("#pjSv").onchange=pad;
  $("#pjMais").onclick=()=>{ rs=ler(); rs.push({tipo:"percentual", base:"liquida", imposto:6, inicio:iniC(), confirmada:true}); redesenha(); };
  const del=$("#pjDel"); if (del) del.onclick=async()=>{ if (F.partes.some(x=>chave(x.projeto)===chave(p.nome))) { $("#dErr").textContent="Este projeto tem lançamentos. Desmarque “Projeto ativo” em vez de excluir."; return; }
    if (!await pergunta("Excluir este projeto e seus critérios de comissão?")) return;
    let r=await sb.from("fin_regras").delete().eq("projeto",p.nome); if (!r.error) r=await sb.from("fin_projetos").delete().eq("nome",p.nome); if (r.error) { $("#dErr").textContent=r.error.message; return; }
    $("#dlg").close(); await carregarF(true); desenhaF(); };
}

/* ---------- pessoas: sócios e colaboradores ---------- */
function fPessoas(){
  const c=$("#fCorpo"); const qt = n => new Set(F.regras.filter(r=>r.socio===n).map(r=>chave(r.projeto))).size;

/* ---------- balanço ---------- */
const GRUPOS_BP = [["ativo_circulante","Ativo circulante"],["ativo_nao_circulante","Ativo não circulante"],["passivo_circulante","Passivo circulante"],["passivo_nao_circulante","Passivo não circulante"],["patrimonio_liquido","Patrimônio líquido"]];
const CONTAS_PADRAO = {ativo_circulante:["Contas a receber de clientes"], ativo_nao_circulante:["Veículos e equipamentos"], passivo_circulante:["Impostos a recolher","Empréstimos (até 12 meses)"], passivo_nao_circulante:["Empréstimos (após 12 meses)"], patrimonio_liquido:["Capital social"]};
function bpDoMes(mes){
  const fim = fimMes(+mes.slice(0,4), +mes.slice(5,7)-1);
  let manual = F.bal.filter(b=>b.mes.slice(0,7)===mes.slice(0,7)), copiado=null;
  if (!manual.length) { const ant = [...new Set(F.bal.map(b=>b.mes.slice(0,7)))].filter(m=>m<mes.slice(0,7)).sort().pop(); if (ant) { manual = F.bal.filter(b=>b.mes.slice(0,7)===ant); copiado=ant; } }
  const auto = []; const cora=saldoAte("cora",fim), din=saldoAte("dinheiro",fim);
  auto.push(["ativo_circulante","Banco Cora (extrato)",cora]); if (r2(din)) auto.push([din>0?"ativo_circulante":"passivo_circulante","Caixa em dinheiro (conferir)",Math.abs(din)]);
  let deve=0, adiant=0; if (fim>=iniC()) contasVisiveis().forEach(s=>{ const o=contaSocio(s,fim); deve+=o.aberto; adiant+=o.adiant.reduce((a,x)=>a+x.valor,0); });
  if (r2(deve)) auto.push(["passivo_circulante","Comissões e reembolsos a pagar aos sócios",deve]); if (r2(adiant)) auto.push(["ativo_circulante","Adiantamentos a sócios",adiant]);
  const L = auto.map(([g,c,v])=>({grupo:g, conta:c, valor:r2(v), auto:true})).concat(manual.map(b=>({grupo:b.grupo, conta:b.conta, valor:b.valor})));
  const tot = g => r2(L.filter(x=>x.grupo===g).reduce((s,x)=>s+x.valor,0));
  const A = tot("ativo_circulante")+tot("ativo_nao_circulante"), P = tot("passivo_circulante")+tot("passivo_nao_circulante");
  const acum = r2(A - P - tot("patrimonio_liquido")); L.push({grupo:"patrimonio_liquido", conta:"Resultado acumulado (fecha o balanço)", valor:acum, auto:true});
  return {L, tot, A:r2(A), P:r2(P), PL:r2(tot("patrimonio_liquido")), fim, copiado, manual};
}

/* ---------- importar extrato (OFX do Cora) ---------- */
function lerOFX(txt){
  const out=[]; for (const b of txt.split(/<STMTTRN>/i).slice(1)) {
    const g = t => { const m=b.match(new RegExp("<"+t+">([^<\\r\\n]*)","i")); return m ? m[1].trim() : ""; };
    const d=g("DTPOSTED"), v=r2(g("TRNAMT").replace(",",".")); if (!/^\d{8}/.test(d) || !v) continue;
    out.push({fitid:g("FITID")||null, data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, valor:v, descricao:(g("MEMO")||g("NAME")).replace(/\s+/g," ").trim(), conta:"cora"});
  }
  const sb_ = txt.match(/<LEDGERBAL>[\s\S]*?<BALAMT>([^<\r\n]*)[\s\S]*?<DTASOF>(\d{8})/i);
  return {itens:out, saldo: sb_ ? {valor:r2(sb_[1].replace(",",".")), data:`${sb_[2].slice(0,4)}-${sb_[2].slice(4,6)}-${sb_[2].slice(6,8)}`} : null};
}
function fImportar(){
  const c=$("#fCorpo"), ult = F.tx.filter(t=>t.conta==="cora")[0];

        <li>Escolha o arquivo aqui embaixo e confira o resumo.</li><li>Clique em “Importar”. Depois classifique em <b>Lançamentos</b> (o histórico sugere a maioria).</li></ol>
      <p class="note2" style="margin:0">Último lançamento do Cora no portal: ${ult?`${fmtD(ult.data)} · saldo ${brl2(saldoAte("cora",ult.data))}`:"nenhum"}</p>
      <div class="field"><label for="ofx">Arquivo OFX</label><input id="ofx" type="file" accept=".ofx,.OFX,application/x-ofx"></div><div id="ofxR"></div></div>`;

      const {itens, saldo} = lerOFX(txt); if (!itens.length) throw new Error("não encontrei lançamentos neste arquivo. Ele é mesmo um OFX?");
      const tem = new Set(F.tx.map(t=>t.fitid).filter(Boolean)); const novos = itens.filter(i=>!i.fitid || !tem.has(i.fitid));
      const ds = itens.map(i=>i.data).sort(); const ent=novos.filter(i=>i.valor>0).reduce((s,i)=>s+i.valor,0), sai=novos.filter(i=>i.valor<0).reduce((s,i)=>s+i.valor,0);

        ${novos.length?`<span class="note2">Novos: entradas ${brl2(ent)} · saídas ${brl2(sai)}</span>`:""}
        ${saldo?`<span class="${Math.abs(prev-saldo.valor)<0.01?"":"late"}">Saldo do extrato em ${fmtD(saldo.data)}: ${brl2(saldo.valor)} · saldo no portal depois de importar: ${brl2(prev)} ${Math.abs(prev-saldo.valor)<0.01?"✓ confere":"— não confere, avise antes de importar"}</span>`:""}
        ${novos.length?`<div><button class="btn primary" id="ofxOk">Importar ${novos.length} lançamento(s)</button></div>`:`<span>Nada novo para importar ✓</span>`}</div>`;
      const ok=$("#ofxOk"); if (ok) ok.onclick = async () => { ok.disabled=true; ok.textContent="Importando…"; let n=0;

const vencDe = (c, mes) => { const a=+mes.slice(0,4), m=+mes.slice(5,7)-1; return `${mes.slice(0,7)}-${String(Math.min(c.dia, ultDia(a,m))).padStart(2,"0")}`; };
const addDias = (d, n) => new Date(new Date(d+"T12:00:00").getTime()+n*864e5).toISOString().slice(0,10);
const mesMais = (mes, n) => { const d=new Date(+mes.slice(0,4), +mes.slice(5,7)-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; };
function agendaContas(){
  const hj=hoje(), m0=hj.slice(0,7)+"-01", out=[], usados=new Set(F.baixas.filter(b=>b.transacao).map(b=>b.transacao));
  for (const c of F.contas) { if (!c.ativo) continue;
    for (let i=-3;i<=2;i++) { const mes=mesMais(m0,i); if (mes < c.inicio.slice(0,7)+"-01" || (c.fim && mes > c.fim)) continue;
      const venc=vencDe(c, mes), b=F.baixas.find(x=>x.conta===c.id && x.mes===mes); let st, tx=null;
      if (b) { st="paga"; tx=b.transacao; }
      else { // procura um pagamento já classificado que pareça ser esta conta
        const p=F.partes.find(p=>{ const t=F.txm.get(p.transacao); if (!t || usados.has(t.id) || t.valor>=0 || p.categoria!==c.categoria) return false;
          if (c.pessoa && p.socio!==c.pessoa && p.pessoal!==c.pessoa) return false; return t.data>=addDias(venc,-25) && t.data<=addDias(venc,20); });

/* ---------- orçado × realizado e projeção do caixa ---------- */
const TIPOS_ORC = [["receita","Receitas"],["imposto","Impostos sobre a receita"],["custo","Custos (comissões, cartório)"],["despesa","Despesas"],["financiamento","Empréstimos"],["particular","Particular dos sócios"]];
const sinalCat = c => (c.tipo==="receita" || ["Rendimentos de Aplicações","Recebimento de Empréstimo","Aportes/Devoluções Sócios"].includes(c.nome)) ? 1 : -1;
const orcV = (cat, mes) => F.orcm.get(cat+"|"+mes);
function realComp(){ const R=new Map(); F.partes.forEach(p=>{ if (!p.categoria || !p.competencia) return; const k=p.categoria+"|"+p.competencia.slice(0,7)+"-01"; R.set(k,(R.get(k)||0)+p.valor); }); return R; }
function realCaixa(){ const R=new Map(); F.partes.forEach(p=>{ const t=F.txm.get(p.transacao); if (!t || !p.categoria) return; const k=p.categoria+"|"+t.data.slice(0,7)+"-01"; R.set(k,(R.get(k)||0)+p.valor); }); return R; }
const mediana = a => { const s=a.slice().sort((x,y)=>x-y), n=s.length; return !n ? 0 : n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; };
function baseHist(){
  const m0=hoje().slice(0,7)+"-01", RC=realComp(), RX=realCaixa(), ult=k=>Array.from({length:k},(_,i)=>mesMais(m0,-(i+1)));
  const med3 = cat => r2(mediana(ult(3).map(m=>RC.get(cat+"|"+m)||0)));
  const med6x = cat => r2(ult(6).reduce((a,m)=>a+(RX.get(cat+"|"+m)||0),0)/6);
  const tot6 = tipos => F.cats.filter(c=>tipos.includes(tipoDRE({categoria:c.nome}))).reduce((a,c)=>a+med6x(c.nome)*6,0);
  const rec6=tot6(["receita"]), var6=tot6(["imposto","custo"]);
  return {m0, RC, RX, med3, med6x, recMed:r2(rec6/6), pVar: rec6>0 ? Math.min(0.95, -var6/rec6) : 0};
}
function projecao(meses){
  const H=baseHist(), hj=hoje(); let saldo=saldoAte("todas", hj); const L=[];
  for (let i=0;i<meses;i++) { const mes=mesMais(H.m0,i), o={mes, est:[]};
    const temOrc = tipo => F.cats.some(c=>c.tipo===tipo && orcV(c.nome,mes)!=null);
    const somaOrc = tipo => F.cats.filter(c=>c.tipo===tipo).reduce((a,c)=>a+(orcV(c.nome,mes)||0),0);
    o.ent = temOrc("receita") ? somaOrc("receita") : (o.est.push("ent"), H.recMed);
    o.var = (temOrc("imposto")||temOrc("custo")) ? somaOrc("imposto")+somaOrc("custo") : (o.est.push("var"), -r2(o.ent*H.pVar));
    o.fix=0; o.out=0;
    for (const c of F.cats) { if (!["despesa","financiamento","particular"].includes(c.tipo) || c.nome==="Rendimentos de Aplicações") continue;
      const ov=orcV(c.nome,mes); let v;
      if (ov!=null) v=ov; else if (c.fixa) { v=H.med3(c.nome); if (v) o.est.push("fix"); } else if (c.tipo==="despesa") { v=H.med6x(c.nome); if (v) o.est.push("out"); } else v=0;
      if (c.fixa) o.fix+=v; else o.out+=v; }
    o.fix=r2(o.fix); o.out=r2(o.out);
    o.saldoIni = saldo;
    if (i===0) { // mês corrente: só o que ainda falta acontecer
      let e=0, s=0; F.tx.forEach(t=>{ if (t.data.slice(0,7)!==mes.slice(0,7) || t.data>hj) return; (F.ptx.get(t.id)||[]).forEach(p=>{ const k=tipoDRE(p); if (k==="receita") e+=p.valor; else if (!["transito","sem","rend","investimento"].includes(k)) s+=p.valor; }); });
      o.jaEnt=r2(e); o.jaSai=r2(s);
      const falE=Math.max(0,o.ent-e), totS=o.var+o.fix+o.out, falS=Math.min(0,totS-s);
      o.mov = r2(falE+falS);
    } else o.mov = r2(o.ent+o.var+o.fix+o.out);
    saldo = r2(saldo+o.mov); o.saldoFim=saldo; L.push(o); }
  return {L, H};
}
function fOrcamento(){
  if (F.orcEd) return fOrcEditar();
  const c=$("#fCorpo"), A=F.ano, hjm=+hoje().slice(5,7), RC=realComp();

  const lin=[]; let totO={}, totR={};

        <td class="num ${temO(x.nome)&&Math.abs(dif)>=1?(bom?"pos":"neg"):""}">${temO(x.nome)?(dif>=0?"+":"−")+nf(Math.abs(dif)):"–"}</td><td class="num">${temO(x.nome)&&ov?pct(rv/ov):"–"}</td></tr>`); }
    totO[tipo]=o; totR[tipo]=r; const dif=r2(r-o);
    lin.push(`<tr class="sub"><td>${rot}</td><td class="num">${o?nf(Math.abs(o)):"–"}</td><td class="num">${nf(Math.abs(r))}</td><td class="num ${o&&Math.abs(dif)>=1?(dif>=0?"pos":"neg"):""}">${o?(dif>=0?"+":"−")+nf(Math.abs(dif)):"–"}</td><td class="num">${o?pct(r/o):"–"}</td></tr>`, ...rows);
  }
  const resO=["receita","imposto","custo","despesa"].reduce((a,t)=>a+(totO[t]||0),0), resR=["receita","imposto","custo","despesa"].reduce((a,t)=>a+(totR[t]||0),0);
  lin.push(`<tr class="res"><td>= Resultado (receitas − impostos − custos − despesas)</td><td class="num ${sinal(resO)}">${nf(resO)}</td><td class="num ${sinal(resR)}">${nf(resR)}</td><td class="num ${sinal(resR-resO)}">${(resR-resO>=0?"+":"−")+nf(Math.abs(resR-resO))}</td><td></td></tr>`);
  const semOrcRec = !F.cats.some(x=>x.tipo==="receita" && F.orc.some(o=>o.categoria===x.nome));
  c.innerHTML = `<div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap">${chipsAno()}<button class="btn sm primary" id="oEd">Editar orçamento ${A}</button></div>

function ctrAlertas(c){

  if (c.status==="enviado") { const d=diasAte(c.emitido_em); if (d!=null&&d<-7) a.push(`<span class="qd late">sem assinatura há ${-d} dias</span>`); }

  if (!S.socio) return "";
  const P = (Q.props||[]), noPer = P.filter(p=>(p.enviada_em||p.criado_em)>=ini);
  const env = noPer.filter(p=>p.status!=="rascunho"), ac = noPer.filter(p=>p.status==="aceita"), rc = noPer.filter(p=>p.status==="recusada");
  const taxa = ac.length+rc.length ? ac.length/(ac.length+rc.length) : null;
  const somaP = a => a.reduce((s,p)=>s+(+p.valor_por||0),0);
  const resp = ac.concat(rc).filter(p=>p.enviada_em&&p.respondida_em).map(p=>dias(p.enviada_em,p.respondida_em));
  const descM = env.length ? env.reduce((s,p)=>s+(+p.desconto_pct||0),0)/env.length : null;
  const abertas = P.filter(p=>p.status==="enviada").sort((a,b)=>(a.enviada_em||"").localeCompare(b.enviada_em||""));
  const rasc = P.filter(p=>p.status==="rascunho");
  return `<div class="card stack"><h3 style="font-size:1.02rem;margin:0">Propostas <span class="note2" style="font-weight:400">— montadas no site, pelo assistente ou registradas</span></h3>
    <div class="kpis">
      <div class="kpi"><span class="l">Propostas enviadas</span><span class="v">${env.length}</span></div>
      <div class="kpi"><span class="l">Valor proposto</span><span class="v">${brl0(somaP(env))}</span></div>
      <div class="kpi bom"><span class="l">Aceitas</span><span class="v">${ac.length} · ${brl0(somaP(ac))}</span></div>
      <div class="kpi ${taxa!=null&&taxa<0.3?"ruim":""}"><span class="l">Taxa de aceite (aceitas ÷ respondidas)</span><span class="v">${pct(taxa)}</span></div>
      <div class="kpi"><span class="l">Tempo médio até a resposta</span><span class="v">${resp.length?Math.round(media(resp))+" dias":"–"}</span></div>
      <div class="kpi"><span class="l">Desconto médio concedido</span><span class="v">${descM==null?"–":Math.round(descM)+"%"}</span></div>
      <div class="kpi ${abertas.length?"":""}"><span class="l">Aguardando resposta agora</span><span class="v">${abertas.length} · ${brl0(somaP(abertas))}</span></div>
      <div class="kpi"><span class="l">Rascunhos não enviados</span><span class="v">${rasc.length}</span></div></div>
    ${abertas.length||rasc.length?`<div class="tablewrap"><table><thead><tr><th>Proposta</th><th>Situação</th><th class="num">Valor</th><th class="num">Dias</th></tr></thead><tbody>
      ${abertas.concat(rasc).map(p=>`<tr class="clk" data-kprop="${p.id}" tabindex="0" role="button"><td style="white-space:normal"><b>Nº ${p.numero} · ${esc(p.cliente)}</b><br><span class="note2">${esc(p.titulo||"")}</span></td><td><span class="qd ${PSCLS[p.status]}">${PSTAT[p.status]}</span></td><td class="num">${brl0(p.valor_por)}</td><td class="num">${diasDesde(p.enviada_em||p.criado_em)}</td></tr>`).join("")}</tbody></table></div>
      <p class="note2" style="margin:0">Toque na proposta para mudar a situação ou mandar o lembrete no WhatsApp.</p>`:""}</div>`;
}

/* ---------- área do cliente (tudo o que ele tem) ---------- */
function acharCliente(k){ if (k.cliente) { const c=Q.clientes.find(x=>x.id===k.cliente); if (c) return c; }
  const pj = k.projeto && S.projetos.find(p=>p.id===k.projeto); if (pj && pj.cliente_id) { const c=Q.clientes.find(x=>x.id===pj.cliente_id); if (c) return c; }
  const t=nrm(k.titulo.split(/\s+[-–]\s+/)[0]); return Q.clientes.find(c=>nrm(c.nome)===t) || (t.length>5 ? Q.clientes.find(c=>nrm(c.nome).startsWith(t)||t.startsWith(nrm(c.nome))) : null) || null; }
async function dlgVisaoCliente(c, nomeAlt){
  const nm = c ? c.nome : nomeAlt, ch = nrm(nm), bate = s => { const x=nrm(s); return !!x && (x===ch || (ch.length>5 && (x.startsWith(ch) || ch.startsWith(x)))); };
  if (!IA.lista.length) { try { await iaCarregar(); } catch {} }
  const projs = S.projetos.filter(p => (c && p.cliente_id===c.id) || bate(p.cliente)).sort((a,b)=>(b.inicio||"").localeCompare(a.inicio||""));
  const cards = Q.cartoes.filter(k => (c && k.cliente===c.id) || projs.some(p=>p.id===k.projeto) || bate(k.titulo.split(/\s+[-–]\s+/)[0])).sort((a,b)=>b.criado_em.localeCompare(a.criado_em));
  const props = S.socio ? (Q.props||[]).filter(p=>cards.some(k=>k.id===p.cartao) || bate(p.cliente)) : [];
  const peds = IA.lista.filter(p=>(c && p.cliente_id===c.id) || bate(p.cliente));
  const ativos = projs.filter(p=>["planejado","andamento","pausado"].includes(p.status));
  const qn = id => (Q.quadros.find(q=>q.id===id)||{}).nome||"";
  abrirLargo(`<h3 style="margin:0">Área do cliente · ${esc(nm)}</h3>
    <p class="note2" style="margin:0">${c?`${(c.servicos||[]).map(esc).join(" · ")||"sem serviços marcados"} · ${esc(SIT[c.situacao]||c.situacao||"")}`:"Sem cadastro em Clientes ainda (ele é criado sozinho quando o negócio fecha)."}</p>
    <div class="kpis"><div class="kpi"><span class="l">Projetos ativos</span><span class="v">${ativos.length}</span></div><div class="kpi"><span class="l">Projetos no total</span><span class="v">${projs.length}</span></div>
      <div class="kpi"><span class="l">Cartões nos quadros</span><span class="v">${cards.length}</span></div>${S.socio?`<div class="kpi"><span class="l">Propostas</span><span class="v">${props.length}</span></div>`:""}<div class="kpi"><span class="l">Pedidos ao assistente</span><span class="v">${peds.length}</span></div></div>
    <div class="stack" style="gap:6px"><b>Projetos</b>${projs.length?projs.map(p=>`<button type="button" class="propRow" data-vp="${p.id}"><span><b>${esc(p.nome)}</b>${p.pro_bono?' <span class="qd ok">pró bono</span>':""}<br><span class="note2">${esc(SERV[p.servico]||p.servico||"")} · início ${fmtD(p.inicio)}${p.prazo?" · prazo "+fmtD(p.prazo):""}</span></span><span>${pct(progresso(p.id))} concluído</span><span class="st s-${p.status}">${STP[p.status]}</span></button>`).join(""):`<span class="note2">Nenhum projeto.</span>`}</div>
    <div class="stack" style="gap:6px"><b>Demandas nos quadros</b>${cards.length?cards.slice(0,30).map(k=>`<button type="button" class="propRow" data-vk="${k.id}"><span><b>${esc(k.titulo)}</b><br><span class="note2">${esc(qn(k.quadro))}${k.prazo?" · prazo "+fmtD(k.prazo):""}</span></span><span class="qd">${esc(colDe(k.coluna).nome||"")}</span></button>`).join(""):`<span class="note2">Nenhuma demanda.</span>`}</div>
    ${S.socio?`<div class="stack" style="gap:6px"><b>Propostas</b>${props.length?props.map(p=>`<button type="button" class="propRow" data-vpr="${p.id}"><span><b>Nº ${p.numero}</b> · ${fmtD(p.criado_em)}<br><span class="note2">${esc(p.titulo||"")}</span></span><span>por <b>${brl2(p.valor_por)}</b></span><span class="qd ${PSCLS[p.status]}">${PSTAT[p.status]}</span></button>`).join(""):`<span class="note2">Nenhuma proposta.</span>`}</div>`:""}
    <div class="stack" style="gap:6px"><b>Pedidos ao assistente</b>${peds.length?peds.map(p=>`<button type="button" class="propRow" data-vi="${p.id}"><span><b>#${p.numero}</b> · ${fmtD(p.criado_em)}<br><span class="note2">${esc(String(p.pedido||"").slice(0,110))}</span></span><span class="qd">${esc((IA_ST[p.status]||[p.status])[0])}</span></button>`).join(""):`<span class="note2">Nenhum pedido.</span>`}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap">${c?`<button type="button" class="btn sm" id="vcCad">Abrir cadastro</button>`:""}</div>`,
  async () => {});
  $("#dOk").hidden = true;
  const f=$("#dlgF"), fecha = fn => { $("#dlg").close(); setTimeout(fn, 60); };
  f.querySelectorAll("[data-vp]").forEach(b=>b.onclick=()=>fecha(()=>go("proj", b.dataset.vp)));
  f.querySelectorAll("[data-vk]").forEach(b=>b.onclick=()=>fecha(()=>dlgCartao(Q.cartoes.find(x=>x.id===b.dataset.vk))));
  f.querySelectorAll("[data-vpr]").forEach(b=>b.onclick=()=>fecha(()=>dlgVerProposta(Q.props.find(x=>x.id===b.dataset.vpr))));
  f.querySelectorAll("[data-vi]").forEach(b=>b.onclick=()=>fecha(()=>{ go("ia"); }));
  const cad=$("#vcCad"); if (cad) cad.onclick=()=>fecha(()=>dlgCliente(c));
}

/* ---------- pró bono ---------- */
function blocoProBono(ini){
  const pj = S.projetos.filter(p=>p.pro_bono && (p.inicio||"")>=ini.slice(0,10));
  const ks = Q.cartoes.filter(k=>k.pro_bono && !k.projeto && k.criado_em>=ini);
  const ref = pj.reduce((s,p)=>s+(+p.valor_ref||0),0) + ks.reduce((s,k)=>s+(Q.valores[k.id]||0),0);
  if (!pj.length && !ks.length) return `<div class="card stack"><h3 style="font-size:1.02rem;margin:0">Pró bono</h3><span class="note2">Nenhum atendimento pró bono no período. Marque “Pró bono” no projeto ou no cartão para medir aqui.</span></div>`;
  return `<div class="card stack"><h3 style="font-size:1.02rem;margin:0">Pró bono <span class="note2" style="font-weight:400">— atendimentos sem cobrança e o que receberam em troca</span></h3>
    <div class="kpis"><div class="kpi"><span class="l">Atendimentos pró bono</span><span class="v">${pj.length+ks.length}</span></div>${S.socio?`<div class="kpi"><span class="l">Valor de referência não cobrado</span><span class="v">${brl0(ref)}</span></div>`:""}
      <div class="kpi"><span class="l">Horas lançadas neles</span><span class="v">${n1(pj.reduce((s,p)=>s+tarefasDe(p.id).reduce((a,t)=>a+horasDe(t.id),0),0))} h</span></div></div>
    <div class="tablewrap"><table><thead><tr><th>Cliente / projeto</th><th>Motivo / contrapartida</th>${S.socio?`<th class="num">Referência</th>`:""}</tr></thead><tbody>
      ${pj.map(p=>`<tr class="clk" data-pbp="${p.id}" tabindex="0"><td style="white-space:normal"><b>${esc(p.nome)}</b></td><td style="white-space:normal">${esc(p.pro_bono_motivo||"—")}</td>${S.socio?`<td class="num">${brl0(p.valor_ref)}</td>`:""}</tr>`).join("")}
      ${ks.map(k=>`<tr class="clk" data-kcard="${k.id}" tabindex="0"><td style="white-space:normal"><b>${esc(k.titulo)}</b></td><td style="white-space:normal">${esc(k.pro_bono_motivo||"—")}</td>${S.socio?`<td class="num">${brl0(Q.valores[k.id]||0)}</td>`:""}</tr>`).join("")}</tbody></table></div></div>`;
}

function tempoReal(){
  try {
    const ch = sb.channel("vital-sync");
    ["proj_projetos","proj_tarefas","proj_horas","quad_cartoes","cad_clientes","ia_pedidos","com_propostas"].forEach(t => ch.on("postgres_changes", {event:"*", schema:"public", table:t}, sincronizarJa));
    ch.subscribe();
  } catch {}
  ["dlg","dlgS"].forEach(id => $("#"+id).addEventListener("close", () => { if (RT_PEND) sincronizarJa(); }));
  document.addEventListener("focusout", () => { if (RT_PEND) setTimeout(()=>{ if (RT_PEND) sincronizarJa(); }, 1500); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sincronizarJa(); });
}

/* ===== início ===== */
function semAcesso(msg, logado){ document.querySelectorAll(".view").forEach(v=>v.hidden = v.id!=="v-sem"); $("#v-sem").innerHTML = `<div class="card empty stack">${msg}<div><a class="btn primary" href="${logado?"/vitalagroenegocios/cliente/":"/vitalagroenegocios/cliente/?volta=/vitalagroenegocios/projetos/"}">${logado?"Voltar à Área restrita":"Entrar"}</a></div></div>`; }
async function boot(){
  abas();
  if (!sb) { semAcesso("Não foi possível conectar ao servidor."); return; }
  const {data:{session}} = await sb.auth.getSession();
  if (!session) { location.href = "/vitalagroenegocios/cliente/?volta=/vitalagroenegocios/projetos/"; return; }
  const {data:perfil} = await sb.from("perfis").select("papel, socio").eq("user_id", session.user.id).maybeSingle();
  if (!perfil || !["admin","equipe","cliente","gestor"].includes(perfil.papel)) { semAcesso("Esta área é para a equipe Vital e para os participantes convidados dos projetos.", true); return; }
  S.me = session.user.id; S.papel = perfil.papel; S.socio = perfil.papel==="admin" || (perfil.papel==="equipe" && !!perfil.socio); S.ext = ["cliente","gestor"].includes(perfil.papel); abas();
  try { await carregar(); } catch (x) { semAcesso("Não foi possível carregar os projetos: "+esc(x.message||x)); return; }
  tempoReal();
  try { localStorage.setItem("vital_user", JSON.stringify({n:nome(S.me)!=="–"?nome(S.me):"", p:S.papel})); } catch {}
  const h = location.hash.slice(1).split("/");
  if (h[0]==="proj" && h[1] && S.projetos.some(p=>p.id===h[1])) go("proj", h[1]);
  else if (S.ext && S.projetos.length===0) semAcesso("Você ainda não participa de nenhum projeto. Quando a Vital incluir você em um, ele aparece aqui.", true);
  else if ((S.ext ? ["lista","minhas"] : ["lista","ia","kpi","vsm","quadros","clientes","comercial"]).includes(h[0]) || (h[0]==="equipe" && S.papel==="admin") || ((h[0]==="financeiro"||h[0]==="leg"||h[0]==="contratos") && S.socio)) go(h[0]);
  else if (h[0]==="minhas" && !S.ext) location.replace("/vitalagroenegocios/quadro/");
  else go("lista");
}
boot();
})();
</script>
