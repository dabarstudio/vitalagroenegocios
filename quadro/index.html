<style>
/* Layout: mesma barra da Área do cliente; coluna principal com semáforo + última versão, depois a atualização e os apontamentos; histórico no fim */
:root{
  color-scheme:light;
  --bg:#F3F6F1; --surface:#FFFFFF; --surface-2:#E8EFE4; --line:#D3DECD;
  --fg:#18241B; --muted:#57665A; --brand:#00582F; --brand-2:#007941; --leaf:#79C25B; --on-brand:#FFFFFF;
  --warn:#9A6200; --warn-bg:#FFF3D6; --bad:#B3261E; --bad-bg:#FBE4E1; --ok:#1F7A3F; --ok-bg:#E1F2E5; --info:#2F6FA6; --info-bg:#E3EDF6;
  --lamp-off:#C9D3C6; --red:#D93A2B; --green:#2FA352;
  --display:"Poppins","Segoe UI",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:ui-monospace,Consolas,monospace; --r:12px;
}
@media (prefers-color-scheme: dark) and (max-width: 0px){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#17221A; --surface-2:#1F2D23; --line:#2E4034; --fg:#E6EEE7; --muted:#9DB0A2;
  --brand:#5FBF7F; --brand-2:#79C25B; --on-brand:#0B1A10; --warn:#F2C062; --warn-bg:#3A2E12; --bad:#F2A097; --bad-bg:#3D1C19; --ok:#7FD39A; --ok-bg:#163522; --info:#8DB9E3; --info-bg:#1B2A38;
  --lamp-off:#2E4034; --red:#F0604F; --green:#4CC66F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17221A; --surface-2:#1F2D23; --line:#2E4034; --fg:#E6EEE7; --muted:#9DB0A2;
  --brand:#5FBF7F; --brand-2:#79C25B; --on-brand:#0B1A10; --warn:#F2C062; --warn-bg:#3A2E12; --bad:#F2A097; --bad-bg:#3D1C19; --ok:#7FD39A; --ok-bg:#163522; --info:#8DB9E3; --info-bg:#1B2A38;
  --lamp-off:#2E4034; --red:#F0604F; --green:#4CC66F; color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.wrap{max-width:none;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:44px;height:44px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;border:1px solid var(--line);text-decoration:none}
.logo img{width:36px}
.brandtxt{min-width:0}
.clilogo{height:44px;width:auto;border-radius:8px;border:1px solid var(--line);background:#fff;padding:2px;flex:none}
.anx{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.anx .a{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);overflow:hidden;min-height:84px;display:flex;flex-direction:column}
.anx .a a{color:inherit;text-decoration:none;display:flex;flex-direction:column;flex:1}
.anx .a img{width:100%;height:76px;object-fit:cover;display:block;background:#fff}
.anx .a .ic{height:76px;display:grid;place-items:center;font-size:1.8rem}
.anx .a small{display:block;padding:4px 6px;font-size:.72rem;line-height:1.2;word-break:break-all;color:var(--muted)}
.anx .a .x{position:absolute;top:3px;right:3px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:7px;font-size:.72rem;padding:1px 6px;cursor:pointer}
.anxbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.anxdrop{outline:2px dashed var(--brand);outline-offset:4px;border-radius:10px}
.brandtxt b{font-family:var(--display);display:block;color:var(--brand)}
.brandtxt span{font-size:.8rem;color:var(--muted)}
.spacer{flex:1}
.top a.tab{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap;text-decoration:none}
.top a.tab:hover{background:var(--surface-2);color:var(--brand)}
main{padding-block:20px 48px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.stack{display:grid;gap:14px;align-content:start}
.muted,.note{color:var(--muted)} .note{font-size:.88rem;margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;color:var(--fg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand)}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.92rem}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.callout{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;font-size:.93rem}
.err{color:var(--bad);font-weight:600}
.sino{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:1.05rem;cursor:pointer;color:inherit}
.sino .bdg{position:absolute;top:-6px;right:-6px;background:#d9342b;color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.painelN{position:fixed;top:64px;right:12px;width:min(420px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.22);z-index:30;padding:8px}
.painelN .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.painelN .it{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:9px 8px;border-radius:10px;cursor:pointer}
.painelN .it:hover{background:var(--surface-2)}
.painelN a.it{text-decoration:none}
.painelN .it.nova{background:rgba(31,107,58,.08)}
.painelN .it b{font-weight:700}
.painelN .it small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.painelN .it q{display:block;color:var(--muted);font-size:.85rem;quotes:none;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px;padding:0}
.placar>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;font-family:var(--display);font-weight:700;color:var(--brand)}
.placar>summary::-webkit-details-marker{display:none}
.placar>summary .ab{margin-left:auto;font-family:inherit;font-weight:400;font-size:.82rem;color:var(--muted)}
.placar[open]>summary .ab::after{content:" ▲"} .placar:not([open])>summary .ab::after{content:" ▼"}
.plc{padding:0 14px 14px;display:grid;gap:12px}
.plt{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.termo{flex:1;min-width:240px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.termo b{font-size:1.05rem}
.termo .barra{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.termo .barra i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.pp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;background:var(--surface)}
.pp .hd{display:flex;align-items:center;gap:8px;justify-content:flex-start}
.pp .hd b{font-size:.98rem}
.pp .hd .av{margin-left:0}
.pp .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:.78rem;color:var(--muted)}
.pp .nums strong{font-size:1.25rem;color:var(--fg);display:block;line-height:1.1}
.pp .bdgs{display:flex;gap:6px;flex-wrap:wrap}
.pp .bdgs span{font-size:.76rem;background:var(--ok-bg);color:var(--ok);border-radius:99px;padding:2px 8px;font-weight:600}
.pp .bdgs span.al,.pp .bdgs .al{background:var(--warn-bg);color:var(--warn)}
.pp .pn{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:8px}
.pp .pn:hover strong,.pp .pn:focus-visible strong{text-decoration:underline}
.pp .bdgs .pn{font-size:.76rem;border-radius:99px;padding:2px 8px;font-weight:600}
.pp .mini{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pp .mini i{display:block;height:100%;background:var(--brand-2)}
.ticker{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:.86rem;overflow:hidden}
.ticker .lb{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;font-weight:700;color:var(--brand);border-right:1px solid var(--line);background:var(--surface)}
.ticker .vp{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker .tr{display:inline-flex;gap:28px;white-space:nowrap;padding:6px 0;animation:tick var(--dur,120s) linear infinite;will-change:transform}
.ticker:hover .tr,.ticker:focus-within .tr{animation-play-state:paused}
.ticker a{color:inherit;text-decoration:none}
.ticker a:hover,.ticker a:focus-visible{text-decoration:underline}
.ticker .ct b{font-weight:700}
.ticker .up{color:var(--ok);font-weight:700}.ticker .dn{color:var(--bad);font-weight:700}
.ticker .fn{color:var(--muted)}
.ticker .mais{flex:none;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--brand);font:inherit;font-weight:700;padding:0 12px;cursor:pointer}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .tr{animation:none}.ticker .vp{overflow-x:auto}}
@media (max-width:640px){.ticker .lb span{display:none}}
html,body{max-width:100%;overflow-x:hidden}
#app>*{min-width:0;max-width:100%}
.bar,.board,.placar{min-width:0;max-width:100%}
.ctl{display:contents}
.kpi .sh{display:none}
#selQ{max-width:min(380px,40vw);min-width:0;text-overflow:ellipsis}
.top .brandtxt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.top .brandtxt span{white-space:nowrap}
@media (max-width:640px){
  .kpi .lg{display:none}.kpi .sh{display:inline}
  .top .brandtxt{display:none}
  .top .tab{margin-left:auto}
  .ctl{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .ctl::-webkit-scrollbar{display:none}
  .ctl>*{flex:0 0 auto}
  .ctl .chips{display:flex;flex-wrap:nowrap;gap:6px}
  .ctl .fsel{flex:0 0 auto!important;max-width:200px}
  .board{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:86%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;-webkit-overflow-scrolling:touch}
  .board .col{scroll-snap-align:start;max-height:none}
  html dialog{width:100vw!important;max-width:100vw!important;height:100dvh;max-height:100dvh!important;margin:0!important;border-radius:0!important;border:0!important;inset:0}
  .bar .spacer{display:none}
  #kSt{font-size:.7rem!important;max-width:24%!important}
  .dlg{max-height:100dvh;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
  .placar>summary{padding:10px 12px}
  .plc{padding:0 10px 10px}
  .pls{grid-template-columns:minmax(0,1fr)}
  .top .wrap{flex-wrap:wrap;gap:8px;padding-block:8px}
  .top .logo{width:36px;height:36px}.top .logo img{width:28px}
  .clilogo{height:36px}
  .top .spacer{display:none}
  #selQ{order:9;flex:1 1 100%;width:100%;max-width:none}
  .top .tab{font-size:.82rem;padding:6px 8px}
  .sino{padding:6px 8px}
  .bar{gap:8px}
  .bar .kpis{width:100%;display:flex;gap:6px;flex-wrap:nowrap}
  .bar .kpi{flex:1;padding:6px 8px;font-size:.8rem}
  #busca{flex:1 1 100%;width:100%}
}
.convite{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.convite span{flex:1 1 100%;font-weight:600}
.rodape{position:fixed;left:0;right:0;bottom:0;z-index:25;text-align:center;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));font-size:.78rem;color:var(--muted);background:var(--surface);border-top:1px solid var(--line)}
body{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(52px + env(safe-area-inset-bottom,0px))!important}
.convite{bottom:calc(52px + env(safe-area-inset-bottom,0px))!important}
.rodape a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.rodape a:hover{color:var(--brand)}
.rodape img{width:20px;height:20px;border-radius:6px;background:#fff;border:1px solid var(--line)}
.rodape b{color:var(--brand);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.mono{font-family:var(--mono);font-size:.85em;white-space:nowrap}

/* ===== semáforo ===== */
.topo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.topo{grid-template-columns:minmax(0,1fr)}}
.sem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.poste{background:#1E2A22;border-radius:18px;padding:10px;display:grid;gap:10px;width:62px}
.lamp{width:42px;height:42px;border-radius:50%;background:var(--lamp-off);opacity:.35;transition:opacity .2s,box-shadow .2s}
.lamp.r.on{background:var(--red);opacity:1;box-shadow:0 0 18px var(--red)}
.lamp.g.on{background:var(--green);opacity:1;box-shadow:0 0 18px var(--green)}
.sem h2{font-size:1.25rem}
.sem .q{color:var(--muted);font-size:.95rem}
.ver b{font-family:var(--display)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.93rem}
.kv span:nth-child(odd){color:var(--muted)}

/* ===== etapas da atualização ===== */

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:200px;flex:1;max-width:340px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.kpi b{font:700 1.05rem var(--display);color:var(--fg);margin-right:4px}
.kpi.bad b{color:var(--bad)}
button.kpi{font:inherit;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
button.kpi:hover{border-color:var(--brand-2)}
button.kpi[aria-pressed="true"]{border-color:var(--brand);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--brand)}
.board{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col.drop{outline:2px dashed var(--brand-2);outline-offset:-2px}
.fsel{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--surface);color:inherit;font:inherit;font-size:.86rem;max-width:230px}
.col.ref{background:rgba(201,167,74,.13);border:1px dashed rgba(201,167,74,.6)}
.col.ref .colh h2::after{content:" · fixas";font-weight:400;font-size:.78rem;color:var(--muted)}
.col.ref .k{border-left:3px solid #c9a74a}
.colh{display:flex;align-items:center;gap:8px;padding:2px 4px}
.colh h2{font-size:.95rem;flex:1}
.colh .n{font-size:.8rem;color:var(--muted);font-weight:700;background:var(--surface);border-radius:999px;padding:1px 8px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:6px;text-align:left;width:100%}
.k:hover{border-color:var(--brand-2)}
.k.drag{opacity:.4}
.k .t{font-weight:600;line-height:1.3}
.k .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-weight:700;font-size:.74rem;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.atr{background:var(--bad-bg);color:var(--bad)} .pill.prox{background:var(--warn-bg);color:var(--warn)} .pill.okp{background:var(--ok-bg);color:var(--ok)}
.pill.alta{background:var(--bad-bg);color:var(--bad)} .pill.media{background:var(--warn-bg);color:var(--warn)} .pill.baixa{background:var(--info-bg);color:var(--info)}
.av{width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:inline-grid;place-items:center;font:700 .66rem var(--display);margin-left:auto}
.add{border:1px dashed var(--line);background:none;border-radius:10px;padding:8px;color:var(--muted);font-weight:600;cursor:pointer;text-align:left}
.add:hover{color:var(--brand);border-color:var(--brand-2)}
.addf{display:grid;gap:6px}
.addf textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);resize:vertical;min-height:52px}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,20,14,.45)}
#dlgA{width:min(460px,calc(100vw - 24px))!important;height:auto!important}

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);

const hojeISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

    const d = $("#dlgM");

      ${ehIOS() ? `<ol style="margin:0;padding-left:1.2em;line-height:1.7"><li>Abra este quadro no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (o quadrado com a seta para cima ⬆️).</li><li>Role e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>. Pronto: o ícone ${esc(S.marcaNome ? "da " + S.marcaNome : "do quadro")} aparece na tela.</li></ol>`
      : `<ol style="margin:0;padding-left:1.2em;line-height:1.7"><li>Abra este quadro no <b>Chrome</b>.</li><li>Toque nos <b>três pontinhos ⋮</b> no canto de cima.</li><li>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Confirme. Pronto: o ícone ${esc(S.marcaNome ? "da " + S.marcaNome : "do quadro")} aparece na tela.</li></ol>`}
      <p class="note" style="margin:0">O app abre direto no quadro, em tela cheia, e continua recebendo as atualizações sozinho.</p>
    </form>`;
    d.showModal();
  };
}
const VAPID = "BDp7aYHipI_aIhW75Jk6cKNL-UOwoXD4m8-Z7kM9DQ3Ot-J_FAxSuy6MdkwFZg2_AXJ8HvFDueevfhmN3iR5Z70";
const pushOk = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64u = (s) => { const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); };
async function inscricaoAtual() { try { if (!pushOk()) return null; const reg = await navigator.serviceWorker.getRegistration(); return reg ? await reg.pushManager.getSubscription() : null; } catch { return null; } }
async function ativarPush() {
  if (!pushOk()) { toast(ehIOS() && !ehApp() ? "No iPhone, primeiro salve o quadro na tela de início (botão 📲) e abra por lá." : "Este navegador não aceita avisos. Use o Chrome ou instale o app."); return false; }
  try {
    const reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Os avisos foram bloqueados. Libere nas configurações do celular para este app."); return false; }
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
    const j = sub.toJSON();
    const { error } = await sb.from("push_inscricoes").upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_id: S.user.id, aparelho: navigator.userAgent.slice(0, 160) }, { onConflict: "endpoint" });
    if (error) { toast("Não consegui ativar os avisos: " + error.message); return false; }
    toast("🔔 Avisos ativados neste aparelho."); try { localStorage.setItem("cq.push", "1"); } catch {} return true;
  } catch (e) { toast("Não consegui ativar os avisos: " + (e.message || e)); return false; }
}
async function desativarPush() {
  const sub = await inscricaoAtual(); if (!sub) return;
  await sb.from("push_inscricoes").delete().eq("endpoint", sub.endpoint);
  try { await sub.unsubscribe(); } catch {}
  toast("Avisos desativados neste aparelho.");
}
async function convitePush() {
  if (!pushOk() || !ehApp()) return;
  if (Notification.permission === "denied") return;
  const sub = await inscricaoAtual(); if (sub && Notification.permission === "granted") return;
  try { if (localStorage.getItem("cq.pushNao") === "1") return; } catch {}
  const bar = document.createElement("div");
  bar.className = "convite";
  bar.innerHTML = `<span>🔔 Receber avisos das tarefas neste celular?</span><button class="btn primary sm" type="button">Ativar</button><button class="btn ghost sm" type="button">Agora não</button>`;
  document.body.appendChild(bar);
  const [sim, nao] = bar.querySelectorAll("button");
  sim.onclick = async () => { if (await ativarPush()) bar.remove(); };
  nao.onclick = () => { try { localStorage.setItem("cq.pushNao", "1"); } catch {} bar.remove(); };
}
function abrirPorUrl(u) {
  try { const x = new URL(u, location.href); const c = x.searchParams.get("card"); if (c) irParaNotif({ cartao: c, id: Number(x.searchParams.get("n")) || 0, lida: !x.searchParams.get("n") }); } catch {}
}
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.abrir) abrirPorUrl(e.data.abrir); });
const VERSAO = "__VERSAO__";
async function checarVersao() {

    const t = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(r => r.text());
    const m = t.match(/const VERSAO = "([^"]+)"/);

    const ocupado = () => $("#dlg").open || document.querySelector(".addf") || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if (!ocupado()) { location.reload(); return; }

    const t2 = setInterval(() => { if (!ocupado()) { clearInterval(t2); location.reload(); } }, 3000);
  } catch {}
}
setInterval(checarVersao, 120000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checarVersao(); });
try { S.ordem = localStorage.getItem("cq.ordem") || ""; } catch { S.ordem = ""; }
const LOGOS = { "Agro TNZ": "../clientes/agro-tnz.png" };
const MARCAS = { "Agro TNZ": { titulo: "Agro TNZ", manifest: "manifest-agro-tnz.webmanifest", apple: "tnz-180.png", cor: "#1071B9" } };
function aplicarMarca(emp) {
  const m = MARCAS[emp]; if (!m || S.marcaAtual === emp) return; S.marcaAtual = emp; S.marcaNome = m.titulo;
  const set = (id, attr, v) => { const e = document.getElementById(id); if (e) e.setAttribute(attr, v); };
  set("lnkMan", "href", m.manifest); set("lnkApple", "href", m.apple); set("mtApp", "content", m.titulo); document.querySelectorAll('meta[name="theme-color"]').forEach(e => e.setAttribute("content", m.cor));
}
const PRI = { alta: "Alta", media: "Média", baixa: "Baixa" };

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = "/vitalagroenegocios/cliente/?volta=/vitalagroenegocios/quadro/"; return; }
  S.user = session.user;
  const { data: perfil } = await sb.from("perfis").select("papel, nome").eq("user_id", S.user.id).maybeSingle();
  S.perfil = perfil || { papel: "", nome: S.user.email };
  S.time = ["admin", "equipe"].includes(S.perfil.papel);
  const { data: qs0, error } = await sb.from("cq_quadros").select("*").order("empresa").order("nome");
  const qs = (qs0 || []).filter(q => !q.wl_escritorio || q.empresa === "Vital Agro & Negócios");
  if (error) return falha("Não foi possível abrir o quadro: " + error.message);
  S.quadros = qs || [];
  const { data: mm } = await sb.from("cq_membros").select("quadro").eq("user_id", S.user.id);
  const meus = new Set((mm || []).map(x => x.quadro));
  S.proprios = S.time ? S.quadros : S.quadros.filter(q => meus.has(q.id));
  S.outros = S.quadros.filter(q => !S.proprios.includes(q));
  if (!S.proprios.length && !S.outros.length) return falha("Você ainda não participa de nenhum quadro. Fale com a Vital.");
  let salvo = new URLSearchParams(location.search).get("q"); if (!salvo) try { salvo = localStorage.getItem("cq.q"); } catch {}
  S.marc = salvo === MARC && S.outros.length > 0 || !S.proprios.length;
  S.q = S.marc ? null : (S.proprios.find(q => q.id === salvo) || (S.time && S.proprios.find(q => q.geral && q.empresa === "Vital Agro & Negócios")) || S.proprios[0]);
  const sel = $("#selQ");
  const opts = S.proprios.map(q => [q.id, (S.time ? q.empresa + " · " : "") + q.nome]);
  if (S.outros.length) opts.push([MARC, `📌 Marcadas para mim`]);
  if (opts.length > 1 || S.time) {
    sel.hidden = false;
    const opt = (v, t) => `<option value="${v}"${(S.marc ? v === MARC : S.q && v === S.q.id) ? " selected" : ""}>${esc(t)}</option>`;
    if (S.time) {
      const emps = [...new Set(S.proprios.map(q => q.empresa))].sort((a, b) => a.localeCompare(b));
      sel.innerHTML = emps.map(e => `<optgroup label="${esc(e)}">${S.proprios.filter(q => q.empresa === e).sort((a, b) => (b.geral - a.geral) || a.nome.localeCompare(b.nome)).map(q => opt(q.id, q.nome.replace(" · " + e, ""))).join("")}</optgroup>`).join("") + (S.outros.length ? opt(MARC, "📌 Marcadas para mim") : "") + `<option value="__liberar">＋ Liberar Kanban para um cliente…</option>`;
    } else sel.innerHTML = opts.map(([v, t]) => opt(v, t)).join("");
    sel.onchange = () => { if (sel.value === "__liberar") { sel.value = S.marc ? MARC : (S.q ? S.q.id : ""); liberarKanban(); return; } S.marc = sel.value === MARC; S.q = S.marc ? null : S.proprios.find(q => q.id === sel.value); try { localStorage.setItem("cq.q", sel.value); } catch {} S.filtro = "todas"; S.fCriado = ""; S.fAtrib = ""; carregar(); };
  }

  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("#dlg").open) carregar(true); });
}
async function liberarKanban() {
  const { data } = await sb.rpc("cq_clientes_sem_kanban");
  const L = data || [];
  const d = $("#dlgM");
  d.innerHTML = `<form method="dialog" class="dlg" style="grid-template-columns:minmax(0,1fr);max-width:480px;gap:12px">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:1.1rem;margin:0">＋ Liberar Kanban</h2><button class="btn ghost sm" value="x" aria-label="Fechar">✕</button></div>
    <p class="note" style="margin:0">Cria o quadro geral do cliente (Atribuições, A fazer, Fazendo, Aguardando alguém, Concluído) com você e a equipe Vital. Quem tiver acesso ao portal desse cliente entra sozinho e ganha o quadro com o próprio nome.</p>
    <div class="field"><label for="lbC">Cliente</label><select id="lbC"><option value="">Escolha…</option>${L.map(x => `<option value="${esc(x.empresa)}">${esc(x.empresa)}${x.origem === "portal" ? " · tem acesso ao portal" : ""}</option>`).join("")}<option value="__outro">Outro nome…</option></select></div>
    <div class="field" id="lbOF" hidden><label for="lbO">Nome do cliente</label><input id="lbO" type="text" placeholder="Igual ao nome usado no acesso do portal"></div>
    <div class="field"><label for="lbS">Letreiro (setor do cliente)</label><select id="lbS">${Object.entries(SEG_NOME).map(([k, v]) => `<option value="${k}"${k === "geral" ? " selected" : ""}>${esc(v)}</option>`).join("")}</select></div>
    <p class="err" id="lbE" hidden></p>
    <div class="row"><button class="btn primary" type="button" id="lbOk">Liberar</button><button class="btn ghost" value="x">Cancelar</button></div>
  </form>`;
  d.showModal();
  $("#lbC", d).onchange = (e) => { $("#lbOF", d).hidden = e.target.value !== "__outro"; };
  $("#lbOk", d).onclick = async () => {
    let emp = $("#lbC", d).value; if (emp === "__outro") emp = $("#lbO", d).value.trim();
    if (!emp) { const e = $("#lbE", d); e.textContent = "Escolha o cliente."; e.hidden = false; return; }
    $("#lbOk", d).disabled = true;

    toast("Kanban liberado para " + emp + ".");

  };

async function carregar(silencioso) {
  let c, k, m;
  if (S.marc) {
    const ids = S.outros.map(q => q.id);
    $("#tQ").textContent = "Marcadas para mim"; $("#tE").textContent = "Tarefas de outros quadros em que você foi marcado(a)"; document.title = "Marcadas para mim · Vital";
    [c, k] = await Promise.all([sb.from("cq_colunas").select("*").in("quadro", ids).order("ordem"), sb.from("cq_cartoes").select("*").in("quadro", ids).eq("arquivado", false).or(`responsavel.eq.${S.user.id},participantes.cs.{${S.user.id}}`).order("ordem")]);
    m = { data: [] };

      sb.from("cq_colunas").select("*").eq("quadro", Q).order("ordem"),
      sb.from("cq_cartoes").select("*").eq("quadro", Q).eq("arquivado", false).order("ordem"),
      sb.from("cq_membros").select("*").eq("quadro", Q).order("nome"),

    const url = mapa[a.caminho] || "#", img = /^image\//.test(a.tipo || "");
    const pode = S.time || a.user_id === S.user.id;
    return `<div class="a">${pode ? `<button class="x" type="button" data-ax="${a.id}" aria-label="Apagar ${esc(a.nome)}">✕</button>` : ""}<a href="${esc(url)}" target="_blank" rel="noopener" title="${esc(a.nome)} · ${esc(a.autor || "")} · ${dataHora(a.em)}">${img ? `<img src="${esc(url)}" alt="${esc(a.nome)}" loading="lazy">` : `<span class="ic">${iconeDe(a.nome, a.tipo)}</span>`}<small>${esc(a.nome)}<br>${tamH(a.tamanho)}</small></a></div>`;
  }).join("");
  $$("[data-ax]", el).forEach(b => b.onclick = async () => {
    const a = lst.find(x => x.id === b.dataset.ax); if (!a) return;
    if (!confirmaApagar(a.nome)) return;
    const r1 = await sb.storage.from(BUCKET).remove([a.caminho]);
    if (r1.error) return toast("Não foi possível apagar: " + r1.error.message);
    const r2 = await sb.from("cq_anexos").delete().eq("id", a.id);
    if (r2.error) return toast("Não foi possível apagar: " + r2.error.message);
    await evento("apagou anexo", a.nome, k.id, k.quadro); await carregarAnx(k); carregarHist(k.id); render();
  });
}
function confirmaApagar(nome) { return window.__semConfirm ? true : confirm(`Apagar o anexo "${nome}"?`); }
async function enviarAnx(k, f, print) {
  if (f.size > 10485760) return toast(`"${f.name}" passa de 10 MB.`);
  const agora = new Date(), z = (n) => String(n).padStart(2, "0");
  let nome = f.name || "arquivo";
  if (print || /^image\.(png|jpe?g)$/i.test(nome)) { const ext = (nome.split(".").pop() || "png").toLowerCase(); nome = `print-${agora.getFullYear()}-${z(agora.getMonth() + 1)}-${z(agora.getDate())}-${z(agora.getHours())}${z(agora.getMinutes())}${z(agora.getSeconds())}.${ext}`; }
  const seguro = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w.\-]+/g, "_").slice(-90);
  const caminho = `${k.id}/${agora.getTime()}-${seguro}`;
  toast("Enviando " + nome + "…");
  const up = await sb.storage.from(BUCKET).upload(caminho, f, { contentType: f.type || "application/octet-stream", upsert: false });
  if (up.error) return toast("Não foi possível enviar: " + up.error.message);
  const { error } = await sb.from("cq_anexos").insert({ cartao: k.id, caminho, nome, tipo: f.type || null, tamanho: f.size, user_id: S.user.id, autor: meuNome() });
  if (error) { await sb.storage.from(BUCKET).remove([caminho]); return toast("Não foi possível registrar o anexo: " + error.message); }
  await evento("anexou", nome, k.id, k.quadro);
  toast("Anexo incluído: " + nome); await carregarAnx(k); carregarHist(k.id); render();
}
async function carregarHist(id) {
  const { data } = await sb.from("cq_eventos").select("*").eq("cartao", id).order("em", { ascending: false }).limit(30);
  const el = $("#kH"); if (!el) return;
  el.innerHTML = (data || []).map(e => `<span>${dataHora(e.em)} · <b>${esc(e.nome || "")}</b> ${esc(e.acao)}${e.detalhe ? ": " + esc(e.detalhe) : ""}</span>`).join("") || "<span>Sem registros.</span>";
}

/* ---------- membros (só equipe Vital) ---------- */
async function abrirMembros() {
  const d = $("#dlgM");
  let pessoas = [];
  if (S.perfil.papel === "admin") { const { data } = await sb.from("perfis").select("user_id, nome, login, papel").order("nome"); pessoas = (data || []).filter(p => !S.mem.some(m => m.user_id === p.user_id)); }
  d.innerHTML = `<form method="dialog" class="dlg" style="grid-template-columns:minmax(0,1fr)">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:1.1rem">Membros · ${esc(S.q.nome)}</h2><button class="btn ghost sm" value="x" aria-label="Fechar">✕</button></div>
    <p class="note">Só os membros do cliente veem este quadro. A equipe Vital vê todos os quadros.</p>
    <div class="ck">${S.mem.map(m => `<label><span>${esc(m.nome)}</span><button class="x" type="button" data-u="${m.user_id}" aria-label="Remover ${esc(m.nome)}">Remover</button></label>`).join("")}</div>
    ${S.perfil.papel === "admin" ? `<div class="row" style="flex-wrap:nowrap"><select id="mP" aria-label="Pessoa"><option value="">Escolha um acesso…</option>${pessoas.map(p => `<option value="${p.user_id}">${esc(p.nome || p.login)}${p.login ? " (" + esc(p.login) + ")" : ""}</option>`).join("")}</select><button class="btn primary sm" type="button" id="mA">Incluir</button></div>
    <p class="note">Quem não aparece na lista ainda não tem acesso ao portal: crie em Área do cliente › Acessos.</p>` : `<p class="note">Para incluir pessoas, peça a um administrador da Vital.</p>`}
  </form>`;
  d.showModal();
  $$("[data-u]", d).forEach(b => b.onclick = async () => {
    const { error } = await sb.from("cq_membros").delete().eq("quadro", S.q.id).eq("user_id", b.dataset.u);
    if (error) return toast(error.message);
    S.mem = S.mem.filter(m => m.user_id !== b.dataset.u); abrirMembros(); render();
  });
  if ($("#mA")) $("#mA").onclick = async () => {
    const uid = $("#mP").value; if (!uid) return toast("Escolha a pessoa.");
    const p = pessoas.find(x => x.user_id === uid);
    const { error } = await sb.from("cq_membros").insert({ quadro: S.q.id, user_id: uid, nome: p.nome || p.login });
    if (error) return toast(error.message);
    S.mem.push({ quadro: S.q.id, user_id: uid, nome: p.nome || p.login }); S.mem.sort((a, b) => a.nome.localeCompare(b.nome)); abrirMembros(); render();
  };
}
$("#dlg").addEventListener("close", () => { S.abertoId = null; });
iniciar().catch(e => falha("Erro: " + e.message));
})();
</script>
